[graph]
targets = []

[licenses]
# Suppress warnings for allowed licenses not present in the current dep graph
# (dep-graph composition changes between dependency bumps).
unused-allowed-license = "allow"
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "OpenSSL",
  "Zlib",
  "CC0-1.0",
  "MPL-2.0",
  # BSD Zero Clause — more permissive than MIT, used by quoted_printable
  "0BSD",
  # Community Data License Agreement Permissive 2.0 — used by webpki-roots
  "CDLA-Permissive-2.0",
  # Boost Software License 1.0 — permissive, sometimes used without OR pairing
  "BSL-1.0",
  # The Unlicense — public domain dedication, sometimes used without OR pairing
  "Unlicense",
  # LGPL-2.1-or-later — appears in OR expressions (e.g. "MIT OR Apache-2.0 OR LGPL-2.1-or-later")
  # Listed here so it doesn't break if a crate ever uses it as its sole identifier
  "LGPL-2.1-or-later",
]
exceptions = [
  { allow = ["AGPL-3.0-or-later"], name = "oxide-sloc" },
  { allow = ["AGPL-3.0-or-later"], name = "sloc-config" },
  { allow = ["AGPL-3.0-or-later"], name = "sloc-core" },
  { allow = ["AGPL-3.0-or-later"], name = "sloc-languages" },
  { allow = ["AGPL-3.0-or-later"], name = "sloc-report" },
  { allow = ["AGPL-3.0-or-later"], name = "sloc-web" },
  { allow = ["AGPL-3.0-or-later"], name = "sloc-git" },
  { allow = ["AGPL-3.0-or-later"], name = "sloc-mcp" },
  # Transitive dep of headless_chrome (PDF generation); not distributed as a library.
  # cargo-deny (via askalono) identifies the GPLv3 file as GPL-3.0-or-later.
  { allow = ["GPL-3.0-or-later"], name = "auto_generate_cdp" },
]

# auto_generate_cdp uses license-file rather than an SPDX expression.
# cargo-deny (askalono) identifies the standard GPLv3 file as GPL-3.0-or-later.
# Hash computed with: python3 -c "import zlib,sys; print(hex(zlib.crc32(open(sys.argv[1],'rb').read())&0xffffffff))" vendor/auto_generate_cdp/LICENSE.txt
[[licenses.clarify]]
name = "auto_generate_cdp"
expression = "GPL-3.0-or-later"
license-files = [
  { path = "LICENSE.txt", hash = 0xba8ef827 },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Known transitive dependency version splits — acceptable duplicates.
skip = [
  { name = "getrandom", version = "0.2" },
  { name = "getrandom", version = "0.3" },
  # getrandom 0.4 pulled by uuid ≥ 1.23 and tempfile ≥ 3.27 (via headless_chrome)
  { name = "getrandom", version = "0.4" },
  { name = "r-efi", version = "5" },
  { name = "windows-sys", version = "0.52" },
  # thiserror v1 (via prometheus→protobuf) and v2 (via headless_chrome) coexist
  { name = "thiserror", version = "1" },
  { name = "thiserror-impl", version = "1" },
  { name = "wit-bindgen", version = "0.51" },
  # linux-raw-sys 0.4 (via rustix 0.38 → procfs → prometheus) and 0.12 (via rustix 1.x) coexist
  { name = "linux-raw-sys", version = "0.4" },
  { name = "linux-raw-sys", version = "0.12" },
  # base64 0.22 (headless_chrome / hyper-util) coexists with 0.23 (our direct dep)
  { name = "base64", version = "0.22" },
  # syn 2 (older proc-macros) and syn 3 (async-trait ≥ 0.1.91, clap_derive ≥ 4.6.4) coexist
  # during the proc-macro ecosystem's transition to syn 3
  { name = "syn", version = "2" },
]

[advisories]
version = 2
# Previously-ignored advisories are all resolved — lopdf is >= 0.42 (RUSTSEC-2026-0187
# patched), anyhow is on a fixed release (RUSTSEC-2026-0190), and printpdf 0.12 no longer
# pulls the unmaintained ttf-parser (RUSTSEC-2026-0192). Add a scoped ignore here only
# if a genuinely unreachable advisory surfaces.
ignore = [
  # basic-toml is unmaintained (not a vulnerability). It is pulled in transitively and
  # unavoidably by askama's compile-time proc-macro (askama -> askama_derive -> basic-toml);
  # it is not reachable from runtime code and there is no newer askama that drops it. Scoped
  # to the exact advisory so any real vulnerability still fails the gate. cargo-audit already
  # treats this as an allowed warning; this keeps cargo-deny consistent.
  "RUSTSEC-2026-0374",
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
