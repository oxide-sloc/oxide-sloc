---
# oxide-sloc GitLab CI/CD — full feature parity with the Jenkinsfile, done the
# GitLab-native way.
#
# Native GitLab surfaces used instead of Jenkins plugins:
#   • Tests tab / MR widget       ← artifacts:reports:junit          (cargo-nextest)
#   • Coverage % badge + MR diff  ← artifacts:reports:coverage_report + coverage: regex
#   • Code Quality MR widget      ← artifacts:reports:codequality    (clippy → CodeClimate)
#   • Report link in MR widget    ← artifacts:expose_as
#   • Browsable report site       ← GitLab Pages (pages job)
#   • Downstream / external scan  ← trigger: (parent-child / multi-project)
#
# Run-pipeline form: every knob below appears in CI/CD → Run pipeline with a
# description (the GitLab analogue of the Jenkinsfile `parameters {}` block).
#
# Masked CI/CD variables (Settings → CI/CD → Variables — NOT in the form):
#   SLOC_VCS_TOKEN        MR-comment token (scope: api)          — mr-comment job
#   SLOC_WEBHOOK_TOKEN    bearer token for `oxide-sloc send`     — deliver:webhook
#   SLOC_SMTP_HOST/USER/PASS   SMTP credentials                  — deliver:email
#   SLOC_CONFLUENCE_URL/USER/TOKEN/SPACE   Confluence creds      — notify:confluence
#   BITBUCKET_BASE_URL/TOKEN/USER/WORKSPACE/REPO   Bitbucket     — notify:bitbucket
#   SLOC_JIRA_URL/USER/TOKEN + SLOC_JIRA_ISSUE   Jira creds+key  — notify:jira
#   ARTIFACT_REPO_USER / ARTIFACT_REPO_PASS   artifact-repo creds — artifact-push
#
# Air-gap scope: this pipeline vendors the Rust *toolchain* (committed under
# toolchain/, extracted + pinned in the default before_script) and the Rust
# *crate sources* (vendor.tar.gz.* parts, checksum-verified + extracted, with cargo
# redirected to them). System packages (build-essential, gtk3, etc.) are NOT
# vendored — a fully offline runner needs them prebaked into the image (apt is
# skipped when they are already present; see apt_ensure) or reachable via an apt
# mirror. Internet-connected runners just use crates.io and apt normally.

# ── Global image / env ────────────────────────────────────────────────────────
# Official Rust image pinned by digest (update: docker pull rust:slim &&
# docker inspect --format '{{index .RepoDigests 0}}' rust:slim).
image: rust:slim@sha256:69153971349358535be9821190190f026a761f690c6b58c68a914d14ab2d610a

default:
  interruptible: true
  before_script:
    # Prepend the cargo bin dir using the shell's real PATH (see the note in
    # variables: — PATH must not be set there or it truncates to the empty string).
    - export PATH="${CARGO_HOME}/bin:${PATH}"
    # apt_ensure installs system packages only when some are missing, so a prebaked
    # air-gap image (packages already present) never touches the network, while a
    # networked runner installs them as before. Reused by the test/coverage jobs.
    # A missing package on an offline runner with no prebake fails here, which is
    # correct — the build cannot proceed without it.
    - |
      apt_ensure() {
        miss=""
        for p in "$@"; do dpkg -s "$p" >/dev/null 2>&1 || miss="$miss $p"; done
        [ -z "$miss" ] && return 0
        apt-get update -qq && apt-get install -y -qq $miss
      }
    - apt_ensure build-essential pkg-config libssl-dev ca-certificates git python3
    # Air-gap: the pinned image ships a different Rust than rust-toolchain.toml
    # pins, so on an offline runner `rustup show` (and every later cargo call)
    # would reach the network to sync the pinned channel and abort. Extract the
    # committed toolchain bundle into RUSTUP_HOME/CARGO_HOME instead. The bundle
    # installs e.g. 1.97.0-<triple> while the repo pins the "1.97" channel; offline
    # rustup would still try to sync the 1.97 channel manifest, so pin
    # RUSTUP_TOOLCHAIN to the exact bundled name. Networked runners with no bundle
    # just let rustup fetch as before.
    - |
      case "$(uname -m)" in
        aarch64|arm64) TC_PLAT=linux-arm64 ;;
        *)             TC_PLAT=linux-x86_64 ;;
      esac
      TC_CHANNEL="$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)"
      if ls "toolchain/rust-toolchain-${TC_PLAT}.tar.gz."* >/dev/null 2>&1 \
         && [ -z "$(ls -A "${RUSTUP_HOME}/toolchains" 2>/dev/null)" ]; then
        echo "Air-gap: verifying + extracting bundled Rust toolchain (${TC_PLAT})..."
        grep "rust-toolchain-${TC_PLAT}\.tar\.gz\." toolchain/checksums.sha256 \
          | sha256sum -c - || { echo "toolchain checksum verification failed" >&2; exit 1; }
        _tc_tmp="$(mktemp -d)"
        cat "toolchain/rust-toolchain-${TC_PLAT}.tar.gz."* | tar -xzf - -C "$_tc_tmp" \
          || { echo "toolchain extraction failed" >&2; exit 1; }
        mkdir -p "$RUSTUP_HOME" "$CARGO_HOME"
        cp -a "$_tc_tmp/rustup/." "$RUSTUP_HOME/"
        cp -a "$_tc_tmp/cargo/." "$CARGO_HOME/"
        rm -rf "$_tc_tmp"
      fi
      # Pin to the exact bundled toolchain, but only when it matches the pinned
      # channel (guards against a stale bundle after a toolchain bump).
      _tc="$(ls -d "${RUSTUP_HOME}/toolchains/"*/ 2>/dev/null | head -n1)"
      if [ -n "$_tc" ]; then
        _tc_name="$(basename "$_tc")"
        case "$_tc_name" in
          "${TC_CHANNEL}".*|"${TC_CHANNEL}"-*)
            export RUSTUP_TOOLCHAIN="$_tc_name"
            echo "Pinned RUSTUP_TOOLCHAIN=${_tc_name}" ;;
        esac
      fi
    - rustup show
    # Air-gap: extract the committed vendor archive and pin cargo to it.
    - |
      if ls vendor.tar.gz.* >/dev/null 2>&1 && [ ! -d vendor ]; then
        echo "Verifying vendor.tar.gz.* integrity..."
        sha256sum -c vendor.checksums.sha256
        echo "Reassembling and decompressing vendor.tar.gz.*..."
        cat vendor.tar.gz.* | tar -xzf -
        mkdir -p .cargo
        printf '[source.crates-io]\nreplace-with = "vendored-sources"\n\n[source.vendored-sources]\ndirectory = "vendor"\n' > .cargo/config.toml
      fi
  # Cache keyed on Cargo.lock: all branches share warm build output, busted only
  # when dependencies change. Leaf jobs pull; `build` does the single pull-push.
  cache:
    key:
      files:
        - Cargo.lock
    paths:
      - .cargo/
      - .rustup/
      - target/
      - vendor/
    policy: pull

# Only run for MRs, the default branch, tags, the Run-pipeline form, and
# parent-child triggers — never a duplicate branch+MR pipeline pair.
workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - if: '$CI_PIPELINE_SOURCE == "parent_pipeline"'

stages:
  - quality
  - build
  - test
  - analyze
  - deliver
  - publish
  - pages

# ── Variables (Run-pipeline form) ─────────────────────────────────────────────
variables:
  # Rust / cargo environment (plumbing; leave as-is).
  CARGO_HOME: "${CI_PROJECT_DIR}/.cargo"
  RUSTUP_HOME: "${CI_PROJECT_DIR}/.rustup"
  # NOTE: do NOT set PATH here. GitLab expands `variables:` values against its own
  # variable list, where PATH is undefined, so "${CI_PROJECT_DIR}/.cargo/bin:${PATH}"
  # collapses to ".../.cargo/bin:" and the job loses /usr/bin (apt/git stop
  # resolving). It is exported in before_script instead, where the shell's real
  # PATH is in scope.
  RUST_LOG: "warn"
  OUT_DIR: "ci-out"

  # — Scan configuration —
  CI_PRESET:
    value: "none"
    options: ["none", "default", "strict", "full-scope"]
    description: "Preset TOML applied to the scan (ci/sloc-ci-<preset>.toml). none = built-in defaults."
  SCAN_PATH:
    value: "."
    description: "Sub-path within the repo to analyze."
  REPORT_TITLE:
    value: ""
    description: "Title shown in the HTML/PDF/XLSX report (blank = auto)."
  MIXED_LINE_POLICY:
    value: ""
    options: ["", "code-only", "code-and-comment", "comment-only", "separate-mixed-category"]
    description: "How to classify a line holding both code and a comment (blank = config default)."
  DOCSTRINGS_AS_CODE:
    value: "false"
    options: ["false", "true"]
    description: "Count Python docstrings as code instead of comments."
  SUBMODULE_BREAKDOWN:
    value: "true"
    options: ["true", "false"]
    description: "Detect .gitmodules and emit per-submodule reports."
  FOLLOW_SYMLINKS:
    value: "false"
    options: ["false", "true"]
    description: "Follow symbolic links during file discovery."
  NO_IGNORE_FILES:
    value: "false"
    options: ["false", "true"]
    description: "Ignore .gitignore/.slocignore rules and scan everything."
  STYLE_COL_THRESHOLD:
    value: "80"
    options: ["80", "100", "120"]
    description: "Column-width threshold for the Code Style compliance chip."
  ACTIVITY_WINDOW:
    value: "90"
    description: "Git Hotspots activity window in days (0 disables)."
  ENABLED_LANGUAGES:
    value: ""
    description: "Comma-separated language filter (blank = all supported)."
  INCLUDE_GLOBS:
    value: ""
    description: "Comma-separated include glob patterns (blank = all files)."
  EXCLUDE_GLOBS:
    value: ""
    description: "Comma-separated exclude glob patterns."

  # — Output formats —
  GENERATE_HTML:
    value: "true"
    options: ["true", "false"]
    description: "Write the HTML report."
  GENERATE_PDF:
    value: "true"
    options: ["true", "false"]
    description: "Write the PDF report (pure-Rust, no browser)."

  # — Test & coverage —
  TEST_RUNNER:
    value: "cargo-nextest"
    options: ["cargo-nextest", "cargo-test"]
    description: "Test runner. nextest emits JUnit XML for the native Tests tab."
  COVERAGE_STANDALONE:
    value: "false"
    options: ["false", "true"]
    description: "Run the dedicated coverage job (llvm-cov → coverage badge + MR annotations)."
  COVERAGE_THRESHOLD:
    value: "0"
    description: "Minimum line-coverage %% required to pass (0 = disabled)."

  # — Git-ref comparison (MR pipelines) —
  COMPARE_TO_REF:
    value: ""
    description: "Baseline ref for the diff (blank on an MR = target branch)."
  COMPARE_TO_PREV_TAG:
    value: "false"
    options: ["false", "true"]
    description: "Use the previous release tag as the diff baseline."

  # — External-repo scan (optional) —
  TARGET_REPO_URL:
    value: ""
    description: "Scan an external repo instead of this one (git URL or path)."
  TARGET_REF:
    value: "HEAD"
    description: "Ref to scan when TARGET_REPO_URL is set."

  # — Delivery —
  WEBHOOK_URL:
    value: ""
    description: "POST result.json here after a successful scan (token: SLOC_WEBHOOK_TOKEN)."
  EMAIL_RECIPIENTS:
    value: ""
    description: "Comma-separated report recipients (creds: SLOC_SMTP_* masked vars)."
  SMTP_FROM:
    value: ""
    description: "From: address for the email report."

  # — Artifact repository push (all 7 backends via ci/artifact-push.sh) —
  ARTIFACT_REPO_TYPE:
    value: "none"
    options: ["none", "artifactory", "nexus", "nexus2", "s3", "minio", "azure-blob", "generic-http"]
    description: "External artifact repository backend."
  ARTIFACT_REPO_URL:
    value: ""
    description: "Base URL of the artifact repository."
  ARTIFACT_REPO_PATH:
    value: ""
    description: "Upload path prefix (blank = oxide-sloc/<project>/<pipeline-iid>)."
  ARTIFACT_REPO_EXTRA:
    value: ""
    description: "Provider-specific extra (Nexus repo, Azure container, MinIO endpoint, S3 flags)."
  ARTIFACT_GENERATE_MANIFEST:
    value: "false"
    options: ["false", "true"]
    description: "Upload a checksums.sha256 manifest alongside the artifacts."

  # — Downstream chaining —
  DOWNSTREAM_PROJECT:
    value: ""
    description: "Trigger this project's pipeline on success (namespace/project)."
  DOWNSTREAM_BRANCH:
    value: "main"
    description: "Branch of the downstream project to trigger."

# ── Reusable snippets ─────────────────────────────────────────────────────────
.on_mr:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

# ══════════════════════════════════════════════════════════════════════════════
# Quality gates
# ══════════════════════════════════════════════════════════════════════════════

fmt:
  stage: quality
  script:
    # Guard against status-masking shell pipes in Jenkins Groovy / ci shell (dash
    # makes `cmd | tail` report 0 even on failure). Fast, no rust needed.
    - bash ci/lint-pipeline-shell.sh
    - rustup component add rustfmt 2>/dev/null || true
    - cargo fmt --all -- --check

clippy:
  stage: quality
  script:
    - rustup component add clippy 2>/dev/null || true
    - cargo clippy --workspace --all-targets --all-features -- -D warnings

# Non-gating: surface every clippy diagnostic inline in the MR diff via the
# native Code Quality widget. The strict -D gate lives in the `clippy` job above.
codequality:
  stage: quality
  needs: []
  script:
    - rustup component add clippy 2>/dev/null || true
    - cargo clippy --workspace --all-targets --all-features --message-format=json > clippy.json || true
    - python3 ci/gitlab/clippy-to-codeclimate.py clippy.json gl-code-quality.json
  artifacts:
    reports:
      codequality: gl-code-quality.json
    paths:
      - gl-code-quality.json
    expire_in: 7 days
    when: always
  rules:
    - when: always

# ══════════════════════════════════════════════════════════════════════════════
# Build
# ══════════════════════════════════════════════════════════════════════════════

build:
  stage: build
  needs: []
  cache:
    key:
      files:
        - Cargo.lock
    paths:
      - .cargo/
      - .rustup/
      - target/
      - vendor/
    policy: pull-push
  script:
    - cargo build --release -p oxide-sloc
  artifacts:
    paths:
      - target/release/oxide-sloc
    expire_in: 1 hour

# ══════════════════════════════════════════════════════════════════════════════
# Test — JUnit (native Tests tab) + Coverage (native badge + MR annotations)
# ══════════════════════════════════════════════════════════════════════════════

test:
  stage: test
  needs: []
  # --all-features enables the native-dialog/rfd feature, which needs the
  # gtk3/xdo/wayland devel headers on Linux (same as the coverage job below) —
  # without them the build fails before any test runs.
  script:
    - apt_ensure libgtk-3-dev libxdo-dev libwayland-dev
    - |
      # rust:slim ships no cargo-nextest and nothing else in this file installs
      # it, so the probe below always failed → silent fallback to `cargo test` →
      # no junit.xml → an empty Tests tab on a green job. Install it offline from
      # the committed vendor set (verified working), with an online fallback for
      # networked runners that lack the vendor archive. Do NOT add --locked to the
      # offline `--path` install: nextest's bundled lock wants chrono 0.4.44 while
      # the vendor set carries 0.4.45 by design (see ci/tools/Cargo.toml).
      if [ "${TEST_RUNNER}" = "cargo-nextest" ] && ! cargo nextest --version >/dev/null 2>&1; then
        if [ -d vendor/cargo-nextest ]; then
          mkdir -p /tmp/ci-tools && cp -r vendor/cargo-nextest /tmp/ci-tools/
          cargo install --offline --path /tmp/ci-tools/cargo-nextest \
            || cargo install cargo-nextest --locked
        else
          cargo install cargo-nextest --locked
        fi
      fi
    - |
      if [ "${TEST_RUNNER}" = "cargo-nextest" ] && cargo nextest --version >/dev/null 2>&1; then
        echo "Running cargo-nextest (JUnit output)"
        # Capture the status so a failing test run STILL yields a populated Tests
        # tab: without this, `cargo nextest run` aborting under set -e skips the
        # copy below — exactly when the junit report matters most.
        rc=0
        cargo nextest run --workspace --all-features --profile ci || rc=$?
        # Copy the JUnit report if nextest wrote one, then exit with the captured
        # status. Explicit if/then/fi (not `[ -f … ] && cp …`) keeps the flow
        # before `exit "$rc"` unambiguous under `set -e` across shells.
        if [ -f target/nextest/ci/junit.xml ]; then
          cp target/nextest/ci/junit.xml junit.xml
        fi
        exit "$rc"
      else
        echo "Running cargo test (no JUnit report)"
        cargo test --workspace --all-features
      fi
  artifacts:
    when: always
    paths:
      - junit.xml
    reports:
      junit: junit.xml
    expire_in: 7 days

coverage:
  stage: test
  needs: []
  # llvm-cov --all-features pulls in rfd/native-dialog → needs gtk3/xdo/wayland
  # devel headers on Linux (generate-coverage.sh hard-fails early otherwise).
  script:
    - apt_ensure libgtk-3-dev libxdo-dev libwayland-dev
    - rustup component add llvm-tools 2>/dev/null || true
    - bash ci/sonar/generate-coverage.sh coverage
    - cat coverage/coverage-summary.txt
    - |
      if [ "${COVERAGE_THRESHOLD:-0}" != "0" ]; then
        pct=$(sed -n 's/.*Line coverage[^0-9]*\([0-9.]*\)%.*/\1/p' coverage/coverage-summary.txt | head -n1)
        echo "Line coverage ${pct}% (threshold ${COVERAGE_THRESHOLD}%)"
        awk "BEGIN { exit !(${pct:-0} >= ${COVERAGE_THRESHOLD}) }" \
          || { echo "Coverage ${pct}% is below threshold ${COVERAGE_THRESHOLD}%"; exit 1; }
      fi
  coverage: '/Line coverage\s*:\s*(\d+\.\d+)%/'
  artifacts:
    paths:
      - coverage/
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage/sonar-coverage.xml
    expire_in: 7 days
  rules:
    - if: '$COVERAGE_STANDALONE == "true"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - when: manual
      allow_failure: true

# ══════════════════════════════════════════════════════════════════════════════
# CLI smoke tests (map to web-UI configuration paths)
# ══════════════════════════════════════════════════════════════════════════════

smoke:plain:
  stage: test
  needs: [build]
  script:
    - ./target/release/oxide-sloc analyze testing/fixtures/basic --plain

smoke:per-file:
  stage: test
  needs: [build]
  script:
    - ./target/release/oxide-sloc analyze testing/fixtures/basic --per-file --plain

smoke:policies:
  stage: test
  needs: [build]
  script:
    - |
      for policy in code-only code-and-comment comment-only separate-mixed-category; do
        echo "--- policy: $policy ---"
        ./target/release/oxide-sloc analyze testing/fixtures/basic \
          --plain --mixed-line-policy "$policy"
      done

smoke:web-ui:
  stage: test
  needs: [build]
  script:
    - ./target/release/oxide-sloc serve &
    - SERVER_PID=$!
    - sleep 4
    - HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:4317/ || echo "000")
    - kill "${SERVER_PID}" 2>/dev/null || true
    - wait "${SERVER_PID}" 2>/dev/null || true
    - '[ "${HTTP_CODE}" = "200" ] || (echo "Web UI returned HTTP ${HTTP_CODE}" && exit 1)'

# ══════════════════════════════════════════════════════════════════════════════
# Analyze — the main SLOC scan (mirrors Jenkins runAnalyze)
# ══════════════════════════════════════════════════════════════════════════════

analyze:
  stage: analyze
  needs:
    - job: build
      artifacts: true
    - job: coverage
      artifacts: true
      optional: true
  script:
    - mkdir -p "${OUT_DIR}"
    - |
      set -e
      BIN=./target/release/oxide-sloc
      args=(analyze "${SCAN_PATH:-.}")
      args+=(--json-out "${OUT_DIR}/result.json")
      args+=(--csv-out  "${OUT_DIR}/report.csv")
      args+=(--xlsx-out "${OUT_DIR}/report.xlsx")
      args+=(--scan-config-out "${OUT_DIR}/scan-config.json")
      [ "${GENERATE_HTML}" = "true" ] && args+=(--html-out "${OUT_DIR}/report.html")
      [ "${GENERATE_PDF}"  = "true" ] && args+=(--pdf-out  "${OUT_DIR}/report.pdf")
      [ "${CI_PRESET}" != "none" ] && [ -n "${CI_PRESET}" ] && args+=(--config "ci/sloc-ci-${CI_PRESET}.toml")
      [ -n "${MIXED_LINE_POLICY}" ] && args+=(--mixed-line-policy "${MIXED_LINE_POLICY}")
      [ "${DOCSTRINGS_AS_CODE}" = "true" ] && args+=(--python-docstrings-as-code)
      [ "${FOLLOW_SYMLINKS}"   = "true" ] && args+=(--follow-symlinks)
      [ "${NO_IGNORE_FILES}"   = "true" ] && args+=(--no-ignore-files)
      [ -n "${STYLE_COL_THRESHOLD}" ] && args+=(--style-col-threshold "${STYLE_COL_THRESHOLD}")
      [ -n "${ACTIVITY_WINDOW}" ] && args+=(--activity-window "${ACTIVITY_WINDOW}")
      [ -n "${REPORT_TITLE}" ] && args+=(--report-title "${REPORT_TITLE}")
      [ -n "${CI_COMMIT_REF_NAME}" ] && args+=(--git-branch "${CI_COMMIT_REF_NAME}")
      if [ "${SUBMODULE_BREAKDOWN}" = "true" ]; then
        args+=(--submodule-breakdown --sub-html-out-dir "${OUT_DIR}")
      fi
      # Repeatable flags from comma-separated inputs.
      IFS=',' read -ra _langs <<< "${ENABLED_LANGUAGES}"
      for l in "${_langs[@]}"; do [ -n "$l" ] && args+=(--enabled-language "$l"); done
      IFS=',' read -ra _inc <<< "${INCLUDE_GLOBS}"
      for g in "${_inc[@]}"; do [ -n "$g" ] && args+=(--include-glob "$g"); done
      IFS=',' read -ra _exc <<< "${EXCLUDE_GLOBS}"
      for g in "${_exc[@]}"; do [ -n "$g" ] && args+=(--exclude-glob "$g"); done
      # Attach per-file coverage if the coverage job produced it.
      [ -f coverage/lcov.info ] && args+=(--coverage-file coverage/lcov.info)
      echo "+ ${BIN} ${args[*]}"
      "${BIN}" "${args[@]}"
    - test -s "${OUT_DIR}/result.json"
    - test -s "${OUT_DIR}/report.csv"
  artifacts:
    name: "sloc-report-${CI_COMMIT_SHORT_SHA}"
    paths:
      - ${OUT_DIR}/
    expose_as: "SLOC report"
    expire_in: 30 days

# Optional: scan an external repository instead of this one.
analyze-external:
  stage: analyze
  needs:
    - job: build
      artifacts: true
  # No local checkout needed — git-scan clones TARGET_REPO_URL itself. The
  # default before_script still runs (installs git, which git-scan requires).
  variables:
    GIT_STRATEGY: none
  script:
    - mkdir -p "${OUT_DIR}"
    - |
      ./target/release/oxide-sloc git-scan "${TARGET_REPO_URL}" \
        --git-ref "${TARGET_REF}" \
        --json-out "${OUT_DIR}/result.json" \
        --html-out "${OUT_DIR}/report.html" \
        --csv-out  "${OUT_DIR}/report.csv"
    - test -s "${OUT_DIR}/result.json"
  artifacts:
    paths:
      - ${OUT_DIR}/
    expose_as: "SLOC report (external)"
    expire_in: 30 days
  rules:
    - if: '$TARGET_REPO_URL != ""'

# ── Git-ref diff on merge requests ────────────────────────────────────────────
# Compares the checked-out tree against the target branch (or previous tag),
# mirroring Jenkins COMPARE_TO_REF/COMPARE_TO_PREV_TAG. Uses a git worktree +
# two analyze runs + `oxide-sloc diff` (git-compare only accepts remote URLs,
# not the local checkout). Emits base.json (for the MR comment baseline) plus
# diff.json/diff.csv.
ref-diff:
  stage: analyze
  needs:
    - job: build
      artifacts: true
  variables:
    GIT_DEPTH: "0"
  script:
    - mkdir -p "${OUT_DIR}"
    - |
      set -e
      BIN=./target/release/oxide-sloc
      SUB="${SCAN_PATH:-.}"
      if [ "${COMPARE_TO_PREV_TAG}" = "true" ]; then
        git fetch -q --tags || true
        BASE=$(git tag --sort=-version:refname | sed -n '1p')
      elif [ -n "${COMPARE_TO_REF}" ]; then
        BASE="${COMPARE_TO_REF}"
      else
        BASE="${CI_MERGE_REQUEST_TARGET_BRANCH_NAME:-$CI_DEFAULT_BRANCH}"
        git fetch -q origin "${BASE}" || true
        BASE="origin/${BASE}"
      fi
      echo "Diffing checked-out tree against baseline: ${BASE}"
      # Scan the current tree BEFORE materializing the baseline worktree, so the
      # worktree copy is never swept into the current scan.
      "${BIN}" analyze "${SUB}" --activity-window 0 --quiet \
        --json-out "${OUT_DIR}/current.json"
      rm -rf .sloc-base
      git worktree add --detach .sloc-base "${BASE}"
      "${BIN}" analyze ".sloc-base/${SUB#./}" --activity-window 0 --quiet \
        --json-out "${OUT_DIR}/base.json"
      git worktree remove --force .sloc-base || true
      "${BIN}" diff "${OUT_DIR}/base.json" "${OUT_DIR}/current.json" \
        --json-out "${OUT_DIR}/diff.json" \
        --csv-out  "${OUT_DIR}/diff.csv"
  artifacts:
    paths:
      - ${OUT_DIR}/base.json
      - ${OUT_DIR}/diff.json
      - ${OUT_DIR}/diff.csv
    expire_in: 7 days
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$COMPARE_TO_REF != ""'
    - if: '$COMPARE_TO_PREV_TAG == "true"'

# ══════════════════════════════════════════════════════════════════════════════
# Deliver — MR comment, webhook, email, Confluence, Bitbucket
# ══════════════════════════════════════════════════════════════════════════════

# Native MR comment (uses GitLab project ID + MR IID directly).
mr-comment:
  stage: deliver
  needs:
    - job: analyze
      artifacts: true
    - job: ref-diff
      artifacts: true
      optional: true
  script:
    - |
      base_flag=""
      [ -f "${OUT_DIR}/base.json" ] && base_flag="--baseline ${OUT_DIR}/base.json"
      ./target/release/oxide-sloc pr-comment "${OUT_DIR}/result.json" $base_flag \
        --provider gitlab \
        --api-url "${CI_SERVER_URL}" \
        --repo "${CI_PROJECT_ID}" \
        --pr-number "${CI_MERGE_REQUEST_IID}" \
        --token "${SLOC_VCS_TOKEN}"
  allow_failure: true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $SLOC_VCS_TOKEN != ""'

deliver:webhook:
  stage: deliver
  needs:
    - job: analyze
      artifacts: true
  script:
    - |
      ./target/release/oxide-sloc send "${OUT_DIR}/result.json" \
        --webhook-url "${WEBHOOK_URL}" \
        ${SLOC_ALLOW_PRIVATE_WEBHOOK:+--allow-private-net}
  rules:
    - if: '$WEBHOOK_URL != ""'

deliver:email:
  stage: deliver
  needs:
    - job: analyze
      artifacts: true
  script:
    - |
      ./target/release/oxide-sloc send "${OUT_DIR}/result.json" \
        --smtp-to "${EMAIL_RECIPIENTS}" \
        ${SMTP_FROM:+--smtp-from "${SMTP_FROM}"}
  rules:
    - if: '$EMAIL_RECIPIENTS != ""'

# Native Confluence publish (oxide-sloc send --confluence-*). Reads
# SLOC_CONFLUENCE_URL/USER/TOKEN/SPACE from masked CI variables. The richer
# page layout of ci/jenkins/notify-confluence.py remains available (see docs).
notify:confluence:
  stage: deliver
  needs:
    - job: analyze
      artifacts: true
  script:
    - |
      ./target/release/oxide-sloc send "${OUT_DIR}/result.json" \
        --confluence-page-title "oxide-sloc — ${CI_PROJECT_PATH}" \
        ${CI_PAGES_URL:+--confluence-report-url "${CI_PAGES_URL}"}
  rules:
    - if: '$SLOC_CONFLUENCE_URL != "" && $SLOC_CONFLUENCE_SPACE != ""'

# Bitbucket commit build-status via the shared, plugin-independent REST script.
notify:bitbucket:
  stage: deliver
  needs:
    - job: analyze
      artifacts: true
  variables:
    GIT_COMMIT: "${CI_COMMIT_SHA}"
    BUILD_KEY: "${CI_PROJECT_PATH_SLUG}"
    BUILD_NAME: "oxide-sloc CI"
    BUILD_URL: "${CI_PIPELINE_URL}"
    REPORT_URL: "${CI_PAGES_URL}"
  script:
    - bash ci/jenkins/notify-bitbucket.sh SUCCESSFUL
  rules:
    - if: '$BITBUCKET_BASE_URL != ""'

# Native Jira issue comment (oxide-sloc jira). Reads SLOC_JIRA_URL/USER/TOKEN
# from masked CI variables and SLOC_JIRA_ISSUE (the target issue key, e.g.
# ENG-1234). Targets on-premises Jira Server/Data Center (built-in REST, no
# marketplace app); Atlassian Cloud is auto-detected as a fallback.
notify:jira:
  stage: deliver
  needs:
    - job: analyze
      artifacts: true
  script:
    - |
      ./target/release/oxide-sloc jira "${OUT_DIR}/result.json" \
        --mode comment \
        ${CI_PAGES_URL:+--report-url "${CI_PAGES_URL}"}
  allow_failure: true
  rules:
    - if: '$SLOC_JIRA_URL != "" && $SLOC_JIRA_TOKEN != "" && $SLOC_JIRA_ISSUE != ""'

# ══════════════════════════════════════════════════════════════════════════════
# Publish — artifact repository push (all 7 backends) + downstream trigger
# ══════════════════════════════════════════════════════════════════════════════

# Supersedes the old nexus:push job: drives ci/artifact-push.sh across
# artifactory / nexus / nexus2 / s3 / minio / azure-blob / generic-http.
# (NEXUS_REPO_URL etc. still work — see the compatibility shim below.)
artifact-push:
  stage: publish
  needs:
    - job: build
      artifacts: true
    - job: analyze
      artifacts: true
    - job: test
      artifacts: true
      optional: true
    - job: coverage
      artifacts: true
      optional: true
    - job: ref-diff
      artifacts: true
      optional: true
  script:
    - |
      set -e
      # Back-compat: fall back to the old NEXUS_* variables if the generic ones
      # are unset (the previous nexus:push interface).
      : "${ARTIFACT_REPO_TYPE:=${NEXUS_REPO_URL:+nexus}}"
      : "${ARTIFACT_REPO_URL:=${NEXUS_REPO_URL:-}}"
      : "${ARTIFACT_REPO_USER:=${NEXUS_USER:-}}"
      : "${ARTIFACT_REPO_PASS:=${NEXUS_PASS:-}}"
      : "${ARTIFACT_REPO_EXTRA:=${NEXUS_REPO_NAME:-}}"
      if [ -z "${ARTIFACT_REPO_TYPE}" ] || [ "${ARTIFACT_REPO_TYPE}" = "none" ] || [ -z "${ARTIFACT_REPO_URL}" ]; then
        echo "No artifact repository configured (ARTIFACT_REPO_TYPE/URL) — nothing to push."
        exit 0
      fi
      STAGE="${CI_PROJECT_DIR}/artifact-upload"
      mkdir -p "${STAGE}"
      FILES=""
      stage() { [ -f "$1" ] && cp "$1" "${STAGE}/$2" && FILES="${FILES} $2" && echo "  staged: $2"; }
      stage "target/release/oxide-sloc"     "oxide-sloc"
      stage "${OUT_DIR}/result.json"        "result.json"
      stage "${OUT_DIR}/report.html"        "report.html"
      stage "${OUT_DIR}/report.pdf"         "report.pdf"
      stage "${OUT_DIR}/report.csv"         "report.csv"
      stage "${OUT_DIR}/report.xlsx"        "report.xlsx"
      stage "junit.xml"                     "junit.xml"
      stage "coverage/lcov.info"            "lcov.info"
      stage "coverage/sonar-coverage.xml"   "sonar-coverage.xml"
      stage "${OUT_DIR}/diff.json"          "diff.json"
      stage "${OUT_DIR}/diff.csv"           "diff.csv"
      FILES="${FILES# }"
      [ -z "${FILES}" ] && { echo "No artifact files found to push."; exit 0; }
      ARTIFACT_REPO_TYPE="${ARTIFACT_REPO_TYPE}" \
      ARTIFACT_REPO_URL="${ARTIFACT_REPO_URL}" \
      ARTIFACT_REPO_PATH="${ARTIFACT_REPO_PATH:-oxide-sloc/${CI_PROJECT_NAME}/${CI_PIPELINE_IID}}" \
      ARTIFACT_REPO_EXTRA="${ARTIFACT_REPO_EXTRA:-sloc-raw-hosted}" \
      ARTIFACT_REPO_USER="${ARTIFACT_REPO_USER:-}" \
      ARTIFACT_REPO_PASS="${ARTIFACT_REPO_PASS:-}" \
      ARTIFACT_DIR="${STAGE}" \
      ARTIFACT_FILES="${FILES}" \
      ARTIFACT_GENERATE_MANIFEST="${ARTIFACT_GENERATE_MANIFEST:-false}" \
      bash ci/artifact-push.sh
  rules:
    - if: '$ARTIFACT_REPO_TYPE != "" && $ARTIFACT_REPO_TYPE != "none"'
    - if: '$NEXUS_REPO_URL != ""'
    - when: manual
      allow_failure: true

# Downstream / multi-project pipeline chaining (Jenkins DOWNSTREAM_JOB).
trigger-downstream:
  stage: publish
  needs: [analyze]
  trigger:
    project: "${DOWNSTREAM_PROJECT}"
    branch: "${DOWNSTREAM_BRANCH}"
    strategy: depend
  rules:
    - if: '$DOWNSTREAM_PROJECT != ""'

# ══════════════════════════════════════════════════════════════════════════════
# Pages — browsable HTML report + coverage site (default branch)
# ══════════════════════════════════════════════════════════════════════════════

pages:
  stage: pages
  needs:
    - job: analyze
      artifacts: true
    - job: coverage
      artifacts: true
      optional: true
  script:
    - rm -rf public && mkdir -p public
    - cp -r ${OUT_DIR}/. public/ 2>/dev/null || true
    - '[ -f public/report.html ] && cp public/report.html public/index.html || true'
    - '[ -d coverage/html ] && mkdir -p public/coverage && cp -r coverage/html/. public/coverage/ || true'
  artifacts:
    paths:
      - public
    expire_in: 30 days
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
