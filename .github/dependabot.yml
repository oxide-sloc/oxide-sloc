version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 5
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-patch"]
      - dependency-name: "printpdf"
        versions: [">=0.8.0"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 5
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    groups:
      # All github/codeql-action/* steps must share one version — a split bump
      # leaves init/analyze/upload-sarif mismatched and CodeQL refuses to run.
      # Group them so Dependabot bumps them together in a single PR.
      codeql-action:
        patterns:
          - "github/codeql-action*"
