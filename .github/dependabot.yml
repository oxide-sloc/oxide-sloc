version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 5
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    groups:
      # Batch all minor crate updates into one weekly PR → one Cargo.lock change →
      # one vendor re-commit, instead of up to 5 separate ~112 MB vendor regenerations
      # that accelerate .git growth between history purges. Majors stay individual so
      # breaking-change bumps still get their own review.
      cargo-minor:
        update-types:
          - "minor"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-patch"]
      - dependency-name: "printpdf"
        versions: [">=0.8.0"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 5
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    groups:
      # All github/codeql-action/* steps must share one version — a split bump
      # leaves init/analyze/upload-sarif mismatched and CodeQL refuses to run.
      # Group them so Dependabot bumps them together in a single PR.
      codeql-action:
        patterns:
          - "github/codeql-action*"
