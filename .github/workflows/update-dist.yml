name: Update dist bundles

# Run manually from the Actions tab, or automatically after every release tag.
# Builds fresh platform binaries, packages them as zip / tar.gz, builds an RPM
# for RHEL 8/9, and uploads everything as assets on the corresponding GitHub release.
#
# The Linux binary is built inside a UBI 8 container (Dockerfile.rhel-build) so
# it links against glibc 2.28 and is forward-compatible with RHEL 8, 9 and 10.
# It is then smoke-tested on both UBI 8 and UBI 9 before release.
on:
  workflow_run:
    workflows: ["Release"]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to upload assets to (e.g. v1.3.1)'
        required: true

permissions: {}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true  # opt in ahead of the June 2026 forced migration

jobs:
  # ── Build each platform binary ────────────────────────────────────────────
  build:
    name: Build ${{ matrix.target }}
    # Only run when: manually dispatched with a tag input, OR triggered by a Release workflow
    # that ran on an actual tag (not a workflow_dispatch branch run where head_branch = 'main').
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       startsWith(github.event.workflow_run.head_branch, 'v'))
    permissions:
      contents: read
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: oxide-sloc.exe
            bundle: oxide-sloc-windows-x64.zip

    steps:
      - name: Validate dispatch tag input
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          if [[ ! "$INPUT_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z]+)*$ ]]; then
            echo "::error::Invalid tag input '$INPUT_TAG' — expected vMAJOR.MINOR.PATCH (e.g. v1.3.1)"
            exit 1
          fi

      # Resolve the release tag BEFORE checkout. A workflow_run-triggered job that
      # checks out with no `ref:` gets main@HEAD, NOT the tagged commit — which is
      # one release behind. Build the dist artifact from the tag's exact source.
      - name: Resolve release tag
        id: tag
        shell: bash
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
          WORKFLOW_RUN_TAG: ${{ github.event.workflow_run.head_branch }}
        run: |
          TAG="${INPUT_TAG:-${WORKFLOW_RUN_TAG:-$REF_NAME}}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Resolved release tag: $TAG"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ steps.tag.outputs.tag }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772  # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
        with:
          key: dist-${{ matrix.target }}

      - name: Add cross-compilation target
        run: rustup target add ${{ matrix.target }}

      - name: Build
        run: bash ci/release.sh ${{ matrix.target }}

      # Hard gate: the built exe MUST self-report the release tag's version, or the
      # dist zip would ship a stale binary (the "dist lags release by one version"
      # bug). Fail here — before packaging — if it doesn't match.
      - name: Assert binary version matches release tag
        shell: bash
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          TARGET: ${{ matrix.target }}
        run: |
          EXPECTED="${TAG#v}"
          ACTUAL="$("target/${TARGET}/release/oxide-sloc.exe" --version \
            | grep -oE '[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z]+)*' | head -1)"
          echo "Expected version: $EXPECTED"
          echo "Binary  version: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "::error::could not parse a version from 'oxide-sloc.exe --version'"
            exit 1
          fi
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::Windows dist binary version ($ACTUAL) != release tag ($EXPECTED). Refusing to package a mismatched dist artifact."
            exit 1
          fi
          echo "OK: Windows dist binary version matches release tag ($EXPECTED)"

      - name: Sign Windows binary
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if (-not $env:WINDOWS_CERTIFICATE) {
            Write-Output "WINDOWS_CERTIFICATE secret not set — binary will be unsigned."
            exit 0
          }
          $ErrorActionPreference = 'Stop'
          $signtool = (Get-Item 'C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe' `
            -ErrorAction SilentlyContinue |
            Sort-Object FullName -Descending |
            Select-Object -First 1).FullName
          if (-not $signtool) {
            $signtool = (Get-Command signtool.exe -ErrorAction SilentlyContinue)?.Source
          }
          if (-not $signtool) { throw "signtool.exe not found in Windows Kits or PATH" }
          Write-Output "Using signtool: $signtool"
          $certBytes = [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE)
          $certPath  = Join-Path $env:RUNNER_TEMP "signing.pfx"
          [IO.File]::WriteAllBytes($certPath, $certBytes)
          & $signtool sign /f $certPath /p $env:WINDOWS_CERTIFICATE_PASSWORD `
            /tr http://timestamp.digicert.com /td sha256 /fd sha256 `
            /d "OxideSLOC" /du "https://github.com/oxide-sloc/oxide-sloc" `
            "target\${{ matrix.target }}\release\oxide-sloc.exe"
          if ($LASTEXITCODE -ne 0) {
            Remove-Item -Force $certPath -ErrorAction SilentlyContinue
            throw "signtool sign failed with exit code $LASTEXITCODE"
          }
          Remove-Item -Force $certPath
          Write-Output "Binary signed successfully."

      - name: Package — Windows zip + tar.gz
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Copy-Item "target\${{ matrix.target }}\release\oxide-sloc.exe" "oxide-sloc.exe"
          Compress-Archive -Path oxide-sloc.exe -DestinationPath ${{ matrix.bundle }} -Force
          # Also produce a .tar.gz from the SAME (signed) exe. install.sh prefers this
          # archive on locked-down hosts where `unzip` is absent and PowerShell is
          # restricted (Constrained Language Mode / AllSigned) but GNU tar — bundled
          # with Git Bash — is available. Both archives MUST contain the identical
          # binary; commit-dist-windows hard-asserts byte-equality before committing.
          tar -czf oxide-sloc-windows-x64.tar.gz oxide-sloc.exe

      - name: Upload zip bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: ${{ matrix.bundle }}
          path: ${{ matrix.bundle }}

      - name: Upload tar.gz bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: oxide-sloc-windows-x64.tar.gz
          path: oxide-sloc-windows-x64.tar.gz

  # ── Build the Linux binary inside a UBI 8 container ───────────────────────
  # Compiles against glibc 2.28 (Dockerfile.rhel-build) so the artifact runs on
  # RHEL 8, 9 and 10. BuildKit exports just the bare binary to ./out, which is
  # then packaged as the canonical oxide-sloc-linux-x86_64.tar.gz.
  build-linux:
    name: Build Linux (RHEL 8/9 · UBI 8)
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       startsWith(github.event.workflow_run.head_branch, 'v'))
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Validate dispatch tag input
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          if [[ ! "$INPUT_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z]+)*$ ]]; then
            echo "::error::Invalid tag input '$INPUT_TAG' — expected vMAJOR.MINOR.PATCH (e.g. v1.3.1)"
            exit 1
          fi

      # Resolve the release tag BEFORE checkout. A workflow_run-triggered job that
      # checks out with no `ref:` gets main@HEAD, NOT the tagged commit — which is
      # one release behind, since main advances past the version-bump/tag commit.
      # We must build the dist artifact from the tag's exact source.
      - name: Resolve release tag
        id: tag
        env:
          GH_EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
          WORKFLOW_RUN_TAG: ${{ github.event.workflow_run.head_branch }}
        run: |
          TAG="${INPUT_TAG:-${WORKFLOW_RUN_TAG:-$REF_NAME}}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Resolved release tag: $TAG"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ steps.tag.outputs.tag }}

      - name: Build binary in UBI 8 container
        env:
          DOCKER_BUILDKIT: '1'
        run: |
          docker build \
            --file Dockerfile.rhel-build \
            --output type=local,dest=./out \
            .
          test -f out/oxide-sloc || { echo "::error::UBI 8 build produced no binary"; exit 1; }
          chmod +x out/oxide-sloc

      # Hard gate: the built binary MUST self-report the release tag's version.
      # This is what catches the "dist artifact lags the release by one version"
      # bug — if the checkout (or a stale Cargo.toml on the tag) produced a binary
      # for a different version, fail the job BEFORE the tarball is packaged.
      - name: Assert binary version matches release tag
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          EXPECTED="${TAG#v}"
          ACTUAL="$(./out/oxide-sloc --version | grep -oE '[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z]+)*' | head -1)"
          echo "Expected version: $EXPECTED"
          echo "Binary  version: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "::error::could not parse a version from './oxide-sloc --version'"
            exit 1
          fi
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::Linux dist binary version ($ACTUAL) != release tag ($EXPECTED). Refusing to package a mismatched dist artifact."
            exit 1
          fi
          echo "OK: Linux dist binary version matches release tag ($EXPECTED)"

      - name: Verify glibc floor (must not exceed 2.28 / RHEL 8)
        run: |
          # Every versioned GLIBC symbol the binary imports must be <= 2.28, or it
          # will fail to load on RHEL 8. objdump -T lists dynamic symbol versions.
          reqs="$(objdump -T out/oxide-sloc 2>/dev/null \
            | grep -oE 'GLIBC_[0-9]+\.[0-9]+(\.[0-9]+)?' | sed 's/GLIBC_//' | sort -uV || true)"
          echo "Required GLIBC symbol versions:"
          echo "${reqs:-  (none — fully static)}"
          maxg="$(echo "$reqs" | tail -1)"
          if [ -n "$maxg" ] && [ "$(printf '%s\n2.28\n' "$maxg" | sort -V | tail -1)" != "2.28" ]; then
            echo "::error::binary requires GLIBC_$maxg > 2.28 — would not load on RHEL 8"
            exit 1
          fi
          echo "OK: highest required GLIBC is ${maxg:-none} (<= 2.28)"

      - name: Package — Linux tar.gz
        run: |
          cp out/oxide-sloc /tmp/oxide-sloc
          tar czf oxide-sloc-linux-x86_64.tar.gz -C /tmp oxide-sloc

      - name: Upload bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: oxide-sloc-linux-x86_64.tar.gz
          path: oxide-sloc-linux-x86_64.tar.gz

  # ── Build RHEL RPM from the Linux binary ─────────────────────────────────
  # Produces an RPM that installs only /usr/local/bin/oxide-sloc.
  # No Rust toolchain extraction on the target — safe for Carbon Black / Trellix.
  build-rpm:
    name: Build RHEL RPM
    needs: build-linux
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      rpm_name: ${{ steps.build.outputs.rpm_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Download Linux bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: oxide-sloc-linux-x86_64.tar.gz
          path: dist/

      - name: Install rpmbuild
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends rpm

      - name: Build RPM
        id: build
        env:
          GH_EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
          WORKFLOW_RUN_TAG: ${{ github.event.workflow_run.head_branch }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ "$GH_EVENT_NAME" == "workflow_dispatch" ]]; then
            VERSION="${INPUT_TAG#v}"
          elif [[ -n "$WORKFLOW_RUN_TAG" ]]; then
            VERSION="${WORKFLOW_RUN_TAG#v}"
          fi
          bash scripts/internal/make-rpm.sh "$VERSION" ""
          RPM_NAME="$(ls oxide-sloc-*.rpm | head -1)"
          echo "rpm_name=$RPM_NAME" >> "$GITHUB_OUTPUT"

      - name: Upload RPM artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: oxide-sloc-rpm
          path: oxide-sloc-*.rpm

  # ── Build Debian / Ubuntu DEB from the Linux binary ──────────────────────
  build-deb:
    name: Build DEB package
    needs: build-linux
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      deb_name: ${{ steps.build.outputs.deb_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Download Linux bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: oxide-sloc-linux-x86_64.tar.gz
          path: dist/

      - name: Install nfpm
        run: |
          NFPM_VERSION=2.40.0
          curl -fsSL \
            "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/nfpm_${NFPM_VERSION}_amd64.deb" \
            -o /tmp/nfpm.deb
          sudo dpkg -i /tmp/nfpm.deb

      - name: Build DEB
        id: build
        env:
          GH_EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
          WORKFLOW_RUN_TAG: ${{ github.event.workflow_run.head_branch }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ "$GH_EVENT_NAME" == "workflow_dispatch" ]]; then
            VERSION="${INPUT_TAG#v}"
          elif [[ -n "$WORKFLOW_RUN_TAG" ]]; then
            VERSION="${WORKFLOW_RUN_TAG#v}"
          fi
          tar -xzf dist/oxide-sloc-linux-x86_64.tar.gz -C .
          VERSION="$VERSION" nfpm pkg --packager deb \
            --config installer/nfpm.yaml \
            --target "oxide-sloc-${VERSION}-linux-amd64.deb"
          DEB_NAME="$(ls oxide-sloc-*.deb | head -1)"
          echo "deb_name=$DEB_NAME" >> "$GITHUB_OUTPUT"

      - name: Upload DEB artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: oxide-sloc-deb
          path: oxide-sloc-*.deb

  # ── Smoke test: DEB install on Ubuntu 22.04 ───────────────────────────────
  smoke-ubuntu-deb:
    name: Smoke test — Ubuntu DEB install
    needs: build-deb
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - name: Download DEB artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: oxide-sloc-deb
          path: .

      - name: Install DEB
        run: sudo dpkg -i oxide-sloc-*.deb

      - name: Verify binary
        run: |
          [[ -f /usr/bin/oxide-sloc ]] || { echo "FAIL: binary not at /usr/bin/oxide-sloc"; exit 1; }
          /usr/bin/oxide-sloc --version
          echo "PASS: Ubuntu DEB install succeeded"

      - name: Uninstall DEB
        run: sudo dpkg -r oxide-sloc

  # ── Smoke test: Windows --online install path ─────────────────────────────
  # Validates that install.sh --online works on Windows (no dist/ file present).
  # This is the primary corporate Windows path when the repo is cloned fresh.
  smoke-windows-online:
    name: Smoke test — Windows online install
    needs: build
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Remove dist/ so online path is forced
        shell: bash
        run: rm -f dist/oxide-sloc-windows-x64.zip dist/oxide-sloc-windows-x64.tar.gz

      - name: Install via --online
        shell: bash
        run: bash scripts/internal/install.sh --online

      - name: Verify binary
        shell: bash
        run: |
          [[ -f oxide-sloc.exe ]] || { echo "FAIL: oxide-sloc.exe not found"; exit 1; }
          ./oxide-sloc.exe --version
          echo "PASS: Windows --online install succeeded"

  # ── Smoke test: RHEL 9 RPM install via UBI 9 ─────────────────────────────
  # Validates rpm -ivh works, AND that the UBI 8-built binary actually loads
  # (glibc 2.34) on a RHEL 9-compatible image.
  smoke-rhel-rpm:
    name: Smoke test — RHEL RPM install (UBI 9)
    needs: build-rpm
    runs-on: ubuntu-latest
    permissions:
      contents: read
    container:
      image: registry.access.redhat.com/ubi9/ubi:latest
    steps:
      - name: Download RPM artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: oxide-sloc-rpm
          path: .

      - name: Install RPM
        run: |
          RPM_FILE="$(ls oxide-sloc-*.rpm | head -1)"
          rpm -ivh "$RPM_FILE"

      - name: Verify binary
        run: |
          [[ -f /usr/local/bin/oxide-sloc ]] || { echo "FAIL: binary not at /usr/local/bin/oxide-sloc"; exit 1; }
          /usr/local/bin/oxide-sloc --version
          echo "PASS: RHEL 9 RPM install succeeded"

      - name: Uninstall RPM
        run: rpm -e oxide-sloc

  # ── Smoke test: RHEL 8 RPM install via UBI 8 ─────────────────────────────
  # The critical gate: proves the binary runs on the OLDEST supported RHEL
  # (glibc 2.28). If the build ever regresses to a newer glibc, this fails.
  smoke-rhel8-rpm:
    name: Smoke test — RHEL RPM install (UBI 8)
    needs: build-rpm
    runs-on: ubuntu-latest
    permissions:
      contents: read
    container:
      image: registry.access.redhat.com/ubi8/ubi:latest
    steps:
      - name: Download RPM artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: oxide-sloc-rpm
          path: .

      - name: Install RPM
        run: |
          RPM_FILE="$(ls oxide-sloc-*.rpm | head -1)"
          rpm -ivh "$RPM_FILE"

      - name: Verify binary
        run: |
          [[ -f /usr/local/bin/oxide-sloc ]] || { echo "FAIL: binary not at /usr/local/bin/oxide-sloc"; exit 1; }
          /usr/local/bin/oxide-sloc --version
          echo "PASS: RHEL 8 RPM install succeeded"

      - name: Uninstall RPM
        run: rpm -e oxide-sloc

  # ── Attach all bundles to the GitHub release ──────────────────────────────
  upload-release-assets:
    name: Upload release assets
    needs: [build, build-linux, build-rpm, build-deb, smoke-windows-online, smoke-rhel-rpm, smoke-rhel8-rpm, smoke-ubuntu-deb]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Linux bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: oxide-sloc-linux-x86_64.tar.gz
          path: dist/

      - name: Download Windows bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: oxide-sloc-windows-x64.zip
          path: dist/

      - name: Download Windows tar.gz bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: oxide-sloc-windows-x64.tar.gz
          path: dist/

      - name: Download RPM
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: oxide-sloc-rpm
          path: dist/

      - name: Download DEB
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: oxide-sloc-deb
          path: dist/

      - name: Generate SHA256SUMS
        run: |
          cd dist/
          sha256sum oxide-sloc-linux-x86_64.tar.gz \
            oxide-sloc-windows-x64.zip oxide-sloc-windows-x64.tar.gz \
            oxide-sloc-*.rpm oxide-sloc-*.deb > SHA256SUMS-dist.txt
          cat SHA256SUMS-dist.txt

      # Reconcile the master SHA256SUMS.txt with the assets we are about to clobber.
      # release.yml already generated & uploaded SHA256SUMS.txt covering ITS build of
      # oxide-sloc-linux-x86_64.tar.gz (musl) and oxide-sloc-windows-x64.zip. This job
      # then overwrites both with the canonical dist builds (UBI 8 glibc-2.28 tarball,
      # MSVC-signed zip), whose bytes differ — leaving those two lines in the master
      # manifest pointing at bytes that are no longer served, so `sha256sum -c
      # SHA256SUMS.txt` fails on them. Fold the freshly computed dist sums back into the
      # master manifest (replacing the stale lines, appending the new rpm/deb) so it
      # matches the bytes actually served. Air-gapped consumers verify against this file.
      - name: Reconcile master SHA256SUMS.txt with clobbered dist assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.event.workflow_run.head_branch || github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          cd dist/
          if gh release download "$TAG" --repo "$REPO" \
               --pattern SHA256SUMS.txt --output SHA256SUMS.master.txt --clobber; then
            # $2 is the filename in `<hash>  <file>` (sha256sum -c) format. Replace any
            # master line whose file we just rebuilt; append dist-only files (rpm/deb).
            awk '
              FNR == NR { sum[$2] = $1; if (!($2 in seen)) { order[++n] = $2; seen[$2] = 1 } next }
              { if ($2 in sum) { print sum[$2] "  " $2; done[$2] = 1 } else { print } }
              END { for (i = 1; i <= n; i++) if (!(order[i] in done)) print sum[order[i]] "  " order[i] }
            ' SHA256SUMS-dist.txt SHA256SUMS.master.txt > SHA256SUMS.txt
            rm -f SHA256SUMS.master.txt
            echo "Reconciled master SHA256SUMS.txt:"
            cat SHA256SUMS.txt
          else
            echo "::warning::master SHA256SUMS.txt not found on release $TAG — not reconciling; SHA256SUMS-dist.txt still covers the dist assets."
            rm -f SHA256SUMS.txt
          fi

      - name: Upload to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.event.workflow_run.head_branch || github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          gh release upload "$TAG" \
            dist/oxide-sloc-linux-x86_64.tar.gz \
            dist/oxide-sloc-windows-x64.zip \
            dist/oxide-sloc-windows-x64.tar.gz \
            dist/oxide-sloc-*.rpm \
            dist/oxide-sloc-*.deb \
            dist/SHA256SUMS-dist.txt \
            --clobber \
            --repo "$REPO"
          # Re-upload the reconciled master manifest only if the reconcile succeeded.
          if [ -f dist/SHA256SUMS.txt ]; then
            gh release upload "$TAG" dist/SHA256SUMS.txt --clobber --repo "$REPO"
          fi

  # ── Open a PR to commit the Windows binary to dist/ ─────────────────────
  # Main is a protected branch (PRs + "Quality gates" check required), so a
  # direct push is rejected.  peter-evans/create-pull-request pushes to a new
  # unprotected branch and opens the PR in one atomic step.
  #
  # The PR is opened with a GitHub App token rather than the default
  # GITHUB_TOKEN on purpose: GitHub suppresses workflow triggers for any push
  # or PR created by GITHUB_TOKEN (anti-recursion), so the required "Quality
  # gates" CI check never ran on the dist PR.  That left it merging without a
  # CI test, which OpenSSF Scorecard's CI-Tests check flagged (score capped at
  # 8).  An app token is a distinct actor, so push/pull_request workflows (CI
  # and auto-approve) run normally; auto-merge then lands it once CI is green.
  commit-dist-windows:
    name: Commit Windows binary to dist/
    needs: upload-release-assets
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: main

      - name: Download Windows bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: oxide-sloc-windows-x64.zip
          path: dist/

      - name: Download Windows tar.gz bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: oxide-sloc-windows-x64.tar.gz
          path: dist/

      - name: Resolve release tag
        id: tag
        env:
          GH_EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
          WORKFLOW_RUN_TAG: ${{ github.event.workflow_run.head_branch }}
        run: |
          TAG="${INPUT_TAG:-${WORKFLOW_RUN_TAG:-$REF_NAME}}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      # Latest-release guard: only commit this binary to main's dist/ when the tag
      # being processed is the repository's LATEST release. Backfilling or re-running
      # an OLD tag (e.g. re-running v1.5.78 while main is on v1.6.0) must never open a
      # PR that regresses dist/ back to the older binary. Pre-releases are never
      # "latest" on GitHub, so they correctly skip too. `gh release view` needs only
      # `contents: read`, satisfied by GITHUB_TOKEN. When not latest, all PR-related
      # steps below are skipped (clean no-op) — the release-asset upload job is
      # unaffected and still uploads to any tag.
      - name: Check latest release
        id: latest
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          LATEST_TAG="$(gh api "repos/$REPO/releases/latest" --jq .tag_name 2>/dev/null || echo "")"
          IS_LATEST="false"; [ -n "$LATEST_TAG" ] && [ "$LATEST_TAG" = "$TAG" ] && IS_LATEST="true"
          echo "is_latest=$IS_LATEST" >> "$GITHUB_OUTPUT"
          if [ "$IS_LATEST" = "true" ]; then
            echo "Tag $TAG is the latest release — will commit Windows binaries to main's dist/."
          else
            echo "Tag $TAG is NOT the latest release — skipping the dist/ commit PR to avoid regressing main."
          fi

      # Final safety net before committing to main. Two invariants:
      #  1. The .zip and .tar.gz MUST carry a byte-identical exe. install.sh prefers
      #     the .tar.gz on locked-down hosts, so any drift would silently serve a
      #     different (or stale) binary than the .zip. This runs on the ubuntu runner
      #     and IS authoritative — cmp does not need to execute the Windows exe.
      #  2. Best-effort version check (the Windows exe cannot run on ubuntu, so it is
      #     only enforced if a version somehow parses; the build-job assertion is the
      #     authoritative version gate).
      - name: Assert Windows zip + tar.gz carry the same versioned binary
        if: steps.latest.outputs.is_latest == 'true'
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          EXPECTED="${TAG#v}"
          rm -rf /tmp/zc /tmp/tc && mkdir -p /tmp/zc /tmp/tc
          unzip -o dist/oxide-sloc-windows-x64.zip -d /tmp/zc
          tar -xzf dist/oxide-sloc-windows-x64.tar.gz -C /tmp/tc
          if ! cmp -s /tmp/zc/oxide-sloc.exe /tmp/tc/oxide-sloc.exe; then
            echo "::error::dist Windows .zip and .tar.gz contain DIFFERENT binaries — they must be packaged from the same exe. Refusing to commit."
            exit 1
          fi
          echo "OK: Windows .zip and .tar.gz contain a byte-identical binary."
          ACTUAL="$(/tmp/zc/oxide-sloc.exe --version 2>/dev/null \
            | grep -oE '[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z]+)*' | head -1 || true)"
          echo "Expected version: $EXPECTED"
          echo "Zip exe version: ${ACTUAL:-<unrunnable on Linux runner>}"
          if [ -n "$ACTUAL" ] && [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::dist Windows zip version ($ACTUAL) != release tag ($EXPECTED). Refusing to commit."
            exit 1
          fi

      - name: Generate app token
        id: app-token
        if: steps.latest.outputs.is_latest == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        with:
          app-id: ${{ secrets.TOOLCHAIN_APP_ID }}
          private-key: ${{ secrets.TOOLCHAIN_APP_PRIVATE_KEY }}

      - name: Open PR with updated Windows binary
        id: cpr
        if: steps.latest.outputs.is_latest == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1  # v8.1.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          branch: dist/update-windows-${{ github.run_id }}
          base: main
          add-paths: |
            dist/oxide-sloc-windows-x64.zip
            dist/oxide-sloc-windows-x64.tar.gz
          commit-message: "chore: update dist Windows binaries (${{ steps.tag.outputs.tag }})"
          title: "chore: update dist Windows binaries (${{ steps.tag.outputs.tag }})"
          body: |
            Automated dist update from workflow run ${{ github.run_id }}.

            Updates both `dist/oxide-sloc-windows-x64.zip` and
            `dist/oxide-sloc-windows-x64.tar.gz` for release ${{ steps.tag.outputs.tag }}
            (packaged from the same signed exe; byte-equality asserted in CI).
            install.sh prefers the `.tar.gz` on locked-down hosts where `unzip` /
            PowerShell are unavailable, so both must ship in lock-step.
            This PR was opened automatically because main is a protected branch.
            Auto-merge is enabled — it lands on main as soon as Quality gates passes.
          labels: "automated,dist"
          delete-branch: true

      # Land on main automatically once Quality gates passes. Opened with the app
      # token, so CI runs on the PR (unlike a GITHUB_TOKEN PR); auto-merge waits
      # for that check to go green. Requires "Allow auto-merge" in repo settings.
      - name: Enable auto-merge
        if: steps.latest.outputs.is_latest == 'true' && steps.cpr.outputs.pull-request-number
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR: ${{ steps.cpr.outputs.pull-request-number }}
          REPO: ${{ github.repository }}
        run: gh pr merge --auto --squash "$PR" --repo "$REPO"

  # ── Open a PR to commit the Linux binary to dist/ ────────────────────────
  # Mirrors commit-dist-windows (app-token PR so CI runs — see that job's
  # comment).  With dist/oxide-sloc-linux-x86_64.tar.gz present, install.sh
  # step 2b skips the bundled Rust toolchain entirely.  Serialized after
  # commit-dist-windows to avoid any merge-ordering issues.
  commit-dist-linux:
    name: Commit Linux binary to dist/
    needs: commit-dist-windows
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: main

      - name: Download Linux bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: oxide-sloc-linux-x86_64.tar.gz
          path: dist/

      - name: Resolve release tag
        id: tag
        env:
          GH_EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
          WORKFLOW_RUN_TAG: ${{ github.event.workflow_run.head_branch }}
        run: |
          TAG="${INPUT_TAG:-${WORKFLOW_RUN_TAG:-$REF_NAME}}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      # Latest-release guard: only commit this binary to main's dist/ when the tag
      # being processed is the repository's LATEST release. Backfilling or re-running
      # an OLD tag (e.g. re-running v1.5.78 while main is on v1.6.0) must never open a
      # PR that regresses dist/ back to the older binary. Pre-releases are never
      # "latest" on GitHub, so they correctly skip too. `gh release view` needs only
      # `contents: read`, satisfied by GITHUB_TOKEN. When not latest, all PR-related
      # steps below are skipped (clean no-op) — the release-asset upload job is
      # unaffected and still uploads to any tag.
      - name: Check latest release
        id: latest
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          LATEST_TAG="$(gh api "repos/$REPO/releases/latest" --jq .tag_name 2>/dev/null || echo "")"
          IS_LATEST="false"; [ -n "$LATEST_TAG" ] && [ "$LATEST_TAG" = "$TAG" ] && IS_LATEST="true"
          echo "is_latest=$IS_LATEST" >> "$GITHUB_OUTPUT"
          if [ "$IS_LATEST" = "true" ]; then
            echo "Tag $TAG is the latest release — will commit Linux binary to main's dist/."
          else
            echo "Tag $TAG is NOT the latest release — skipping the dist/ commit PR to avoid regressing main."
          fi

      # Authoritative final gate: the Linux binary DOES run on the ubuntu runner,
      # so extract the tarball and hard-assert its --version equals the release
      # tag before committing it to main's dist/. This is the exact defense
      # against the "dist artifact lags the release by one version" bug.
      - name: Assert dist tarball binary version matches release tag
        if: steps.latest.outputs.is_latest == 'true'
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          EXPECTED="${TAG#v}"
          mkdir -p /tmp/distcheck
          tar xzf dist/oxide-sloc-linux-x86_64.tar.gz -C /tmp/distcheck
          chmod +x /tmp/distcheck/oxide-sloc
          ACTUAL="$(/tmp/distcheck/oxide-sloc --version \
            | grep -oE '[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z]+)*' | head -1)"
          echo "Expected version: $EXPECTED"
          echo "Tarball version: $ACTUAL"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::dist Linux tarball version ($ACTUAL) != release tag ($EXPECTED). Refusing to commit a stale dist artifact to main."
            exit 1
          fi
          echo "OK: dist Linux tarball version matches release tag ($EXPECTED)"

      - name: Generate app token
        id: app-token
        if: steps.latest.outputs.is_latest == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        with:
          app-id: ${{ secrets.TOOLCHAIN_APP_ID }}
          private-key: ${{ secrets.TOOLCHAIN_APP_PRIVATE_KEY }}

      - name: Open PR with updated Linux binary
        id: cpr
        if: steps.latest.outputs.is_latest == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1  # v8.1.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          branch: dist/update-linux-${{ github.run_id }}
          base: main
          add-paths: dist/oxide-sloc-linux-x86_64.tar.gz
          commit-message: "chore: update dist Linux binary (${{ steps.tag.outputs.tag }})"
          title: "chore: update dist Linux binary (${{ steps.tag.outputs.tag }})"
          body: |
            Automated dist update from workflow run ${{ github.run_id }}.

            Updates `dist/oxide-sloc-linux-x86_64.tar.gz` for release ${{ steps.tag.outputs.tag }}.
            This PR was opened automatically because main is a protected branch.
            Auto-merge is enabled — it lands on main as soon as Quality gates passes.
          labels: "automated,dist"
          delete-branch: true

      # Land on main automatically once Quality gates passes. Opened with the app
      # token, so CI runs on the PR (unlike a GITHUB_TOKEN PR); auto-merge waits
      # for that check to go green. Requires "Allow auto-merge" in repo settings.
      - name: Enable auto-merge
        if: steps.latest.outputs.is_latest == 'true' && steps.cpr.outputs.pull-request-number
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR: ${{ steps.cpr.outputs.pull-request-number }}
          REPO: ${{ github.repository }}
        run: gh pr merge --auto --squash "$PR" --repo "$REPO"
