name: Auto-approve & merge trusted PRs

# SEPARATION OF DUTIES (F-08): auto-approval bypasses independent human review.
# It is intentionally retained for the solo-maintainer OSS workflow, but is scoped
# so that PRs touching security-sensitive paths are NEVER auto-approved — those
# always require a manual approval. For an accredited (ATO) deployment with more
# than one maintainer, disable this workflow and enforce 2-person review via
# branch-protection required reviewers.
#
# What this does, end to end, for a trusted author (owner or an allow-listed bot):
#   1. Skip entirely if the diff touches a security-sensitive path.
#   2. If the branch is BEHIND main (required checks are `strict`), update it via
#      the GitHub App token. A GITHUB_TOKEN push would NOT re-trigger the required
#      "Quality gates" check (GitHub anti-recursion), so the merge would hang. The
#      App token is a distinct actor, so updating the branch re-runs CI normally.
#   3. Approve the PR (satisfies the 1-review branch-protection rule).
#   4. Enable squash auto-merge so it lands the moment "Quality gates" goes green.
# Each branch update fires a `synchronize` event that re-enters this workflow, so a
# PR that falls BEHIND again as main advances is healed automatically until it lands.
#
# SIBLING-MERGE GAP: a `synchronize` event only fires when a PR's OWN head changes,
# never when the base (main) moves. So when one PR merges and leaves a sibling PR
# BEHIND (e.g. the Windows dist PR merging ahead of the Linux dist PR for the same
# release), nothing re-triggers the heal step on the sibling and it sits BEHIND
# forever. The `push: main` trigger below closes that gap: on every merge to main we
# sweep open trusted PRs and update any that are BEHIND, which fires their
# `synchronize` event and lets the auto-merge job above land them.

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

# Least privilege at the top level: the default token is read-only for every job
# (and for any third-party action invoked below). The single job that needs write
# requests it explicitly via job-level permissions.
permissions:
  contents: read

concurrency:
  # One in-flight run per PR; a newer run (e.g. after a branch update) supersedes
  # the older one so we don't stack redundant approvals. Push-to-main heal sweeps
  # key off the pushed SHA so they never cancel an in-flight per-PR run.
  group: auto-merge-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  auto-merge:
    name: Auto-approve and enable auto-merge
    runs-on: ubuntu-latest
    # Write is scoped to this job only: approve the PR and enable squash auto-merge.
    permissions:
      contents: write
      pull-requests: write
    # Trusted authors only. Everyone else goes through normal human review.
    # Bot logins carry the `[bot]` suffix in pull_request payloads.
    # (On `push` events pull_request is null, so this job no-ops — the heal job runs.)
    if: >-
      github.event.pull_request.user.login == 'NimaShafie' ||
      github.event.pull_request.user.login == 'oxide-sloc-toolchain-bot[bot]' ||
      github.event.pull_request.user.login == 'dependabot[bot]'
    steps:
      - name: Detect security-sensitive changes
        id: sensitive
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          # Sensitive paths require manual review even from a trusted author.
          PATTERN='^(\.github/workflows/|crates/sloc-web/src/auth\.rs|crates/sloc-web/src/git_webhook\.rs|crates/sloc-git/src/(ops|webhook)\.rs|Dockerfile|docker-compose\.yml|deny\.toml|_signing/|action\.yml|scripts/)'
          FILES=$(gh pr diff "$PR_NUMBER" --repo "$REPO" --name-only)
          if echo "$FILES" | grep -qE "$PATTERN"; then
            echo "Security-sensitive files changed — skipping auto-approval:"
            echo "$FILES" | grep -E "$PATTERN" | sed 's/^/    /'
            echo "sensitive=true" >> "$GITHUB_OUTPUT"
          else
            echo "sensitive=false" >> "$GITHUB_OUTPUT"
          fi

      # An App token is needed to update the PR branch: pushes made with the default
      # GITHUB_TOKEN do not trigger workflows, so the required "Quality gates" check
      # would never re-run on the updated head and the PR would stay blocked.
      - name: Generate app token
        id: app-token
        if: steps.sensitive.outputs.sensitive == 'false'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        with:
          app-id: ${{ secrets.TOOLCHAIN_APP_ID }}
          private-key: ${{ secrets.TOOLCHAIN_APP_PRIVATE_KEY }}

      # Update BEFORE approving: branch protection has dismiss_stale_reviews=true, so
      # a commit added after approval would dismiss it. Updating first means the
      # approval we add next applies to the final head.
      - name: Update branch if behind main
        if: steps.sensitive.outputs.sensitive == 'false'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          STATE=$(gh pr view "$PR_NUMBER" --repo "$REPO" --json mergeStateStatus -q .mergeStateStatus)
          echo "merge state: $STATE"
          if [ "$STATE" = "BEHIND" ]; then
            echo "Branch is behind main — updating (re-triggers required checks)."
            gh api --method PUT "repos/$REPO/pulls/$PR_NUMBER/update-branch" || \
              echo "update-branch call returned non-zero (often benign: update already queued)."
          else
            echo "Branch is current — no update needed."
          fi

      - name: Approve PR
        if: steps.sensitive.outputs.sensitive == 'false'
        uses: hmarr/auto-approve-action@f0939ea97e9205ef24d872e76833fa908a770363  # v4.0.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable squash auto-merge
        if: steps.sensitive.outputs.sensitive == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          # Idempotent: succeeds whether or not auto-merge was already enabled.
          gh pr merge --auto --squash "$PR_NUMBER" --repo "$REPO" || \
            echo "auto-merge already enabled or PR not in a mergeable state yet."

  heal-behind-prs:
    name: Heal PRs left BEHIND by a merge to main
    runs-on: ubuntu-latest
    # Only on push-to-main. The per-PR auto-merge job handles pull_request events.
    if: github.event_name == 'push'
    permissions:
      contents: read
      pull-requests: read
    steps:
      # App token (not GITHUB_TOKEN): an update-branch push must re-trigger the
      # required "Quality gates" check. Pushes made with GITHUB_TOKEN don't trigger
      # workflows, so the check would never re-run and the PR would stay blocked.
      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        with:
          app-id: ${{ secrets.TOOLCHAIN_APP_ID }}
          private-key: ${{ secrets.TOOLCHAIN_APP_PRIVATE_KEY }}

      - name: Update any trusted PR left BEHIND
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
        run: |
          # Main just advanced. Any open PR that has auto-merge enabled but is now
          # BEHIND got no pull_request event (the base moved, not its head), so the
          # per-PR heal step never fired for it. Sweep and update those branches;
          # each update fires a `synchronize` event that re-enters the auto-merge
          # job above, which re-approves and lands the PR once checks go green.
          #
          # Trusted authors only, mirroring the auto-merge job. `[bot]` logins
          # contain regex metacharacters, so match with a padded substring test
          # rather than grep -w.
          TRUSTED=' NimaShafie oxide-sloc-toolchain-bot[bot] dependabot[bot] '
          gh pr list --repo "$REPO" --state open --base main \
            --json number,mergeStateStatus,author,autoMergeRequest \
            -q '.[] | select(.autoMergeRequest != null)
                    | select(.mergeStateStatus == "BEHIND")
                    | [(.number|tostring), .author.login] | @tsv' \
          | while IFS="$(printf '\t')" read -r NUM LOGIN; do
              case "$TRUSTED" in
                *" $LOGIN "*)
                  echo "PR #$NUM ($LOGIN) is BEHIND with auto-merge enabled — updating branch."
                  gh api --method PUT "repos/$REPO/pulls/$NUM/update-branch" \
                    || echo "update-branch for #$NUM returned non-zero (often benign: already queued)."
                  ;;
                *)
                  echo "PR #$NUM ($LOGIN) is BEHIND but author is not trusted — leaving for human review."
                  ;;
              esac
            done
