name: CodeQL

on:
  push:
  pull_request:
  schedule:
    - cron: '20 7 * * 1'  # weekly Monday

permissions: {}

jobs:
  analyze:
    name: Analyze (rust)
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install system dependencies (rfd / native file dialog)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libwayland-dev \
            libgtk-3-dev \
            libxdo-dev

      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2  # v4.38.2
        with:
          languages: rust
          # Rust does not support autobuild; 'none' lets CodeQL analyse without a build step
          build-mode: none

      - name: Analyze
        uses: github/codeql-action/analyze@88585263c0627ee42c0e1c5143a112c8d6f4aa18  # v4.38.2
        with:
          category: /language:rust
