name: CodeQL

on:
  push:
  pull_request:
  schedule:
    - cron: '20 7 * * 1'  # weekly Monday

permissions: {}

jobs:
  analyze:
    name: Analyze (rust)
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install system dependencies (rfd / native file dialog)
        uses: ./.github/actions/apt-install
        with:
          packages: libwayland-dev libgtk-3-dev libxdo-dev

      - name: Initialize CodeQL
        uses: github/codeql-action/init@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea  # v4.39.4
        with:
          languages: rust
          # Rust does not support autobuild; 'none' lets CodeQL analyse without a build step
          build-mode: none
          # Filters rust/unsafe-deserialization — see .github/codeql/codeql-config.yml
          config-file: ./.github/codeql/codeql-config.yml

      - name: Analyze
        uses: github/codeql-action/analyze@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea  # v4.39.4
        with:
          category: /language:rust
