name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:   # allows manual trigger from GitHub Actions UI without a new tag

permissions: {}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true  # opt in ahead of the June 2026 forced migration

# Required secrets (all optional — steps skip gracefully if not set):
#   WINDOWS_CERTIFICATE          — base64-encoded PFX for Windows Authenticode signing
#   WINDOWS_CERTIFICATE_PASSWORD — password for the PFX
#   APPLE_DEVELOPER_ID_CERT      — base64-encoded PFX for macOS Developer ID signing
#   APPLE_DEVELOPER_ID_CERT_PASSWORD — password for the macOS PFX
#   APPLE_NOTARIZE_APPLE_ID      — Apple ID email for notarization
#   APPLE_NOTARIZE_PASSWORD      — app-specific password for notarization
#   APPLE_NOTARIZE_TEAM_ID       — Apple Developer Team ID
#   GPG_PRIVATE_KEY              — armored GPG private key (gpg --export-secret-key --armor)
#   GPG_PASSPHRASE               — passphrase protecting the GPG key
#   VT_API_KEY                   — VirusTotal API v3 key for malware scanning

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      attestations: write   # required for actions/attest-build-provenance
      id-token: write       # required for OIDC-based attestation signing
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            artifact: oxide-sloc-linux-x86_64
            binary: oxide-sloc

          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            artifact: oxide-sloc-linux-arm64
            binary: oxide-sloc

          - os: windows-2022  # windows-latest rolling to windows-2025-vs2026 breaks ncc-bundled actions; stay on 2022
            target: x86_64-pc-windows-msvc
            artifact: oxide-sloc-windows-x86_64.exe
            binary: oxide-sloc.exe

          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: oxide-sloc-macos-x86_64
            binary: oxide-sloc

          - os: macos-15
            target: aarch64-apple-darwin
            artifact: oxide-sloc-macos-arm64
            binary: oxide-sloc

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772  # pinned action; Rust version set by toolchain input (matches rust-toolchain.toml)
        with:
          toolchain: "1.97"
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
        with:
          key: ${{ matrix.target }}

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          case "${{ matrix.target }}" in
            x86_64-unknown-linux-musl)
              sudo apt-get install -y --no-install-recommends musl-tools
              ;;
            aarch64-unknown-linux-gnu)
              sudo apt-get install -y --no-install-recommends gcc-aarch64-linux-gnu libc6-dev-arm64-cross
              ;;
          esac

      - name: Build release binary
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: bash ci/release.sh ${{ matrix.target }}

      # ── macOS code signing + notarization ──────────────────────────────────

      - name: Check for macOS signing certificate
        id: cert_mac
        if: runner.os == 'macOS'
        shell: bash
        run: |
          if [ -n "$CERT" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          CERT: ${{ secrets.APPLE_DEVELOPER_ID_CERT }}

      - name: Import macOS signing certificate into temporary keychain
        if: runner.os == 'macOS' && steps.cert_mac.outputs.available == 'true'
        shell: bash
        env:
          APPLE_DEVELOPER_ID_CERT: ${{ secrets.APPLE_DEVELOPER_ID_CERT }}
          APPLE_DEVELOPER_ID_CERT_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_CERT_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          CERT_PATH="$RUNNER_TEMP/signing.p12"
          echo "$APPLE_DEVELOPER_ID_CERT" | base64 --decode > "$CERT_PATH"
          security import "$CERT_PATH" -P "$APPLE_DEVELOPER_ID_CERT_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          rm -f "$CERT_PATH"
          # Persist keychain path for subsequent steps
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

      - name: Sign macOS binary
        if: runner.os == 'macOS' && steps.cert_mac.outputs.available == 'true'
        shell: bash
        run: |
          codesign \
            --sign "Developer ID Application" \
            --timestamp \
            --options runtime \
            --force \
            "./target/${{ matrix.target }}/release/oxide-sloc"

      - name: Verify macOS code signature
        if: runner.os == 'macOS' && steps.cert_mac.outputs.available == 'true'
        shell: bash
        run: |
          codesign \
            --verify \
            --deep \
            --strict \
            --verbose=2 \
            "./target/${{ matrix.target }}/release/oxide-sloc"

      - name: Notarize macOS binary
        if: runner.os == 'macOS' && steps.cert_mac.outputs.available == 'true'
        shell: bash
        env:
          APPLE_NOTARIZE_APPLE_ID: ${{ secrets.APPLE_NOTARIZE_APPLE_ID }}
          APPLE_NOTARIZE_PASSWORD: ${{ secrets.APPLE_NOTARIZE_PASSWORD }}
          APPLE_NOTARIZE_TEAM_ID: ${{ secrets.APPLE_NOTARIZE_TEAM_ID }}
        run: |
          xcrun notarytool submit \
            "./target/${{ matrix.target }}/release/oxide-sloc" \
            --apple-id "$APPLE_NOTARIZE_APPLE_ID" \
            --password "$APPLE_NOTARIZE_PASSWORD" \
            --team-id "$APPLE_NOTARIZE_TEAM_ID" \
            --wait

      - name: Remove temporary macOS keychain
        if: runner.os == 'macOS' && steps.cert_mac.outputs.available == 'true'
        shell: bash
        run: |
          security delete-keychain "$KEYCHAIN_PATH"

      # ── End macOS signing ──────────────────────────────────────────────────

      - name: Rename binary
        shell: bash
        run: cp target/${{ matrix.target }}/release/${{ matrix.binary }} ${{ matrix.artifact }}

      - name: Strip debug overlay from Windows binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $strip = (Get-Command llvm-strip.exe -ErrorAction SilentlyContinue)?.Source
          if (-not $strip) {
            $strip = Get-ChildItem 'C:\Program Files\LLVM\bin\llvm-strip.exe' -ErrorAction SilentlyContinue |
              Select-Object -First 1 -ExpandProperty FullName
          }
          if ($strip) {
            Write-Output "Using llvm-strip: $strip"
            & $strip --strip-debug "${{ matrix.artifact }}"
            if ($LASTEXITCODE -ne 0) { throw "llvm-strip failed with exit code $LASTEXITCODE" }
            Write-Output "Debug overlay stripped."
          } else {
            Write-Output "llvm-strip not found — skipping strip step."
          }

      - name: Check for signing certificate
        id: cert
        if: runner.os == 'Windows'
        shell: bash
        run: |
          if [ -n "$CERT" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          CERT: ${{ secrets.WINDOWS_CERTIFICATE }}

      - name: Sign Windows binary
        if: runner.os == 'Windows' && steps.cert.outputs.available == 'true'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          $signtool = (Get-Item 'C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe' `
            -ErrorAction SilentlyContinue |
            Sort-Object FullName -Descending |
            Select-Object -First 1).FullName
          if (-not $signtool) {
            $signtool = (Get-Command signtool.exe -ErrorAction SilentlyContinue)?.Source
          }
          if (-not $signtool) { throw "signtool.exe not found in Windows Kits or PATH" }
          Write-Output "Using signtool: $signtool"

          $certBytes = [System.Convert]::FromBase64String($env:WINDOWS_CERTIFICATE)
          $certPath = Join-Path $env:RUNNER_TEMP "signing.pfx"
          [System.IO.File]::WriteAllBytes($certPath, $certBytes)

          & $signtool sign `
            /f $certPath `
            /p $env:WINDOWS_CERTIFICATE_PASSWORD `
            /tr http://timestamp.digicert.com `
            /td sha256 `
            /fd sha256 `
            /d "OxideSLOC" `
            /du "https://github.com/oxide-sloc/oxide-sloc" `
            "${{ matrix.artifact }}"
          if ($LASTEXITCODE -ne 0) {
            Remove-Item -Force $certPath -ErrorAction SilentlyContinue
            throw "signtool sign failed with exit code $LASTEXITCODE"
          }

          Remove-Item -Force $certPath
          Write-Output "Binary signed successfully."

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

      - name: Attest build provenance
        id: attest
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373  # v4.1.1
        with:
          subject-path: ${{ matrix.artifact }}

      - name: Copy SLSA bundle for release asset
        shell: bash
        run: cp "${{ steps.attest.outputs.bundle-path }}" "${{ matrix.artifact }}.sigstore.json"

      - name: Upload SLSA bundle artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: slsa-bundle-${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.sigstore.json

  vendor:
    name: Generate vendor archive
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772  # pinned action; Rust version set by toolchain input (matches rust-toolchain.toml)
        with:
          toolchain: "1.97"

      - name: Generate vendor archive
        run: bash scripts/internal/update-vendor.sh

      - name: Upload vendor archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: vendor-archive
          path: |
            vendor.tar.gz.aa
            vendor.tar.gz.ab
            vendor.tar.gz.ac
            vendor.checksums.sha256

  sbom:
    name: Generate SBOM
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772  # pinned action; Rust version set by toolchain input (matches rust-toolchain.toml)
        with:
          toolchain: "1.97"

      - name: Install cargo-cyclonedx
        # Pin to a known-good version so a future upstream release can't silently
        # change the output filename/extension and break this job again.
        run: cargo install cargo-cyclonedx --version 0.5.9 --locked

      - name: Generate CycloneDX SBOM
        run: |
          # In a virtual workspace cargo-cyclonedx writes one SBOM next to each
          # member's Cargo.toml — never at the repo root — so scope it to the binary
          # crate (its dependency tree spans the whole workspace) and hoist the
          # generated file to the root for a stable upload path.
          # cargo-cyclonedx has no `-p`/package selector; scope with --manifest-path.
          #
          # --override-filename replaces the whole filename, so the tool does NOT
          # append its usual `.cdx` infix: `--override-filename sbom --format json`
          # writes `sbom.json`, not `sbom.cdx.json`. Match both spellings so the
          # detection survives either behaviour, then normalise to `sbom.cdx.json`
          # at the repo root for the existing upload path below.
          cargo cyclonedx --format json --override-filename sbom \
            --manifest-path crates/sloc-cli/Cargo.toml
          src="$(find . \( -name 'sbom.cdx.json' -o -name 'sbom.json' \) | head -n1)"
          echo "Generated SBOM: ${src:-<none>}"
          test -n "$src"   # fail loudly if cargo-cyclonedx produced nothing
          cp "$src" sbom.cdx.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: sbom
          path: sbom.cdx.json
          if-no-files-found: error

  sign:
    name: Sign release artifacts
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # required for cosign OIDC keyless signing
      contents: read
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          path: artifacts/
          merge-multiple: true

      # ── GPG signing ────────────────────────────────────────────────────────

      - name: Check for GPG private key
        id: gpg_check
        shell: bash
        run: |
          if [ -n "$GPG_KEY" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          GPG_KEY: ${{ secrets.GPG_PRIVATE_KEY }}

      - name: Import GPG key
        if: steps.gpg_check.outputs.available == 'true'
        shell: bash
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          GPG_KEY_FILE="$(mktemp)"
          # Auto-detect format: raw armor starts with "-----BEGIN"; anything else
          # is assumed to be base64-encoded armor (the most common mis-store pattern).
          first10="${GPG_PRIVATE_KEY:0:10}"
          echo "GPG key format probe — first 10 chars: '${first10}'"
          if [[ "$first10" == "-----BEGIN" ]]; then
            echo "Format: raw armored key"
            printf '%s\n' "$GPG_PRIVATE_KEY" > "$GPG_KEY_FILE"
          else
            echo "Format: base64-encoded armored key — decoding"
            printf '%s' "$GPG_PRIVATE_KEY" | base64 --decode > "$GPG_KEY_FILE"
          fi
          echo "First line of decoded key: $(head -1 "$GPG_KEY_FILE")"
          gpg --batch --import "$GPG_KEY_FILE"
          rm -f "$GPG_KEY_FILE"

      - name: GPG sign binaries
        if: steps.gpg_check.outputs.available == 'true'
        shell: bash
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          for f in artifacts/oxide-sloc-*; do
            fname="$(basename "$f")"
            # Skip any existing signature/bundle files and non-binary files
            case "$fname" in
              *.sig|*.bundle|*.asc|*.sha256|*.txt|*.md) continue ;;
            esac
            echo "GPG-signing: $fname"
            gpg --batch --yes --pinentry-mode loopback \
              --passphrase "$GPG_PASSPHRASE" \
              --detach-sign --armor \
              --output "artifacts/${fname}.sig" \
              "artifacts/${fname}"
          done

      - name: Export GPG public key
        if: steps.gpg_check.outputs.available == 'true'
        shell: bash
        run: |
          gpg --armor --export > artifacts/oxide-sloc-signing-key.asc

      # ── Cosign keyless signing ─────────────────────────────────────────────

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2

      - name: Cosign sign binaries (keyless / OIDC)
        shell: bash
        run: |
          for f in artifacts/oxide-sloc-*; do
            fname="$(basename "$f")"
            # Skip signature/bundle/metadata files
            case "$fname" in
              *.sig|*.bundle|*.asc|*.sha256|*.txt|*.md) continue ;;
            esac
            echo "Cosign signing: $fname"
            cosign sign-blob \
              --yes \
              --bundle "artifacts/${fname}.bundle" \
              "artifacts/${fname}"
          done

      # ── Upload signed artifacts ────────────────────────────────────────────

      - name: Upload signed artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: signed-artifacts
          path: artifacts/

  virustotal:
    name: VirusTotal scan
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    # Don't fail the release if VT is unavailable or flags something
    continue-on-error: true
    env:
      VT_API_KEY: ${{ secrets.VT_API_KEY }}
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          path: artifacts/
          merge-multiple: true

      - name: Run VirusTotal scan
        shell: bash
        run: |
          mkdir -p vt-report
          python3 -u << 'PYEOF'
          import glob
          import json
          import os
          import sys
          import time
          import urllib.error
          import urllib.parse
          import urllib.request

          VT_API_KEY = os.environ.get("VT_API_KEY", "")
          ARTIFACTS_DIR = "artifacts"
          REPORT_PATH = "vt-report/vt-scan-summary.md"

          if not VT_API_KEY:
              with open(REPORT_PATH, "w") as fh:
                  fh.write("## VirusTotal Scan Results\n\n")
                  fh.write("*Skipped — VT_API_KEY secret not configured.*\n")
              print("VT_API_KEY not set — skipping scan.")
              sys.exit(0)

          # Collect target binaries
          patterns = [
              os.path.join(ARTIFACTS_DIR, "oxide-sloc-linux-*"),
              os.path.join(ARTIFACTS_DIR, "oxide-sloc-windows-*"),
              os.path.join(ARTIFACTS_DIR, "oxide-sloc-macos-*"),
          ]
          binaries = []
          for pat in patterns:
              binaries.extend(glob.glob(pat))
          # Exclude signature/bundle/metadata files
          skip_exts = (".sig", ".bundle", ".asc", ".sha256", ".txt", ".md")
          binaries = [b for b in binaries if not any(b.endswith(ext) for ext in skip_exts)]
          binaries.sort()

          if not binaries:
              with open(REPORT_PATH, "w") as fh:
                  fh.write("## VirusTotal Scan Results\n\n")
                  fh.write("*No binaries found to scan.*\n")
              sys.exit(0)

          def vt_request(method, url, data=None, headers=None, files=None):
              """Minimal HTTP helper using only stdlib."""
              req_headers = {"x-apikey": VT_API_KEY}
              if headers:
                  req_headers.update(headers)
              if files:
                  # Build multipart/form-data manually
                  boundary = "----VTBoundary1234567890"
                  body_parts = []
                  for field_name, (filename, file_bytes, content_type) in files.items():
                      part = (
                          f"--{boundary}\r\n"
                          f'Content-Disposition: form-data; name="{field_name}"; filename="{filename}"\r\n'
                          f"Content-Type: {content_type}\r\n"
                          f"\r\n"
                      ).encode() + file_bytes + b"\r\n"
                      body_parts.append(part)
                  body = b"".join(body_parts) + f"--{boundary}--\r\n".encode()
                  req_headers["Content-Type"] = f"multipart/form-data; boundary={boundary}"
                  req = urllib.request.Request(url, data=body, headers=req_headers, method=method)
              elif data:
                  req = urllib.request.Request(url, data=data, headers=req_headers, method=method)
              else:
                  req = urllib.request.Request(url, headers=req_headers, method=method)
              try:
                  with urllib.request.urlopen(req, timeout=60) as resp:
                      return json.loads(resp.read().decode())
              except urllib.error.HTTPError as exc:
                  body = exc.read().decode(errors="replace")
                  print(f"  HTTP {exc.code}: {body[:300]}", file=sys.stderr)
                  raise

          rows = []
          timestamp = time.strftime("%Y-%m-%d %H:%M:%S", time.gmtime())

          for idx, binary_path in enumerate(binaries):
              binary_name = os.path.basename(binary_path)
              print(f"Uploading {binary_name} to VirusTotal...")

              with open(binary_path, "rb") as fh:
                  file_bytes = fh.read()

              try:
                  upload_resp = vt_request(
                      "POST",
                      "https://www.virustotal.com/api/v3/files",
                      files={"file": (binary_name, file_bytes, "application/octet-stream")},
                  )
              except Exception as exc:
                  print(f"  Upload failed: {exc}", file=sys.stderr)
                  rows.append(f"| `{binary_name}` | N/A | N/A | N/A | N/A | upload failed |")
                  time.sleep(15)
                  continue

              analysis_id = upload_resp.get("data", {}).get("id", "")
              if not analysis_id:
                  print("  No analysis ID returned.", file=sys.stderr)
                  rows.append(f"| `{binary_name}` | N/A | N/A | N/A | N/A | no analysis ID |")
                  time.sleep(15)
                  continue

              print(f"  Analysis ID: {analysis_id}")
              print("  Polling for completion (max 10 attempts, 30s each)...")

              stats = None
              for attempt in range(10):
                  time.sleep(30)
                  try:
                      poll_resp = vt_request(
                          "GET",
                          f"https://www.virustotal.com/api/v3/analyses/{analysis_id}",
                      )
                  except Exception as exc:
                      print(f"  Poll attempt {attempt + 1} failed: {exc}", file=sys.stderr)
                      continue
                  status = poll_resp.get("data", {}).get("attributes", {}).get("status", "")
                  print(f"  Attempt {attempt + 1}: status={status}")
                  if status == "completed":
                      stats = poll_resp["data"]["attributes"].get("stats", {})
                      break

              vt_url = f"https://www.virustotal.com/gui/analysis/{analysis_id}"
              if stats is not None:
                  malicious = stats.get("malicious", 0)
                  suspicious = stats.get("suspicious", 0)
                  undetected = stats.get("undetected", 0)
                  harmless = stats.get("harmless", 0)
                  rows.append(
                      f"| `{binary_name}` | {malicious} | {suspicious} | {undetected} | {harmless} | [View]({vt_url}) |"
                  )
              else:
                  rows.append(
                      f"| `{binary_name}` | N/A | N/A | N/A | N/A | [View]({vt_url}) |"
                  )

              # Sleep between uploads to respect free-tier rate limit (4 req/min)
              if idx < len(binaries) - 1:
                  print("  Sleeping 15s before next upload...")
                  time.sleep(15)

          # Write markdown report
          table_header = (
              "| Binary | Malicious | Suspicious | Undetected | Harmless | Report |\n"
              "|--------|-----------|------------|------------|---------|--------|"
          )
          with open(REPORT_PATH, "w") as fh:
              fh.write("## VirusTotal Scan Results\n\n")
              fh.write(table_header + "\n")
              fh.write("\n".join(rows) + "\n\n")
              fh.write(f"*Scanned at: {timestamp} UTC*\n\n")
              fh.write(
                  "*False positives are common for freshly compiled Rust binaries. "
                  "Zero malicious detections is the expected result.*\n"
              )

          print("Scan complete. Report written to", REPORT_PATH)
          sys.exit(0)
          PYEOF

      - name: Upload VT scan report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: vt-scan-report
          path: vt-report/

  publish:
    name: Publish GitHub Release
    # NOTE: virustotal is intentionally NOT a dependency. VT is best-effort
    # (continue-on-error), but a VT *timeout* is recorded as `cancelled`, not
    # `failure`, and continue-on-error does not cover cancellation — so listing
    # it here let a slow VT scan cancel the whole release (skipping publish).
    # The VT scan report is still consumed opportunistically below via a
    # continue-on-error download; if VT has not finished, the release notes
    # simply omit the scan summary.
    needs: [build, vendor, sign, sbom]
    runs-on: ubuntu-latest
    # Creating a GitHub Release requires a tag ref; skip on workflow_dispatch (branch run)
    if: github.event_name == 'push'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Detect pre-release
        id: pre
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ "$TAG" =~ -(alpha|beta|rc)\. ]] || [[ "$TAG" =~ -(alpha|beta|rc)$ ]]; then
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
            LABEL=$(echo "$TAG" | grep -oP '(?<=-)(alpha|beta|rc)')
            echo "label=$LABEL" >> "$GITHUB_OUTPUT"
          else
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
            echo "label=" >> "$GITHUB_OUTPUT"
          fi

      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          path: artifacts/
          merge-multiple: true

      - name: Download signed artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: signed-artifacts
          path: signed-artifacts/
        continue-on-error: true

      - name: Download VT scan report
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: vt-scan-report
          path: vt-report/
        continue-on-error: true

      - name: Download SBOM
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: sbom
          path: artifacts/
        continue-on-error: true

      - name: Download SLSA provenance bundles
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          pattern: slsa-bundle-*
          path: artifacts/
          merge-multiple: true
        continue-on-error: true

      - name: Merge signed artifacts into artifacts dir
        shell: bash
        run: |
          if [ -d signed-artifacts ]; then
            # Copy .sig, .bundle, and .asc files produced by the sign job
            find signed-artifacts -maxdepth 1 \( -name "*.sig" -o -name "*.bundle" -o -name "*.asc" \) \
              -exec cp -v {} artifacts/ \;
          fi

      - name: Create Linux tarball archives
        shell: bash
        run: |
          # The binary inside the archive must be named "oxide-sloc" so that
          # install.sh --online can find it after extraction ($EXE is always
          # $REPO_ROOT/oxide-sloc regardless of the tarball filename).
          for arch in x86_64 arm64; do
            binary="artifacts/oxide-sloc-linux-${arch}"
            if [[ -f "$binary" ]]; then
              cp "$binary" artifacts/oxide-sloc
              tar czf "artifacts/oxide-sloc-linux-${arch}.tar.gz" \
                -C artifacts "oxide-sloc"
              rm artifacts/oxide-sloc
              echo "Created oxide-sloc-linux-${arch}.tar.gz"
            fi
          done

      - name: Create Windows zip archive
        shell: bash
        run: |
          # Package the exe as oxide-sloc.exe inside the zip so that winget's
          # NestedInstallerFiles RelativeFilePath: oxide-sloc.exe resolves correctly.
          if [[ -f "artifacts/oxide-sloc-windows-x86_64.exe" ]]; then
            cp artifacts/oxide-sloc-windows-x86_64.exe artifacts/oxide-sloc.exe
            cd artifacts
            zip oxide-sloc-windows-x64.zip oxide-sloc.exe
            rm oxide-sloc.exe
            echo "Created oxide-sloc-windows-x64.zip"
          fi

      - name: Generate SHA-256 checksums
        shell: bash
        run: |
          cd artifacts
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Prepare VT summary for release body
        id: vt
        shell: bash
        run: |
          if [ -f vt-report/vt-scan-summary.md ]; then
            VT_SUMMARY="$(cat vt-report/vt-scan-summary.md)"
          else
            VT_SUMMARY="## VirusTotal Scan Results

          *Scan results unavailable.*"
          fi
          # Write to a file to avoid quoting issues in GITHUB_OUTPUT
          echo "$VT_SUMMARY" > /tmp/vt-summary.md
          echo "summary_file=/tmp/vt-summary.md" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228  # v3.0.2
        with:
          files: |
            artifacts/*
          prerelease: ${{ steps.pre.outputs.is_prerelease }}
          generate_release_notes: true
          body: |
            ${{ steps.pre.outputs.is_prerelease == 'true' && format('> **{0} build** — please test and report issues before the stable release. Core functionality is complete; minor rough edges may remain.', steps.pre.outputs.label) || '' }}

            ## Download

            | Platform | File | Notes |
            |---|---|---|
            | Linux x86-64 | `oxide-sloc-linux-x86_64` | Static binary (musl) — works on any x86-64 Linux |
            | Linux arm64 | `oxide-sloc-linux-arm64` | Requires glibc ≥ 2.17 (Raspberry Pi 4, AWS Graviton, Ampere, etc.) |
            | Windows x86-64 | `oxide-sloc-windows-x86_64.exe` | Windows 10/11 |
            | macOS x86-64 | `oxide-sloc-macos-x86_64` | Intel Mac |
            | macOS Apple Silicon | `oxide-sloc-macos-arm64` | M1/M2/M3/M4 Mac |
            | Vendor archive | `vendor.tar.gz.aa` + `.ab` + `.ac` + `vendor.checksums.sha256` | Rust dependency sources (split gzip parts) for air-gapped builds |

            Checksums for all release assets are in `SHA256SUMS.txt`.
            GPG detached signatures (`.sig`), Sigstore cosign bundles (`.bundle`), and SLSA provenance attestations (`.sigstore.json`) are included for each binary.
            The GPG public key used for signing is `oxide-sloc-signing-key.asc`.

            ## Quick install

            ```bash
            # Linux x86-64
            curl -Lo oxide-sloc https://github.com/oxide-sloc/oxide-sloc/releases/download/${{ github.ref_name }}/oxide-sloc-linux-x86_64
            chmod +x oxide-sloc && sudo mv oxide-sloc /usr/local/bin/

            # Linux arm64
            curl -Lo oxide-sloc https://github.com/oxide-sloc/oxide-sloc/releases/download/${{ github.ref_name }}/oxide-sloc-linux-arm64
            chmod +x oxide-sloc && sudo mv oxide-sloc /usr/local/bin/

            # macOS (Apple Silicon)
            curl -Lo oxide-sloc https://github.com/oxide-sloc/oxide-sloc/releases/download/${{ github.ref_name }}/oxide-sloc-macos-arm64
            chmod +x oxide-sloc && sudo mv oxide-sloc /usr/local/bin/

            # macOS (Intel)
            curl -Lo oxide-sloc https://github.com/oxide-sloc/oxide-sloc/releases/download/${{ github.ref_name }}/oxide-sloc-macos-x86_64
            chmod +x oxide-sloc && sudo mv oxide-sloc /usr/local/bin/

            # Windows — rename and add to PATH
            ren oxide-sloc-windows-x86_64.exe oxide-sloc.exe

            # Verify checksum (Linux / macOS)
            sha256sum --check SHA256SUMS.txt

            # Verify GPG signature (Linux / macOS)
            gpg --import oxide-sloc-signing-key.asc
            gpg --verify oxide-sloc-linux-x86_64.sig oxide-sloc-linux-x86_64

            # Verify cosign bundle (keyless — requires cosign installed).
            # The identity flags pin the signature to this repo's release workflow.
            cosign verify-blob \
              --bundle oxide-sloc-linux-x86_64.bundle \
              --certificate-identity-regexp '^https://github.com/oxide-sloc/oxide-sloc/\.github/workflows/release\.yml@refs/tags/v' \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              oxide-sloc-linux-x86_64
            ```

            ## Air-gapped build

            ```bash
            # Download source + vendor archive from this release, then on the air-gapped machine:
            bash scripts/internal/airgap-build.sh
            ```

            ## Or build from source (requires Rust 1.97+)

            ```bash
            cargo install --git https://github.com/oxide-sloc/oxide-sloc oxide-sloc
            ```

  smoke-install:
    name: Smoke test — install.sh --online (internal)
    needs: [publish]
    runs-on: ubuntu-latest
    # Only meaningful when a real GitHub Release was created (tag push)
    if: github.event_name == 'push'
    permissions:
      contents: read
    container:
      image: ubuntu:22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install prerequisites (curl, openssl, ca-certificates)
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends curl openssl ca-certificates

      - name: Install via install.sh --online
        run: bash scripts/internal/install.sh --online

      - name: Verify binary is executable and reports a version
        run: |
          test -x ./oxide-sloc
          ./oxide-sloc --version

      - name: Smoke test server with auth
        shell: bash
        run: |
          SLOC_API_KEY="ci-smoke-${GITHUB_RUN_ID:-local}-${GITHUB_RUN_ATTEMPT:-1}"
          export SLOC_API_KEY
          ./oxide-sloc serve --server &
          PID=$!
          sleep 4
          FAILED=0
          for path in /auth/login /healthz; do
            code=$(curl -s -o /dev/null -w '%{http_code}' \
              -H "Authorization: Bearer ${SLOC_API_KEY}" "http://127.0.0.1:4317${path}")
            if [[ "$code" != "200" ]]; then
              echo "FAIL: ${path} -> ${code}"
              FAILED=1
            else
              echo "OK:   ${path} -> ${code}"
            fi
          done
          kill "$PID" 2>/dev/null || true
          exit "$FAILED"

  winget:
    name: Submit to winget
    needs: [smoke-install]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Skip pre-release tags (alpha/beta/rc) — winget only accepts stable versions
    if: ${{ !contains(github.ref_name, 'alpha') && !contains(github.ref_name, 'beta') && !contains(github.ref_name, 'rc') }}
    # Non-fatal until the initial PR to microsoft/winget-pkgs is merged;
    # the action cannot create a new package — only update an existing one.
    continue-on-error: true
    env:
      WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
    steps:
      # The releaser needs a classic PAT (public_repo) to fork + push to
      # microsoft/winget-pkgs. When WINGET_TOKEN is unset — or set but expired —
      # the action aborts with "GitHub token is invalid", surfacing a red check.
      # Gate the submission on the secret being present AND accepted by the
      # GitHub API so the job skips cleanly until a valid token is configured.
      - name: Check for WINGET_TOKEN
        id: token
        run: |
          if [ -z "$WINGET_TOKEN" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::WINGET_TOKEN secret not set — skipping winget submission."
            exit 0
          fi
          # Validate the PAT: an expired/revoked token still passes the -n check
          # but fails inside komac. Verify it against the API and skip if invalid.
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $WINGET_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/user)
          if [ "$code" = "200" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning::WINGET_TOKEN is set but the GitHub API rejected it (HTTP ${code}) — the PAT is likely expired or revoked. Skipping winget submission until it is rotated."
          fi

      - if: steps.token.outputs.present == 'true'
        uses: vedantmgoyal9/winget-releaser@4ffc7888bffd451b357355dc214d43bb9f23917e  # v2
        with:
          identifier: NimaShafie.OxideSLOC
          installers-regex: 'oxide-sloc-windows-x64\.zip$'
          fork-user: NimaShafie
          token: ${{ secrets.WINGET_TOKEN }}

  publish-crates:
    name: Publish to crates.io
    needs: [publish]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Run after publish succeeds (tag push) OR when publish was skipped (workflow_dispatch).
    # Never run for pre-release tags.
    if: |
      always() &&
      (needs.publish.result == 'success' || needs.publish.result == 'skipped') &&
      !contains(github.ref_name, 'alpha') && !contains(github.ref_name, 'beta') && !contains(github.ref_name, 'rc')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772  # pinned action; Rust version set by toolchain input (matches rust-toolchain.toml)
        with:
          toolchain: "1.97"

      - name: Disable vendor source redirect for publish
        run: |
          if [ -f .cargo/config.toml ]; then
            mv .cargo/config.toml .cargo/config.toml.bak
          fi

      - name: Publish crates in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          CARGO_TERM_COLOR: never   # disable ANSI codes so grep on error strings is reliable
        shell: bash
        run: |
          set -euo pipefail
          publish_crate() {
            local crate="$1"
            echo "--- Publishing $crate ---"
            local out rc
            # Use if/else so set -e does not exit before we capture rc and output
            if out=$(cargo publish -p "$crate" --no-verify 2>&1); then
              rc=0
            else
              rc=$?
            fi
            echo "$out"
            if [ $rc -eq 0 ]; then return 0; fi
            if echo "$out" | grep -qE "already uploaded|already exists on crates\.io"; then
              echo "$crate already published at this version — skipping."
              return 0
            fi
            return 1
          }
          for crate in sloc-git sloc-config sloc-languages sloc-core sloc-report sloc-web sloc-mcp oxide-sloc; do
            publish_crate "$crate"
          done

      - name: Restore vendor source redirect
        if: always()
        run: mv .cargo/config.toml.bak .cargo/config.toml || true
