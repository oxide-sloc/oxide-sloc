name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Cancel superseded runs on the same PR branch to save CI minutes. Pushes to
# main are never cancelled (they gate coverage / dist and should always finish).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  RUST_LOG: warn
  OUT_DIR: ci-out
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true  # opt in ahead of the June 2026 forced migration

jobs:
  check:
    name: Quality gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772  # stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2

      - name: Install system dependencies (rfd / native file dialog)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libwayland-dev \
            libgtk-3-dev \
            libxdo-dev

      - name: Lint
        run: bash ci/lint.sh

      - name: Security audit
        run: |
          cargo install cargo-audit --locked
          cargo audit

      - name: Dependency licenses & bans
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25  # v2.1.1 (cargo-deny 0.20.2)

      - name: Build
        run: bash ci/build.sh

      - name: Test
        run: bash ci/test.sh

  check-windows:
    name: Quality gates (Windows)
    runs-on: windows-2022  # windows-latest is rolling out to windows-2025-vs2026 (June 2026); ncc-bundled actions (rust-cache dist) fail on that image — stay on 2022 until upstream fixes land
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772  # stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
        with:
          key: windows-check

      - name: Lint
        run: bash ci/lint.sh

      - name: Build
        run: bash ci/build.sh

      - name: Test
        run: bash ci/test.sh

  smoke:
    name: CLI smoke tests
    needs: [check, check-windows, vendor-sync]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772  # stable
        with:
          toolchain: stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
        with:
          prefix-key: "v1-smoke"

      - name: Install system dependencies (rfd / native file dialog)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libwayland-dev \
            libgtk-3-dev \
            libxdo-dev

      - name: Build release binary
        run: bash ci/release.sh

      - name: Plain summary
        run: ./target/release/oxide-sloc analyze testing/fixtures/basic --plain

      - name: Per-file breakdown
        run: ./target/release/oxide-sloc analyze testing/fixtures/basic --per-file --plain

      - name: JSON + HTML reports
        run: |
          mkdir -p $OUT_DIR
          ./target/release/oxide-sloc analyze testing/fixtures/basic \
            --report-title "CI run ${{ github.run_number }}" \
            --json-out $OUT_DIR/result.json \
            --html-out $OUT_DIR/report.html
          test -s $OUT_DIR/result.json
          test -s $OUT_DIR/report.html

      - name: Re-render from saved JSON
        run: |
          ./target/release/oxide-sloc report $OUT_DIR/result.json \
            --html-out $OUT_DIR/re-rendered.html
          test -s $OUT_DIR/re-rendered.html

      - name: Policy variants
        run: |
          for policy in code-only code-and-comment comment-only separate-mixed-category; do
            echo "--- policy: $policy ---"
            ./target/release/oxide-sloc analyze testing/fixtures/basic \
              --plain --mixed-line-policy "$policy"
          done

      - name: HTML content sanity
        run: grep -q "OxideSLOC" $OUT_DIR/report.html

      - name: Web UI health check
        run: |
          ./target/release/oxide-sloc serve &
          SERVER_PID=$!
          sleep 4
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:4317/)
          kill $SERVER_PID 2>/dev/null || true
          [ "$HTTP_CODE" = "200" ] || (echo "Expected 200, got $HTTP_CODE" && exit 1)

      - name: Upload CI reports
        if: always()
        # Diagnostic artifact only — a transient FinalizeArtifact ECONNRESET from
        # GitHub's blob storage must not fail the smoke-test job after all checks pass.
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: ci-reports-${{ github.run_number }}
          path: ci-out/
          if-no-files-found: ignore

  coverage:
    name: Code coverage
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772  # stable
        with:
          toolchain: stable
          components: llvm-tools-preview

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
        with:
          key: coverage

      - name: Install system dependencies (rfd / native file dialog)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libwayland-dev \
            libgtk-3-dev \
            libxdo-dev

      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --locked

      - name: Generate coverage (lcov)
        run: cargo llvm-cov --workspace --lcov --output-path lcov.info

      - name: Upload to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f  # v7.0.0
        with:
          files: lcov.info
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  version-sync:
    name: Version consistency check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Check all internal path-deps match workspace version
        shell: bash
        run: |
          set -euo pipefail
          ws_ver=$(grep '^version\s*=' Cargo.toml | head -1 | grep -oP '"[^"]+"' | tr -d '"')
          echo "Workspace version: $ws_ver"
          # Any sloc-* path dep whose version string doesn't match the workspace version
          # is a stale pin that will break crates.io publishing on the next release.
          bad=$(grep -rn 'sloc-[a-z][a-z-]*.*path.*version\s*=\s*"' crates/*/Cargo.toml \
                | grep -v "\"$ws_ver\"" || true)
          if [ -n "$bad" ]; then
            echo "ERROR: Internal path-dep version != workspace version ($ws_ver):"
            echo "$bad"
            echo "Bump these to match the workspace version before tagging."
            exit 1
          fi
          echo "All internal path-dep versions match workspace ($ws_ver): OK"

      - name: Check sonar version matches workspace version
        shell: bash
        run: |
          set -euo pipefail
          cargo_ver=$(grep '^version\s*=' Cargo.toml | head -1 | grep -oP '"[^"]+"' | tr -d '"')
          sonar_ver=$(grep 'sonar\.projectVersion\s*=' ci/sonar/sonar-project.properties | cut -d= -f2 | tr -d '[:space:]')
          if [ "$cargo_ver" != "$sonar_ver" ]; then
            echo "ERROR: sonar.projectVersion=$sonar_ver does not match Cargo.toml version=$cargo_ver"
            echo "Update ci/sonar/sonar-project.properties before tagging."
            exit 1
          fi
          echo "sonar.projectVersion matches workspace version ($cargo_ver): OK"

  vendor-sync:
    name: Verify vendor archive is current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772  # stable
        with:
          toolchain: stable

      - name: Verify committed archive checksums
        run: sha256sum -c vendor.checksums.sha256

      - name: Extract committed vendor archive
        run: cat vendor.tar.gz.* | tar -xzf -

      - name: Re-vendor from current Cargo.lock
        run: cargo vendor --sync ci/tools/Cargo.toml vendor-expected/

      - name: Compare vendor directories
        run: |
          if ! diff -rq vendor/ vendor-expected/ > /dev/null 2>&1; then
            echo "The committed vendor archive is out of sync with Cargo.lock." >&2
            echo "Run 'bash scripts/internal/update-vendor.sh' and commit the updated files." >&2
            diff -rq vendor/ vendor-expected/ >&2 || true
            exit 1
          fi
          echo "vendor archive matches Cargo.lock — OK"

  pipeline-sim:
    name: Jenkins pipeline simulation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # Pure-stdlib Python harness — proves the CI capability-detection and
      # graceful-degradation logic across every permission / air-gap scenario.
      # No Rust build needed, so it runs in seconds and guards against regressions
      # in detect-capabilities.py / install-plugins.sh / the dashboard banner.
      - name: Simulate permission + air-gap scenarios
        run: python3 ci/jenkins/tests/simulate-scenarios.py

      # Atlassian CI integration regression tests. Lock in the P0/P1 fixes and the
      # notify-bitbucket.sh auth/URL/state logic. Pure stdlib — no Rust, no network.
      - name: Atlassian notify — Confluence regression tests
        run: python3 ci/jenkins/tests/test-notify-confluence.py

      - name: Atlassian notify — pipeline-helpers static guards (P0/P3)
        run: python3 ci/jenkins/tests/test-pipeline-helpers-guards.py

      - name: Jenkins REPO_URL air-gap resilience guards
        run: python3 ci/jenkins/tests/test-repo-url-airgap.py

      - name: Jenkins Windows-agent portability guards (resolveBash / shx / initEnv)
        run: python3 ci/jenkins/tests/test-windows-agent-dispatch.py

      - name: Atlassian notify — Bitbucket state/URL/auth tests
        run: bash ci/jenkins/tests/test-notify-bitbucket.sh

  self-analysis:
    name: Self-analysis (dogfood)
    needs: [smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write   # sticky PR comment
      security-events: write # upload-sarif
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0  # full history so we can diff against the PR base branch

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772  # stable
        with:
          toolchain: stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
        with:
          key: self-analysis

      - name: Install system dependencies (rfd / native file dialog)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libwayland-dev libgtk-3-dev libxdo-dev

      - name: Build release binary
        run: bash ci/release.sh

      - name: Analyze this repository
        run: |
          mkdir -p $OUT_DIR
          ./target/release/oxide-sloc analyze . \
            --report-title "oxide-sloc self-analysis" \
            --per-file \
            --json-out $OUT_DIR/result.json
          test -s $OUT_DIR/result.json

      - name: Diff against base branch (PRs only)
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          base="$BASE_REF"
          git fetch --no-tags --depth=1 origin "$base"
          git worktree add /tmp/sloc-base FETCH_HEAD
          ./target/release/oxide-sloc analyze /tmp/sloc-base \
            --json-out $OUT_DIR/base.json --plain
          ./target/release/oxide-sloc diff \
            $OUT_DIR/base.json $OUT_DIR/result.json \
            --json-out $OUT_DIR/diff.json --plain || true

      - name: Render Markdown report
        run: |
          args="$OUT_DIR/result.json"
          [ -f "$OUT_DIR/diff.json" ] && args="$args $OUT_DIR/diff.json"
          python3 ci/github/sloc-report-md.py $args | tee $OUT_DIR/comment.md >> "$GITHUB_STEP_SUMMARY"

      - name: Generate SARIF (cyclomatic complexity + hotspots)
        run: python3 ci/github/sloc-to-sarif.py $OUT_DIR/result.json $OUT_DIR/sloc.sarif

      - name: Upload SARIF to code scanning
        # Non-fatal: fork PRs lack the write token for code-scanning upload.
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3  # v4.37.6
        with:
          sarif_file: ci-out/sloc.sarif
          category: oxide-sloc

      - name: Sticky PR comment
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          marker='<!-- oxide-sloc-report -->'
          cid=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments" --paginate \
                --jq ".[] | select(.body | contains(\"$marker\")) | .id" | head -1)
          if [ -n "$cid" ]; then
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${cid}" \
              -F body=@$OUT_DIR/comment.md >/dev/null && echo "Updated comment $cid"
          else
            gh api -X POST "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments" \
              -F body=@$OUT_DIR/comment.md >/dev/null && echo "Created PR comment"
          fi
