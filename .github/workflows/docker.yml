name: Docker

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Preview GHCR pruning without deleting anything'
        type: boolean
        default: false

permissions: {}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true  # opt in ahead of the June 2026 forced migration

jobs:
  build-push:
    name: Build and push Docker image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write       # required for SLSA provenance attestation and cosign OIDC signing
      attestations: write   # required to write the GitHub-signed build-provenance attestation

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e  # v4.3.0

      - name: Validate workspace structure
        run: |
          # Confirm every workspace crate directory exists and has a Cargo.toml.
          # A missing crate here means .dockerignore or a bad merge excluded it,
          # and the Docker build would fail with a cryptic manifest error.
          for crate in sloc-config sloc-languages sloc-core sloc-report sloc-web sloc-cli; do
            if [ ! -f "crates/${crate}/Cargo.toml" ]; then
              echo "ERROR: crates/${crate}/Cargo.toml is missing — workspace is incomplete"
              exit 1
            fi
          done
          # Confirm the split vendor parts and their checksum file are all present.
          for part in vendor.tar.gz.aa vendor.tar.gz.ab vendor.tar.gz.ac vendor.checksums.sha256; do
            if [ ! -f "$part" ]; then
              echo "ERROR: $part is missing"
              exit 1
            fi
          done
          sha256sum -c vendor.checksums.sha256
          echo "Workspace structure OK"

      - name: Build and push
        id: build-push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # BuildKit-generated SLSA provenance (mode=max = full build metadata) + SBOM,
          # both attached to the image as in-toto attestations.
          provenance: mode=max
          sbom: true

      # GitHub-signed SLSA build provenance, generated in GitHub's control plane (not by the
      # build itself) and attached to the image by digest — the non-forgeable provenance that
      # takes the release from SLSA Build L2 toward L3.
      - name: Generate SLSA build provenance attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.build-push.outputs.digest }}
          push-to-registry: true

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2
        with:
          # Pin to cosign v2.x: cosign-installer v4 defaults to installing cosign v3, which
          # defaults to OCI 1.1 referrers-based signature discovery. GHCR returns DENIED (not
          # 404) for a missing/inaccessible referrer tag, which trips `cosign verify` even
          # though `cosign sign` succeeded. cosign v2 uses tag-based signature storage for both
          # sign and verify — the convention GHCR reliably supports — so keeping both steps on
          # v2 keeps signing and verification on the same GHCR-compatible discovery path.
          cosign-release: 'v2.6.5'

      - name: Sign image with cosign (keyless via GitHub OIDC)
        env:
          DIGEST: ${{ steps.build-push.outputs.digest }}
        run: |
          IMAGE_REF="ghcr.io/${{ github.repository }}@${DIGEST}"
          cosign sign --yes "${IMAGE_REF}"

      # Fail the release if the published image signature is not verifiable — proves the image
      # carries a valid cosign signature bound to this workflow's identity before it ships.
      - name: Verify image signature
        env:
          DIGEST: ${{ steps.build-push.outputs.digest }}
        run: |
          IMAGE_REF="ghcr.io/${{ github.repository }}@${DIGEST}"
          cosign verify "${IMAGE_REF}" \
            --certificate-identity-regexp "^https://github.com/${{ github.repository }}/" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com"

  # Prune superseded image versions so the GHCR package does not grow without bound.
  # Runs only after the new image is fully pushed, signed, and verified (needs: build-push),
  # so the current release and its signature/attestation are safely in place before any
  # deletion. The action is cosign/referrer-aware: deleting an image also removes its paired
  # `sha256-<digest>.sig` and attestation manifests, and it preserves the multi-arch children
  # + referrers of every KEPT image — a plain version-count or "delete untagged" prune would
  # orphan signatures or break the index.
  cleanup-ghcr:
    name: Prune old GHCR image versions
    needs: build-push
    runs-on: ubuntu-latest
    permissions:
      packages: write     # required to delete package versions
    # Serialize prunes so two overlapping pushes can't race on the same package graph.
    concurrency:
      group: ghcr-cleanup
      cancel-in-progress: false
    steps:
      - name: Prune old image versions (cosign-signature aware)
        uses: dataaxiom/ghcr-cleanup-action@d52806a0dc70b430571a37da1fde39733ffd640f  # v1.2.2
        with:
          owner: ${{ github.repository_owner }}
          packages: ${{ github.event.repository.name }}
          # Keep the 15 most-recent tagged images, matching the release-retention policy.
          keep-n-tagged: 15
          # Moving tags that must always survive regardless of age.
          exclude-tags: latest,main
          # Reclaim digests left untagged when 'latest'/'main' move forward each push.
          delete-untagged: true
          # Fail loudly on an inconsistent result instead of leaving a partial prune.
          validate: true
          # Manual `workflow_dispatch` can preview deletions first; automatic runs delete.
          dry-run: ${{ inputs.dry_run || false }}
