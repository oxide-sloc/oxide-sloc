name: Bundle Rust toolchain

# Produces gzip-compressed, split toolchain archives that install.sh needs
# for fully offline / air-gapped builds and commits them to toolchain/.
#
# Run manually from the Actions tab, or it fires automatically when
# rust-toolchain.toml is updated on main.
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'rust-toolchain.toml'

permissions: {}

concurrency:
  group: bundle-toolchain
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ── Linux x86_64 (native) ────────────────────────────────────────────────
  linux-x86_64:
    name: Bundle linux-x86_64
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Bundle toolchain
        run: bash scripts/internal/bundle-rust-toolchain.sh linux-x86_64

      - name: Upload parts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: toolchain-linux-x86_64
          path: toolchain/rust-toolchain-linux-x86_64.tar.gz.*
          retention-days: 1

  # ── Linux arm64 (native arm64 runner) ───────────────────────────────────
  linux-arm64:
    name: Bundle linux-arm64
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Bundle toolchain
        run: bash scripts/internal/bundle-rust-toolchain.sh linux-arm64

      - name: Upload parts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: toolchain-linux-arm64
          path: toolchain/rust-toolchain-linux-arm64.tar.gz.*
          retention-days: 1

  # ── Windows x64 (native, gzip via Git Bash) ─────────────────────────────
  windows-x64:
    name: Bundle windows-x64
    runs-on: windows-latest
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # Decode the PFX certificate and expose it via WINDOWS_CERT_PFX / WINDOWS_CERT_PASS
      # env vars so that bundle-rust-toolchain.sh can sign the PE binaries before archiving.
      # The step is a no-op when the secret is absent (open-source forks, personal runs).
      - name: Decode signing certificate
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if (-not $env:WINDOWS_CERTIFICATE) {
            Write-Output "WINDOWS_CERTIFICATE secret not set — toolchain binaries will be unsigned."
            exit 0
          }
          $certBytes = [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE)
          $certPath  = "$env:RUNNER_TEMP\toolchain-signing.pfx"
          [IO.File]::WriteAllBytes($certPath, $certBytes)
          Add-Content $env:GITHUB_ENV "WINDOWS_CERT_PFX=$certPath"
          Add-Content $env:GITHUB_ENV "WINDOWS_CERT_PASS=$($env:WINDOWS_CERTIFICATE_PASSWORD)"
          Write-Output "Certificate decoded to $certPath"

      - name: Bundle toolchain
        run: bash scripts/internal/bundle-rust-toolchain.sh windows-x64

      - name: Clean up signing certificate
        if: always()
        shell: pwsh
        run: |
          if ($env:WINDOWS_CERT_PFX -and (Test-Path $env:WINDOWS_CERT_PFX)) {
            Remove-Item -Force $env:WINDOWS_CERT_PFX
            Write-Output "Signing certificate removed."
          }

      - name: Upload parts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: toolchain-windows-x64
          path: toolchain/rust-toolchain-windows-x64.tar.gz.*
          retention-days: 1

  # ── Commit all platform parts back to main ───────────────────────────────
  commit:
    name: Commit toolchain archives
    needs: [linux-x86_64, linux-arm64, windows-x64]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: main

      - name: Download linux-x86_64 parts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: toolchain-linux-x86_64
          path: toolchain/

      - name: Download linux-arm64 parts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: toolchain-linux-arm64
          path: toolchain/

      - name: Download windows-x64 parts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: toolchain-windows-x64
          path: toolchain/

      - name: Write combined checksums.sha256
        run: |
          RUST_VER=$(grep 'channel' rust-toolchain.toml | sed 's/.*= *"\(.*\)"/\1/' | tr -d '[:space:]')
          {
            printf '# oxide-sloc Rust toolchain checksums\n'
            printf '# Generated by .github/workflows/bundle-toolchain.yml\n'
            printf '# Rust %s — rustc, cargo, rust-std + rustfmt/clippy/llvm-tools components\n' "$RUST_VER"
            printf '# Compressed with gzip -9, split into ≤45 MB parts\n'
            printf '# Verify with: sha256sum -c toolchain/checksums.sha256\n\n'
            sha256sum toolchain/rust-toolchain-*.tar.gz.*
          } > toolchain/checksums.sha256
          cat toolchain/checksums.sha256

      # Main is a protected branch (PRs + "Quality gates" check required), so a
      # direct push is rejected.  peter-evans/create-pull-request pushes the
      # updated toolchain/ files to a new unprotected branch and opens a PR in
      # one atomic step.  The PR is a no-op (and is skipped) when the toolchain
      # archives are unchanged.
      #
      # The PR is opened with a GitHub App token rather than the default
      # GITHUB_TOKEN on purpose: GitHub suppresses workflow triggers for any
      # push or PR created by GITHUB_TOKEN (anti-recursion), so CodeQL never
      # ran on the toolchain PR and OpenSSF Scorecard's SAST check flagged the
      # commit as not SAST-scanned.  An app token is treated as a distinct
      # actor, so push/pull_request workflows (CodeQL included) run normally.
      - name: Resolve Rust version
        id: rust
        run: |
          RUST_VER=$(grep 'channel' rust-toolchain.toml | sed 's/.*= *"\(.*\)"/\1/' | tr -d '[:space:]')
          echo "version=$RUST_VER" >> "$GITHUB_OUTPUT"

      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        with:
          app-id: ${{ secrets.TOOLCHAIN_APP_ID }}
          private-key: ${{ secrets.TOOLCHAIN_APP_PRIVATE_KEY }}

      - name: Open PR with updated toolchain archives
        id: cpr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1  # v8.1.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          branch: chore/update-toolchain-${{ github.run_id }}
          base: main
          add-paths: toolchain/
          commit-message: "chore: update bundled Rust toolchain (${{ steps.rust.outputs.version }})"
          title: "chore: update bundled Rust toolchain (${{ steps.rust.outputs.version }})"
          body: |
            Automated toolchain bundle update from workflow run ${{ github.run_id }}.

            Updates the split, gzip-compressed Rust toolchain archives in `toolchain/`
            (and `toolchain/checksums.sha256`) for Rust ${{ steps.rust.outputs.version }}.
            This PR was opened automatically because main is a protected branch.
            Auto-merge is enabled — it lands on main as soon as Quality gates passes.
          labels: "automated,toolchain"
          delete-branch: true

      # Land on main automatically once Quality gates passes.  The PR is the only
      # way past branch protection; auto-merge means no human has to click Merge.
      # Requires "Allow auto-merge" to be enabled in the repository settings.
      - name: Enable auto-merge
        if: steps.cpr.outputs.pull-request-number
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR: ${{ steps.cpr.outputs.pull-request-number }}
        run: gh pr merge --auto --squash "$PR"
