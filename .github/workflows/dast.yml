name: DAST (OWASP ZAP baseline)

# Closes audit coverage gap F-09: dynamic scan of a running oxide-sloc instance.
# Runs on demand and weekly (not on every PR — DAST is slow and noisy). Builds the
# binary, starts `serve` in desktop mode (no API key) so ZAP can crawl all routes,
# then runs the OWASP ZAP baseline (passive) scan and uploads the report.

on:
  workflow_dispatch:
  schedule:
    - cron: "27 6 * * 1" # Mondays 06:27 UTC

permissions:
  contents: read

jobs:
  zap-baseline:
    name: ZAP baseline scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install system dependencies (rfd / native file dialog)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libwayland-dev \
            libgtk-3-dev \
            libxdo-dev

      - name: Build release binary
        run: cargo build --release -p oxide-sloc

      - name: Start server
        run: |
          # Bind to 0.0.0.0 so the ZAP container (via --network=host) can reach it. A
          # non-loopback bind auto-enables server-mode protections, which fail closed
          # unless auth is configured; SLOC_ALLOW_UNAUTHENTICATED=1 explicitly opts into
          # an open, unauthenticated instance on this throwaway CI runner so the scanner
          # can crawl every route without credentials.
          SLOC_BIND=0.0.0.0:4317 SLOC_ALLOW_UNAUTHENTICATED=1 \
            ./target/release/oxide-sloc serve &
          echo "SERVER_PID=$!" >> "$GITHUB_ENV"
          # Wait for the health endpoint to come up (max ~30s); fail fast if it never does.
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4317/healthz >/dev/null 2>&1; then
              echo "server is up"; exit 0
            fi
            sleep 1
          done
          echo "::error::server failed to become healthy within 30s" >&2
          exit 1

      - name: ZAP baseline scan
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25  # v0.15.0
        with:
          target: http://localhost:4317
          # Non-blocking: report findings without failing the build. Flip to `false`
          # (and curate the rules file) once the baseline is triaged.
          fail_action: false
          # Don't open a GitHub issue for findings. The default (true) needs
          # `issues: write`, which this least-privilege token deliberately lacks —
          # attempting it returns 403 and fails the step. Findings stay in the job
          # log and the uploaded ZAP report artifact.
          allow_issue_writing: false
          cmd_options: "-a"

      - name: Stop server
        if: always()
        run: kill "${SERVER_PID}" 2>/dev/null || true
