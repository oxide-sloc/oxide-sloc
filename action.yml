name: oxide-sloc SLOC Analysis
description: Count source lines, detect tests, and report code metrics for any repository
author: Nima Shafie

branding:
  icon: bar-chart-2
  color: orange

inputs:
  path:
    description: Directory to analyze
    default: '.'
    required: false
  version:
    description: oxide-sloc release tag to download (e.g. v1.6.1). Defaults to latest.
    default: latest
    required: false
  json-out:
    description: Path to write the JSON result
    default: sloc-out/result.json
    required: false
  html-out:
    description: Path to write the HTML report (optional)
    default: ''
    required: false
  server-url:
    description: Base URL of an oxide-sloc server to POST results to via /api/ingest
    default: ''
    required: false
  api-key:
    description: Bearer token for the oxide-sloc server
    default: ''
    required: false
  csv-out:
    description: Path to write a CSV summary (optional)
    default: ''
    required: false
  xlsx-out:
    description: Path to write an Excel (.xlsx) workbook (optional)
    default: ''
    required: false
  coverage-file:
    description: >-
      Path to a coverage report to attach per-file coverage (LCOV .info,
      Cobertura XML, JaCoCo XML, coverage.py JSON, or Istanbul/NYC JSON)
    default: ''
    required: false
  config:
    description: Load configuration / preset from a TOML file (optional)
    default: ''
    required: false
  mixed-line-policy:
    description: >-
      Override mixed-line counting policy: code-only | code-and-comment |
      comment-only | separate-mixed-category
    default: ''
    required: false
  style-col-threshold:
    description: Column-width threshold for style N-col compliance (80, 100, 120; default 80)
    default: ''
    required: false
  activity-window:
    description: Git Hotspots activity window in days (default 90; 0 disables)
    default: ''
    required: false
  attribution:
    description: >-
      Per-author code-ownership attribution via git blame. On by default; set to
      'false' to skip the blame pass (emits --no-attribution)
    default: ''
    required: false
  no-duplicates:
    description: Exclude duplicate files (identical content) from SLOC totals (true/false)
    default: ''
    required: false
  max-complexity:
    description: Exit with code 6 if any file's cyclomatic complexity exceeds this threshold
    default: ''
    required: false

outputs:
  total-lines:
    description: Total physical lines (code + comment + blank)
    value: ${{ steps.parse.outputs.total-lines }}
  code-lines:
    description: Effective code SLOC
    value: ${{ steps.parse.outputs.code-lines }}
  comment-lines:
    description: Comment lines
    value: ${{ steps.parse.outputs.comment-lines }}
  blank-lines:
    description: Blank lines
    value: ${{ steps.parse.outputs.blank-lines }}
  files-analyzed:
    description: Number of source files analyzed
    value: ${{ steps.parse.outputs.files-analyzed }}
  json-path:
    description: Absolute path to the JSON result file
    value: ${{ steps.analyze.outputs.json-path }}

runs:
  using: composite
  steps:
    - name: Resolve version
      id: resolve
      env:
        INPUT_VERSION: ${{ inputs.version }}
      shell: bash
      run: |
        if [ "$INPUT_VERSION" = "latest" ]; then
          VERSION=$(curl -fsSL \
            https://api.github.com/repos/oxide-sloc/oxide-sloc/releases/latest \
            | grep '"tag_name"' | sed 's/.*"tag_name": *"\([^"]*\)".*/\1/')
        else
          VERSION="$INPUT_VERSION"
        fi
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"

    - name: Download binary (Linux / macOS)
      if: runner.os != 'Windows'
      env:
        RESOLVED_VERSION: ${{ steps.resolve.outputs.version }}
      shell: bash
      run: |
        if [ "$(uname -m)" = "aarch64" ] || [ "$(uname -m)" = "arm64" ]; then
          ASSET="oxide-sloc-linux-arm64.tar.gz"
        else
          ASSET="oxide-sloc-linux-x86_64.tar.gz"
        fi
        URL="https://github.com/oxide-sloc/oxide-sloc/releases/download/${RESOLVED_VERSION}/${ASSET}"
        curl -fsSL "$URL" | sudo tar -xz -C /usr/local/bin
        chmod +x /usr/local/bin/oxide-sloc

    - name: Download binary (Windows)
      if: runner.os == 'Windows'
      env:
        RESOLVED_VERSION: ${{ steps.resolve.outputs.version }}
      shell: pwsh
      run: |
        $URL = "https://github.com/oxide-sloc/oxide-sloc/releases/download/$env:RESOLVED_VERSION/oxide-sloc-windows-x64.zip"
        $ZIP  = "$env:RUNNER_TEMP\oxide-sloc.zip"
        $DEST = "$env:RUNNER_TEMP\oxide-sloc-bin"
        Invoke-WebRequest -Uri $URL -OutFile $ZIP -UseBasicParsing
        Expand-Archive -Path $ZIP -DestinationPath $DEST -Force
        $EXE = (Get-ChildItem $DEST -Recurse -Filter "oxide-sloc.exe" |
                Select-Object -First 1).FullName
        Copy-Item $EXE "$env:SystemRoot\oxide-sloc.exe"

    - name: Analyze
      id: analyze
      env:
        INPUT_PATH: ${{ inputs.path }}
        INPUT_JSON_OUT: ${{ inputs.json-out }}
        INPUT_HTML_OUT: ${{ inputs.html-out }}
        INPUT_CSV_OUT: ${{ inputs.csv-out }}
        INPUT_XLSX_OUT: ${{ inputs.xlsx-out }}
        INPUT_COVERAGE_FILE: ${{ inputs.coverage-file }}
        INPUT_CONFIG: ${{ inputs.config }}
        INPUT_MIXED_LINE_POLICY: ${{ inputs.mixed-line-policy }}
        INPUT_STYLE_COL_THRESHOLD: ${{ inputs.style-col-threshold }}
        INPUT_ACTIVITY_WINDOW: ${{ inputs.activity-window }}
        INPUT_ATTRIBUTION: ${{ inputs.attribution }}
        INPUT_NO_DUPLICATES: ${{ inputs.no-duplicates }}
        INPUT_MAX_COMPLEXITY: ${{ inputs.max-complexity }}
      shell: bash
      run: |
        mkdir -p "$(dirname "$INPUT_JSON_OUT")"
        EXTRA=""
        if [ -n "$INPUT_HTML_OUT" ]; then
          EXTRA="$EXTRA --html-out $INPUT_HTML_OUT"
        fi
        if [ -n "$INPUT_CSV_OUT" ]; then
          EXTRA="$EXTRA --csv-out $INPUT_CSV_OUT"
        fi
        if [ -n "$INPUT_XLSX_OUT" ]; then
          EXTRA="$EXTRA --xlsx-out $INPUT_XLSX_OUT"
        fi
        if [ -n "$INPUT_COVERAGE_FILE" ]; then
          EXTRA="$EXTRA --coverage-file $INPUT_COVERAGE_FILE"
        fi
        if [ -n "$INPUT_CONFIG" ]; then
          EXTRA="$EXTRA --config $INPUT_CONFIG"
        fi
        if [ -n "$INPUT_MIXED_LINE_POLICY" ]; then
          EXTRA="$EXTRA --mixed-line-policy $INPUT_MIXED_LINE_POLICY"
        fi
        if [ -n "$INPUT_STYLE_COL_THRESHOLD" ]; then
          EXTRA="$EXTRA --style-col-threshold $INPUT_STYLE_COL_THRESHOLD"
        fi
        if [ -n "$INPUT_ACTIVITY_WINDOW" ]; then
          EXTRA="$EXTRA --activity-window $INPUT_ACTIVITY_WINDOW"
        fi
        if [ -n "$INPUT_MAX_COMPLEXITY" ]; then
          EXTRA="$EXTRA --max-complexity $INPUT_MAX_COMPLEXITY"
        fi
        # Attribution is on by default; only emit --no-attribution when explicitly disabled.
        case "$INPUT_ATTRIBUTION" in
          false|False|FALSE|0|no|off) EXTRA="$EXTRA --no-attribution" ;;
          true|True|TRUE|1|yes|on)    EXTRA="$EXTRA --attribution" ;;
        esac
        case "$INPUT_NO_DUPLICATES" in
          true|True|TRUE|1|yes|on)    EXTRA="$EXTRA --no-duplicates" ;;
        esac
        oxide-sloc analyze "$INPUT_PATH" \
          --json-out "$INPUT_JSON_OUT" $EXTRA
        echo "json-path=$(realpath "$INPUT_JSON_OUT")" >> "$GITHUB_OUTPUT"

    - name: Parse results
      id: parse
      env:
        INPUT_JSON_OUT: ${{ inputs.json-out }}
      shell: bash
      run: |
        if [ -f "$INPUT_JSON_OUT" ]; then
          CODE=$(jq '.summary_totals.code_lines    // 0' "$INPUT_JSON_OUT")
          CMT=$(jq  '.summary_totals.comment_lines // 0' "$INPUT_JSON_OUT")
          BLK=$(jq  '.summary_totals.blank_lines   // 0' "$INPUT_JSON_OUT")
          TOT=$(jq  '.summary_totals.total_physical_lines // 0' "$INPUT_JSON_OUT")
          FLS=$(jq  '.summary_totals.files_analyzed // 0' "$INPUT_JSON_OUT")
          echo "code-lines=$CODE"    >> "$GITHUB_OUTPUT"
          echo "comment-lines=$CMT" >> "$GITHUB_OUTPUT"
          echo "blank-lines=$BLK"   >> "$GITHUB_OUTPUT"
          echo "total-lines=$TOT"   >> "$GITHUB_OUTPUT"
          echo "files-analyzed=$FLS" >> "$GITHUB_OUTPUT"
        fi

    - name: Send to server
      if: inputs.server-url != ''
      shell: bash
      env:
        SLOC_API_KEY: ${{ inputs.api-key }}
        INPUT_JSON_OUT: ${{ inputs.json-out }}
        INPUT_SERVER_URL: ${{ inputs.server-url }}
      run: |
        oxide-sloc send "$INPUT_JSON_OUT" \
          --webhook-url "$INPUT_SERVER_URL/api/ingest" \
          ${SLOC_API_KEY:+--webhook-token "$SLOC_API_KEY"}

    - name: Archive result
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: sloc-result
        path: ${{ inputs.json-out }}
        if-no-files-found: warn
        retention-days: 7
