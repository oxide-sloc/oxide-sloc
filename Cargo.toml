[workspace]
members = [
  "crates/sloc-config",
  "crates/sloc-languages",
  "crates/sloc-core",
  "crates/sloc-report",
  "crates/sloc-git",
  "crates/sloc-web",
  "crates/sloc-cli",
  "crates/sloc-mcp",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "AGPL-3.0-or-later"
version = "1.6.27"
authors = ["Nima Shafie"]
description = "Source line analysis tool — CLI, web UI, HTML/PDF reports, test metrics, git hotspots & code ownership, and CI/CD integration"
keywords = ["sloc", "code-analysis", "mcp", "static-analysis", "metrics"]
categories = ["command-line-utilities", "development-tools", "development-tools::testing"]
repository = "https://github.com/oxide-sloc/oxide-sloc"
homepage = "https://github.com/oxide-sloc/oxide-sloc"
documentation = "https://docs.rs/oxide-sloc"
readme = "README.md"
rust-version = "1.95"

[workspace.dependencies]
anyhow = "1"
ring = { version = "0.17", default-features = false }
askama = "0.16"
axum = { version = "0.8", features = ["form", "json", "macros"] }
chrono = { version = "0.4", features = ["serde", "clock"] }
clap = { version = "4.6", features = ["derive", "env"] }
clap_complete = "4.6"
prometheus = { version = "0.14", features = ["process"] }
encoding_rs = "0.8"
globset = "0.4"
hyper-util = { version = "0.1", features = ["server-auto", "tokio"] }
ignore = "0.4"
lettre = { version = "0.11.23", features = ["tokio1-rustls-tls", "builder", "smtp-transport"], default-features = false }
reqwest = { version = "0.13", features = ["json", "rustls-no-provider"], default-features = false }
rustls = { version = "0.23", features = ["ring"], default-features = false }
rustls-pki-types = { version = "1", features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-util", "io-std", "fs", "net", "sync", "time", "process", "signal"] }
tokio-rustls = { version = "0.26", features = ["ring"], default-features = false }
toml = "1.1"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.7", features = ["cors", "timeout"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1", features = ["v4", "serde"] }
base64 = "0.23"

[workspace.lints.clippy]
# Transitive dependency version splits that are unavoidable given the current
# Rust ecosystem state.  Each duplicate pair is already documented in deny.toml
# under [bans] skip = [...] which is the authoritative allowlist for cargo-deny.
#
# Active duplicates (as of Cargo.lock):
#   hashbrown  0.15.5 (indexmap) vs 0.17.0 (foldhash / newer indexmap)
#   getrandom  0.2 (ring) / 0.3 (rand) / 0.4 (uuid ≥ 1.23, tempfile ≥ 3.27)
#   windows-sys 0.52 / 0.59 / 0.60 / 0.61 (Windows crate ecosystem transition)
#   wit-bindgen 0.51 / 0.57 (wasmtime dependency split)
#   base64     0.22 (headless_chrome / hyper-util) vs 0.23 (our direct dep)
#   syn        2 (older proc-macros) vs 3 (async-trait / clap_derive transition)
multiple_crate_versions = "allow"

# Dev/test debug info is capped at line tables only. Full debug info (the default `debug = true`)
# emits ~360 MB .pdb files per binary; with dozens of test binaries and generations that cargo
# never garbage-collects, target/debug balloons into the tens of GB. Line tables keep file:line
# in panic/test backtraces (all we need here) while shrinking each build generation ~5-10x.
#
# Incremental compilation is disabled on purpose: it produces a multi-GB target/debug/incremental
# cache that buys little here (the 35k-line single-file sloc-web crate recompiles wholesale on any
# edit) and is pure waste in CI (fresh runners can't reuse it). Off everywhere keeps the tree lean;
# the release profile already defaults incremental off, so dist/install builds are unaffected.
[profile.dev]
debug = "line-tables-only"
incremental = false

[profile.test]
debug = "line-tables-only"
incremental = false

# Dependencies never need debug info in a dev/test build (we don't step through vendored
# crates), and they are the bulk of target/debug/deps. Stripping their debug info entirely
# keeps our own crates' file:line backtraces intact while shedding the largest share of the
# per-generation .pdb/.rlib weight.
[profile.dev.package."*"]
debug = false

# Optimized release build. Benefits the CPU-bound analysis state machine (cross-crate
# inlining) and shrinks the air-gapped dist binaries (symbols stripped). `panic` is left at
# the default "unwind" on purpose: sloc-web is a long-running server and abort-on-panic would
# turn a single bad request into a full-process crash.
[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[workspace.metadata.oxide-sloc]
product_name = "oxide-sloc"
