# oxide-sloc — reusable GitLab CI include
#
# Drop oxide-sloc SLOC analysis into any GitLab project with a one-line include.
# Uses the modern typed `spec:inputs` interface (GitLab 15.11+, GA 16.0). For
# older GitLab, use the `variables:`-only fallback shown at the bottom.
#
# Include it and configure the inputs:
#
#   include:
#     - project: your-group/oxide-sloc
#       file: ci/sloc-gitlab.yml
#       inputs:
#         scan-path: "."
#         preset: "default"
#         server-url: "http://sloc.internal:4317"
#         ref-diff: true
#
# Native GitLab surfaces produced:
#   • Report link in the MR widget  ← artifacts:expose_as
#   • (optional) ingest into a central oxide-sloc server via `oxide-sloc send`
#   • (optional) push artifacts to any of 7 repositories via ci/artifact-push.sh
#
# Masked CI/CD variables (Settings → CI/CD → Variables) referenced by inputs:
#   <api-key-var>          bearer token for the ingest server (name it below)
#   ARTIFACT_REPO_USER     artifact-repo username / access key
#   ARTIFACT_REPO_PASS     artifact-repo password / token

spec:
  inputs:
    scan-path:
      default: "."
      description: "Directory within the repo to analyze."
    preset:
      default: "default"
      options: ["none", "default", "strict", "full-scope"]
      description: "Preset TOML (ci/sloc-ci-<preset>.toml)."
    mixed-line-policy:
      default: ""
      options: ["", "code-only", "code-and-comment", "comment-only", "separate-mixed-category"]
      description: "Classification of lines holding both code and a comment."
    activity-window:
      default: "90"
      description: "Git Hotspots window in days (0 disables)."
    attribution:
      type: boolean
      default: true
      description: "Per-author code-ownership attribution via git blame (on by default; false emits --no-attribution)."
    style-col-threshold:
      default: "80"
      description: "Column-width threshold for style N-col compliance (80, 100, 120)."
    max-complexity:
      default: ""
      description: "Complexity gate: fail (exit 6) if any file cyclomatic complexity exceeds N (blank = off)."
    no-duplicates:
      type: boolean
      default: false
      description: "Exclude duplicate (identical-content) files from SLOC totals (groups still reported)."
    coverage-file:
      default: ""
      description: "Path to a coverage report (LCOV/Cobertura/JaCoCo/coverage.py/Istanbul, auto-detected; blank = none)."
    generate-html:
      type: boolean
      default: true
      description: "Write the HTML report."
    generate-pdf:
      type: boolean
      default: false
      description: "Write the PDF report."
    ref-diff:
      type: boolean
      default: false
      description: "On MRs, diff against the target branch and comment on the MR."
    stage:
      default: "test"
      description: "Pipeline stage to attach the job to (must exist in the including pipeline)."
    server-url:
      default: ""
      description: "Base URL of a central oxide-sloc server to ingest results into (blank = skip)."
    api-key-var:
      default: "SLOC_API_KEY"
      description: "Name of the masked CI variable holding the ingest bearer token."
    label:
      default: ""
      description: "Display label in /view-reports (blank = $CI_PROJECT_PATH)."
    artifact-repo-type:
      default: "none"
      options: ["none", "artifactory", "nexus", "nexus2", "s3", "minio", "azure-blob", "generic-http"]
      description: "Push artifacts to this repository backend (via ci/artifact-push.sh)."
    artifact-repo-url:
      default: ""
      description: "Base URL of the artifact repository."

---

sloc-analysis:
  stage: "$[[ inputs.stage ]]"
  image: rust:latest
  variables:
    SLOC_LABEL: "$[[ inputs.label ]]"
    OUT_DIR: "sloc-out"
  before_script:
    - cargo install oxide-sloc --locked
  script:
    - mkdir -p "${OUT_DIR}"
    - |
      set -e
      LABEL="${SLOC_LABEL:-$CI_PROJECT_PATH}"
      args=(analyze "$[[ inputs.scan-path ]]")
      args+=(--json-out "${OUT_DIR}/result.json")
      args+=(--csv-out  "${OUT_DIR}/report.csv")
      args+=(--xlsx-out "${OUT_DIR}/report.xlsx")
      [ "$[[ inputs.generate-html ]]" = "true" ] && args+=(--html-out "${OUT_DIR}/report.html")
      [ "$[[ inputs.generate-pdf ]]"  = "true" ] && args+=(--pdf-out  "${OUT_DIR}/report.pdf")
      [ "$[[ inputs.preset ]]" != "none" ] && args+=(--config "ci/sloc-ci-$[[ inputs.preset ]].toml")
      [ -n "$[[ inputs.mixed-line-policy ]]" ] && args+=(--mixed-line-policy "$[[ inputs.mixed-line-policy ]]")
      [ -n "$[[ inputs.activity-window ]]" ] && args+=(--activity-window "$[[ inputs.activity-window ]]")
      # Attribution is on by default in the binary; only emit a flag to turn it OFF.
      [ "$[[ inputs.attribution ]]" = "false" ] && args+=(--no-attribution)
      # Style N-col threshold: only when non-default.
      [ -n "$[[ inputs.style-col-threshold ]]" ] && [ "$[[ inputs.style-col-threshold ]]" != "80" ] && args+=(--style-col-threshold "$[[ inputs.style-col-threshold ]]")
      # Complexity gate (CLI-only): only when set.
      [ -n "$[[ inputs.max-complexity ]]" ] && args+=(--max-complexity "$[[ inputs.max-complexity ]]")
      # Exclude duplicate files (CLI-only).
      [ "$[[ inputs.no-duplicates ]]" = "true" ] && args+=(--no-duplicates)
      # Coverage import: only when a path is provided.
      [ -n "$[[ inputs.coverage-file ]]" ] && args+=(--coverage-file "$[[ inputs.coverage-file ]]")
      [ -n "${CI_COMMIT_REF_NAME}" ] && args+=(--git-branch "${CI_COMMIT_REF_NAME}")
      echo "+ oxide-sloc ${args[*]}"
      oxide-sloc "${args[@]}"
    # Optional: ref-diff + MR comment.
    - |
      if [ "$[[ inputs.ref-diff ]]" = "true" ] && [ "${CI_PIPELINE_SOURCE}" = "merge_request_event" ]; then
        git fetch -q origin "${CI_MERGE_REQUEST_TARGET_BRANCH_NAME}" || true
        rm -rf .sloc-base
        git worktree add --detach .sloc-base "origin/${CI_MERGE_REQUEST_TARGET_BRANCH_NAME}"
        oxide-sloc analyze ".sloc-base/$[[ inputs.scan-path ]]" --activity-window 0 --quiet \
          --json-out "${OUT_DIR}/base.json"
        git worktree remove --force .sloc-base || true
        if [ -n "${SLOC_VCS_TOKEN:-}" ]; then
          oxide-sloc pr-comment "${OUT_DIR}/result.json" --baseline "${OUT_DIR}/base.json" \
            --provider gitlab --api-url "${CI_SERVER_URL}" \
            --repo "${CI_PROJECT_ID}" --pr-number "${CI_MERGE_REQUEST_IID}" \
            --token "${SLOC_VCS_TOKEN}" || true
        fi
      fi
    # Optional: ingest into a central oxide-sloc server.
    - |
      SERVER="$[[ inputs.server-url ]]"
      if [ -n "${SERVER}" ]; then
        oxide-sloc send "${OUT_DIR}/result.json" \
          --webhook-url "${SERVER}/api/ingest?label=${LABEL}"
      else
        echo "server-url not set — skipping ingest."
      fi
    # Optional: push artifacts to an external repository.
    - |
      REPO_TYPE="$[[ inputs.artifact-repo-type ]]"
      REPO_URL="$[[ inputs.artifact-repo-url ]]"
      if [ "${REPO_TYPE}" != "none" ] && [ -n "${REPO_URL}" ]; then
        ARTIFACT_REPO_TYPE="${REPO_TYPE}" \
        ARTIFACT_REPO_URL="${REPO_URL}" \
        ARTIFACT_REPO_PATH="oxide-sloc/${CI_PROJECT_PATH}/${CI_PIPELINE_ID}" \
        ARTIFACT_DIR="${OUT_DIR}" \
        ARTIFACT_FILES="result.json report.html report.csv report.xlsx" \
        bash ci/artifact-push.sh || echo "artifact-push failed (non-fatal)."
      else
        echo "artifact-repo-type not set — skipping artifact push."
      fi
  artifacts:
    paths:
      - sloc-out/
    expose_as: "SLOC report"
    expire_in: 7 days
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" || $CI_PIPELINE_SOURCE == "merge_request_event"'

# ── Fallback for GitLab < 15.11 (no spec:inputs) ──────────────────────────────
#
# Copy this job directly into your .gitlab-ci.yml and set the variables inline
# instead of using `include: … inputs:`:
#
#   sloc-analysis:
#     stage: test
#     image: rust:latest
#     variables:
#       SLOC_PRESET: "default"
#       SLOC_SERVER: ""            # e.g. http://sloc.internal:4317
#       SLOC_LABEL: "${CI_PROJECT_PATH}"
