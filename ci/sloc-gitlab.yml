#       - |
#         oxide-sloc analyze . --json-out sloc-out/result.json --html-out sloc-out/report.html \
#           ${SLOC_PRESET:+--config ci/sloc-ci-${SLOC_PRESET}.toml}
#       - |
#         [ -n "${SLOC_SERVER}" ] && oxide-sloc send sloc-out/result.json \
#           --webhook-url "${SLOC_SERVER}/api/ingest?label=${SLOC_LABEL}" || true
#     artifacts:
#       paths: [sloc-out/]
#       expose_as: "SLOC report"
#       expire_in: 7 days
