# oxide-sloc CI configuration — strict / fail-fast
#
# Fails the pipeline if binary files are found in source paths.
# Good for enforcing clean source trees in automated review gates.
# Use with: oxide-sloc analyze ./src --config ci/sloc-ci-strict.toml

[discovery]
honor_ignore_files    = true
ignore_hidden_files   = true
follow_symlinks       = false
max_file_size_bytes   = 1048576
# `vendor`, `toolchain`, `python`, `.tools` hold committed offline build-tooling
# (split crate/rustc/cpython archives) — regeneratable blobs, never source. Pruning
# the whole subtree keeps self-scans fast and drops hundreds of skip warnings.
excluded_directories  = [".git", "node_modules", "target", ".venv", "__pycache__", "dist", "build", "vendor", "toolchain", "python", ".tools"]
# Belt-and-suspenders for the root-level split vendor archive parts (vendor.tar.gz.aa…)
# and large committed doc binaries, which are otherwise read+stat'd only to be skipped.
exclude_globs         = ["vendor.tar.gz.*", "docs/screenshots/**", "docs/*.pptx", "docs/*.pdf"]

[analysis]
enabled_languages             = []           # empty = autodetect all
extension_overrides           = {}
shebang_detection             = true
mixed_line_policy             = "separate_mixed_category"
python_docstrings_as_comments = true
generated_file_detection      = true
minified_file_detection       = true
vendor_directory_detection    = true
include_lockfiles             = false
binary_file_behavior          = "fail"    # pipeline fails if binaries found in source
decode_failure_behavior       = "warn_skip"
parse_failure_behavior        = "warn_skip"
attribution                   = true         # per-author code ownership via git blame (on)
activity_window_days          = 90           # Git Hotspots window in days (0 disables)
style_col_threshold           = 100          # tighter N-col compliance gate than the 80 default

[reporting]
report_title               = "oxide-sloc Strict CI Gate"
include_summary_charts     = true
include_skipped_files_section = true
include_warnings_section   = true
