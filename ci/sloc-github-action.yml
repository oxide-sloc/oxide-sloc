# oxide-sloc GitHub Actions integration
#
# Drop this into your repo's .github/workflows/ directory.
# Set SLOC_SERVER as a repository variable (Settings → Variables → Actions)
# and optionally SLOC_API_KEY as a repository secret.
#
# Artifact repository push (optional):
#   Set ARTIFACT_REPO_TYPE as a repository variable and ARTIFACT_REPO_URL,
#   ARTIFACT_REPO_PATH, ARTIFACT_REPO_EXTRA as needed.  For authenticated repos
#   set ARTIFACT_REPO_USER / ARTIFACT_REPO_PASS as repository secrets.
#   Supported backends: artifactory | nexus | nexus2 | s3 | minio | azure-blob | generic-http
#   See ci/artifact-push.sh and docs/ci-integrations.md for full details.
#
# How it works:
#   1. oxide-sloc analyze runs inside the CI runner — no network call to the server.
#   2. oxide-sloc send POSTs the result JSON to /api/ingest on your server.
#   3. (optional) ci/artifact-push.sh pushes JSON/HTML to the artifact repository.
#   4. The server renders HTML, stores the artifact, and the scan appears in /view-reports.

name: SLOC Analysis

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  sloc:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Install oxide-sloc
        run: cargo install oxide-sloc --locked

      - name: Analyze
        run: |
          mkdir -p sloc-out
          oxide-sloc analyze . \
            --json-out sloc-out/result.json \
            --html-out sloc-out/report.html \
            --activity-window 90 \
            --xlsx-out sloc-out/report.xlsx
          # Additional options you can add (all optional):
          #   --csv-out sloc-out/report.csv          # CSV summary
          #   --coverage-file coverage/lcov.info     # attach per-file coverage
          #   --style-col-threshold 100              # N-col compliance chip (80|100|120)
          #   --max-complexity 15                    # exit 6 if any file exceeds it
          #   --no-duplicates                        # drop duplicate files from totals
          #   --no-attribution                       # skip git-blame ownership pass
          #   --mixed-line-policy code-and-comment   # mixed-line counting policy
          #   --config .oxide-sloc.toml              # load a preset / config file

      - name: Upload to oxide-sloc server
        if: vars.SLOC_SERVER != ''
        env:
          SLOC_SERVER: ${{ vars.SLOC_SERVER }}
          SLOC_API_KEY: ${{ secrets.SLOC_API_KEY }}
        run: |
          oxide-sloc send sloc-out/result.json \
            --webhook-url "${SLOC_SERVER}/api/ingest?label=${{ github.repository }}" \
            ${SLOC_API_KEY:+--webhook-token "${SLOC_API_KEY}"}

      - name: Push to artifact repository
        if: vars.ARTIFACT_REPO_TYPE != '' && vars.ARTIFACT_REPO_TYPE != 'none' && vars.ARTIFACT_REPO_URL != ''
        env:
          ARTIFACT_REPO_TYPE:  ${{ vars.ARTIFACT_REPO_TYPE }}
          ARTIFACT_REPO_URL:   ${{ vars.ARTIFACT_REPO_URL }}
          ARTIFACT_REPO_PATH:  ${{ vars.ARTIFACT_REPO_PATH || format('oxide-sloc/{0}/{1}', github.repository, github.run_number) }}
          ARTIFACT_REPO_EXTRA: ${{ vars.ARTIFACT_REPO_EXTRA }}
          ARTIFACT_REPO_USER:  ${{ secrets.ARTIFACT_REPO_USER }}
          ARTIFACT_REPO_PASS:  ${{ secrets.ARTIFACT_REPO_PASS }}
          ARTIFACT_DIR:        sloc-out
          ARTIFACT_FILES:      "result.json report.html"
        run: bash ci/artifact-push.sh

      - name: Archive result
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sloc-result
          path: sloc-out/
          retention-days: 7
