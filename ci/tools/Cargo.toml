[package]
name = "ci-tools"
version = "0.1.0"
edition = "2021"
publish = false

# This package is never built or published.  It exists solely so that
# `cargo vendor --sync ci/tools/Cargo.toml` includes the listed tools'
# source trees in the vendor.tar.gz.* parts, making them installable on air-gapped
# agents with `cargo install --offline <crate-name>`.
#
# To add a new tool: append it here, re-run `bash scripts/internal/update-vendor.sh`,
# then commit vendor.tar.gz.* + vendor.checksums.sha256.

[dependencies]
# Bumped 0.8 -> 0.9 to pull ruzstd >=0.9 and clear RUSTSEC-2026-0344
# (decompression-bomb OOM in ruzstd 0.8.x). Dev-tooling only; never shipped.
cargo-llvm-cov = "0.9"
cargo-nextest = "0.9"
# cargo-nextest pulls in `locked-tripwire`, a crate whose high-numbered
# release (0.1.1002) is a poison pill that compile_error!s unless nextest is
# installed with --locked. `cargo vendor` re-resolves and always picks that
# one, so the vendored offline install fails. Pin the benign release; do not
# switch the pipeline to --locked (nextest's bundled lock wants chrono
# 0.4.44, which the vendor set does not carry).
locked-tripwire = "=0.1.0"
tar = "0.4.46"

# Prevents cargo from treating this package as a member of the parent workspace.
[workspace]
