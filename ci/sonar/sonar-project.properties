# ─────────────────────────────────────────────────────────────────────────────
# oxide-sloc — SonarQube project configuration
#
# The scanner is invoked from the workspace root (mounted at /usr/src in the
# Docker container).  All relative paths below are anchored to the workspace
# root.  The Jenkinsfile passes:
#
#   -Dproject.settings=ci/sonar/sonar-project.properties
#   -Dsonar.host.url=${SONAR_URL}          (Jenkins build parameter; default http://localhost:9000)
#
# NOTE: sonar.projectVersion is kept in sync with [workspace.package].version
# in Cargo.toml — update both when cutting a release.
# ─────────────────────────────────────────────────────────────────────────────

# ── Project identity ──────────────────────────────────────────────────────────
sonar.projectKey=oxide-sloc
sonar.projectName=oxide-sloc
sonar.projectVersion=1.6.19
sonar.projectDescription=Source line analysis tool — CLI, web UI, HTML/PDF reports, and CI/CD integration

# ── Links ─────────────────────────────────────────────────────────────────────
sonar.links.homepage=https://github.com/oxide-sloc/oxide-sloc
sonar.links.scm=https://github.com/oxide-sloc/oxide-sloc
sonar.links.ci=https://github.com/oxide-sloc/oxide-sloc/actions
sonar.links.issue=https://github.com/oxide-sloc/oxide-sloc/issues

# ── Source encoding ───────────────────────────────────────────────────────────
sonar.sourceEncoding=UTF-8

# ── Source roots ──────────────────────────────────────────────────────────────
# Scope analysis to the Rust workspace crates; keeps shell scripts, TOML,
# Askama HTML templates, and the vendor/ tree out of the source set entirely.
sonar.sources=crates

# Test sources. sonar.tests MUST supply a root that physically contains the test
# files: sonar.test.inclusions (below) only DISQUALIFIES a matching file from main
# sources — it never PROMOTES a file into the test scope on its own. With no root,
# matching files are indexed as neither main nor test, and the scanner says so
# ("The property \"sonar.tests\" is not set." + "External issues ignored for N
# unknown files."). Point it at the workspace root, the same as sonar.sources; the
# test.inclusions globs then classify which files under it are tests, so new crates
# are covered automatically without an explicit per-crate list to rot here.
# Overlapping sonar.sources / sonar.tests roots are safe — the scanner auto-appends
# test.inclusions to the excluded-main-sources set (visible in its own log).
sonar.tests=crates

# ── File inclusions / exclusions ──────────────────────────────────────────────
# Only Rust files counted as production source; non-Rust assets (JS bundles,
# HTML templates, corpus .c/.py/.go/.ts fixtures) are excluded.
sonar.inclusions=**/*.rs

# Patterns that classify a file as test code rather than production code.
sonar.test.inclusions=\
  **/tests/**/*.rs,\
  **/*_test.rs,\
  **/test_*.rs

# Corpus fixtures are intentionally non-idiomatic and must not be analyzed at all.
# sonar.exclusions (below) only governs MAIN sources; now that test.inclusions
# classifies test code workspace-wide, the corpus .rs fixtures would be picked up
# as TEST sources unless excluded here too. Keep this in sync with the corpus entry
# in sonar.exclusions.
sonar.test.exclusions=\
  **/tests/corpus/**

# Artefact directories, test corpus fixtures, and lock/archive files are never analyzed.
# The corpus tree contains intentionally non-idiomatic code (e.g. empty Python functions)
# that would generate false-positive findings against production-code rules.
sonar.exclusions=\
  target/**,\
  vendor/**,\
  out/**,\
  **/tests/corpus/**,\
  testing/fixtures/**,\
  **/*.lock,\
  **/*.tar.xz,\
  **/*.tar.gz,\
  **/*.sha256

# Don't apply coverage requirements or duplication detection to test code.
sonar.coverage.exclusions=\
  **/tests/**,\
  **/benches/**

sonar.cpd.exclusions=\
  **/tests/**,\
  **/benches/**

# ── External issues (Clippy → SonarQube generic format) ──────────────────────
# Generated by the Jenkinsfile SonarQube scan stage:
#   cargo clippy --message-format=json | scripts/clippy_to_sonar.py
# Path is relative to workspace root.
sonar.externalIssuesReportPaths=clippy-sonar.json

# Disable the bundled Rust sensor's own clippy runner.  The sonarsource/sonar-scanner-cli
# image does not have cargo, so that sensor throws an IOException on every scan.
# All Clippy findings reach SonarQube through the external-issues import above instead.
sonar.rust.clippy.enabled=false

# ── Test coverage ─────────────────────────────────────────────────────────────
# Populated by ci/sonar/generate-coverage.sh (cargo-llvm-cov preferred,
# cargo-tarpaulin as fallback).  The scanner silently skips a report file
# that is absent — safe to leave these set even on runs without coverage.
#
# sonar.coverageReportPaths is the Generic Coverage Report format — NOT Cobertura.
# sonar-coverage.xml is Cobertura XML (produced by cargo llvm-cov --cobertura),
# so that property caused the scan to abort with "Error during parsing of the
# generic coverage report".  It is intentionally disabled here.
#
# sonar.lcov.reportPaths is the JS/TS LCOV property and is ignored by the Rust
# analyzer.  The correct key for SonarQube's Rust plugin is sonar.rust.lcov.reportPaths.
# Verify against the running server with:
#   curl -u "$SONAR_TOKEN:" \
#     'http://<sonar-host>:9000/api/settings/list_definitions' \
#     | jq '.definitions[] | select((.subCategory//"")=="Rust" or (.category//"")=="Coverage")
#                          | {key,name,description}'
sonar.rust.lcov.reportPaths=coverage/lcov.info

# ── SCM / blame ───────────────────────────────────────────────────────────────
# Git blame data drives "introduced by" attribution and new-code period tracking.
# forceReloadAll=false lets the scanner use its blame cache for unchanged files.
sonar.scm.provider=git
sonar.scm.exclusions.disabled=false
sonar.scm.forceReloadAll=false

# ── Quality gate ─────────────────────────────────────────────────────────────
# Fail the scanner (non-zero exit) when the server-side quality gate is not met,
# so the Jenkins stage can propagate the failure back to the build.
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300

# ── Analysis cache ────────────────────────────────────────────────────────────
# Reuse sensor output from the prior analysis; cuts scan time on incremental runs.
sonar.analysisCache.enabled=true

# ── Issue suppressions ────────────────────────────────────────────────────────
# Intentionally NONE. SonarQube's analysis-level issue-ignore mechanism
# (sonar.issue.ignore.multicriteria / .ruleKey / .resourceKey) is INERT on this
# server: verified across multiple full scans — including a server-side
# api/settings entry and a universal ruleKey=* + resourceKey=**/* — no
# IssueExclusions sensor runs, so nothing is suppressed. (File-level
# sonar.exclusions / sonar.test.exclusions above DO work; it is specifically the
# issue-level ignore that has no mechanism behind it.) The former e1/e2/e3 block was
# therefore dead config and was removed rather than left looking effective.
# Where suppression is still wanted, it is applied where it actually takes effect:
#   - Clippy lints on TEST code + clippy::multiple_crate_versions (old e1/e2 intent):
#     filtered at the source in scripts/internal/clippy_to_sonar.py, before findings
#     are ever imported. Under the documented CI clippy flags test code emits zero
#     findings anyway, so this only matters if the lint set is tightened.
#   - rust:S3776 on test code (old e3 intent): a native rule — change it in the
#     server-side quality profile, or accept it (the indexed test files add only a
#     handful of native findings; coverage/CPD already exclude **/tests/**).

# ── Duplication detection tuning ─────────────────────────────────────────────
# Minimum token count before two blocks are flagged as duplicated.
# Default is 100; lowering it finds smaller clones at the cost of more noise.
sonar.cpd.rust.minimumTokens=80
