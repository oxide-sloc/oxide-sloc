# Put Jenkins behind HTTPS with nginx — durable fix for the browser's
# "insecure download blocked" warning on plain-HTTP servers.
#
# 1. Generate a cert (self-signed for a homelab is fine; browsers warn once):
#      sudo mkdir -p /etc/nginx/tls
#      sudo openssl req -x509 -newkey rsa:2048 -nodes -days 825 \
#        -keyout /etc/nginx/tls/jenkins.key -out /etc/nginx/tls/jenkins.crt \
#        -subj "/CN=10.0.0.8" -addext "subjectAltName=IP:10.0.0.8"
# 2. Drop this file in /etc/nginx/conf.d/ (edit server_name + cert paths).
# 3. sudo nginx -t && sudo systemctl reload nginx
# 4. Jenkins → Manage Jenkins → System → Jenkins URL → https://10.0.0.8/
#
# Jenkins uses WebSockets (agents, Blue Ocean), so the Upgrade/Connection
# headers below are required — without them long-running UI features hang.

# conf.d/*.conf files are included inside the http{} block, so these
# http-context directives (map, upstream) are valid right here — the file is
# self-contained and passes `nginx -t` on its own.
# Only proxy the WebSocket upgrade Jenkins actually needs (agents / Blue Ocean).
# Mapping every other Upgrade value — notably `h2c` — to an empty Connection
# blocks HTTP/2-cleartext (h2c) smuggling past this reverse proxy into the
# backend, instead of blindly forwarding any requested upgrade.
map $http_upgrade $connection_upgrade {
    default    "";
    websocket  upgrade;
}

upstream jenkins {
    server 127.0.0.1:8080 fail_timeout=0;
    keepalive 32;
}

server {
    listen 80;
    server_name 10.0.0.8;
    return 301 https://$host$request_uri;   # force HTTPS
}

server {
    listen 443 ssl;
    http2 on;
    server_name 10.0.0.8;

    ssl_certificate     /etc/nginx/tls/jenkins.crt;
    ssl_certificate_key /etc/nginx/tls/jenkins.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Report artifacts can be large; don't cap uploads/downloads.
    client_max_body_size 0;

    location / {
        proxy_pass          http://jenkins;
        proxy_http_version  1.1;

        proxy_set_header    Host              $host;
        proxy_set_header    X-Real-IP         $remote_addr;
        proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto $scheme;   # tells Jenkins it's https
        proxy_set_header    X-Forwarded-Host  $host;
        proxy_set_header    X-Forwarded-Port  443;

        # WebSocket support (required by Jenkins agents / Blue Ocean).
        proxy_set_header    Upgrade    $http_upgrade;
        proxy_set_header    Connection $connection_upgrade;

        proxy_buffering     off;
        proxy_request_buffering off;
        proxy_read_timeout  1d;   # keep long-poll / websocket connections alive
    }
}
