[package]
name = "oxide-sloc"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
readme.workspace = true
rust-version.workspace = true
description.workspace = true
keywords.workspace = true
categories.workspace = true

[[bin]]
name = "oxide-sloc"
path = "src/main.rs"

[lib]
name = "oxide_sloc"
path = "src/lib.rs"

# docs.rs builds on Linux without a display server or GTK; disable native-dialog
# so the rfd dependency (which requires GTK3) is not compiled during doc builds.
[package.metadata.docs.rs]
no-default-features = true

# `native-dialog` (the rfd native directory picker for the server-host `/pick-directory`
# route) is intentionally NOT in `default`. On Linux rfd drags in wayland-client /
# wayland-protocols / GTK system libraries, which are pointless for a browser-based web
# UI and force GUI deps onto headless/air-gapped builds. It is enabled by default only on
# Windows (below), where rfd is win32-only and needs no extra system libraries. Linux
# users who want the native picker can opt in with `--features native-dialog`.
[features]
default = []
native-dialog = ["sloc-web/native-dialog"]

[dependencies]
anyhow.workspace = true
base64.workspace = true
rustls.workspace = true
chrono.workspace = true
clap.workspace = true
clap_complete.workspace = true
globset.workspace = true
uuid.workspace = true
lettre.workspace = true
reqwest.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
sloc-config = { path = "../sloc-config", version = "1.6.15" }
sloc-core = { path = "../sloc-core", version = "1.6.15" }
sloc-git = { path = "../sloc-git", version = "1.6.15" }
sloc-report = { path = "../sloc-report", version = "1.6.15" }
sloc-web = { path = "../sloc-web", version = "1.6.15" }

# On Windows the native directory picker (rfd) is win32-only and pulls in no extra system
# libraries, so keep it on by default there. Feature unification means this turns on
# `native-dialog` for Windows builds without it being a cross-platform default.
[target.'cfg(windows)'.dependencies]
sloc-web = { path = "../sloc-web", version = "1.6.15", features = ["native-dialog"] }
