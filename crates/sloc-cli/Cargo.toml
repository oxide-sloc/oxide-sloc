[package]
name = "oxide-sloc"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
readme.workspace = true
rust-version.workspace = true
description.workspace = true
keywords.workspace = true
categories.workspace = true

[[bin]]
name = "oxide-sloc"
path = "src/main.rs"

[lib]
name = "oxide_sloc"
path = "src/lib.rs"

# docs.rs builds on Linux without a display server or GTK; disable native-dialog
# so the rfd dependency (which requires GTK3) is not compiled during doc builds.
[package.metadata.docs.rs]
no-default-features = true

# ── OS packages (inert to cargo; read only by cargo-deb / cargo-generate-rpm) ──
# Build a .deb:  cargo build --release -p oxide-sloc && cargo deb -p oxide-sloc --no-build
# Build a .rpm:  cargo build --release -p oxide-sloc && cargo generate-rpm -p crates/sloc-cli
# Both reuse the already-built target/release/oxide-sloc; run from the workspace root.
[package.metadata.deb]
maintainer = "Nima Shafie <nimzshafie@gmail.com>"
copyright = "2026, Nima Shafie <nimzshafie@gmail.com>"
license-file = ["LICENSE", "0"]
section = "devel"
priority = "optional"
depends = "$auto"
extended-description = """\
oxide-sloc is a local code metrics workbench: IEEE 1045-1992 physical SLOC analysis, \
lexical unit-test detection, coverage import, COCOMO I estimation, approximate cyclomatic \
complexity, git hotspots, and per-author code ownership, with a CLI, a localhost web UI, and \
HTML/PDF reports."""
assets = [
  ["target/release/oxide-sloc", "usr/bin/", "755"],
  ["README.md", "usr/share/doc/oxide-sloc/README.md", "644"],
]

[package.metadata.generate-rpm]
summary = "Local code metrics workbench (SLOC, tests, coverage, complexity, hotspots)"
assets = [
  { source = "target/release/oxide-sloc", dest = "/usr/bin/oxide-sloc", mode = "755" },
  { source = "README.md", dest = "/usr/share/doc/oxide-sloc/README.md", mode = "644" },
  { source = "LICENSE", dest = "/usr/share/licenses/oxide-sloc/LICENSE", mode = "644" },
]

# `native-dialog` (the rfd native directory picker for the server-host `/pick-directory`
# route) is intentionally NOT in `default`. On Linux rfd drags in wayland-client /
# wayland-protocols / GTK system libraries, which are pointless for a browser-based web
# UI and force GUI deps onto headless/air-gapped builds. It is enabled by default only on
# Windows (below), where rfd is win32-only and needs no extra system libraries. Linux
# users who want the native picker can opt in with `--features native-dialog`.
[features]
default = []
native-dialog = ["sloc-web/native-dialog"]

[dependencies]
anyhow.workspace = true
base64.workspace = true
rustls.workspace = true
chrono.workspace = true
clap.workspace = true
clap_complete.workspace = true
globset.workspace = true
uuid.workspace = true
lettre.workspace = true
reqwest.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
sloc-config = { path = "../sloc-config", version = "1.6.27" }
sloc-core = { path = "../sloc-core", version = "1.6.27" }
sloc-git = { path = "../sloc-git", version = "1.6.27" }
sloc-report = { path = "../sloc-report", version = "1.6.27" }
sloc-web = { path = "../sloc-web", version = "1.6.27" }

# On Windows the native directory picker (rfd) is win32-only and pulls in no extra system
# libraries, so keep it on by default there. Feature unification means this turns on
# `native-dialog` for Windows builds without it being a cross-platform default.
[target.'cfg(windows)'.dependencies]
sloc-web = { path = "../sloc-web", version = "1.6.27", features = ["native-dialog"] }
