openapi: "3.1.0"

info:
  title: oxide-sloc REST API
  version: "1.6.23"
  description: |
    Machine-readable code metrics API for oxide-sloc — IEEE 1045-1992 SLOC
    analysis, unit test detection, and coverage reporting across 60 languages.

    **Authentication**: When `SLOC_API_KEY` is set on the server, all endpoints
    except `/healthz`, `/readyz`, `/api/health`, `/api/version`,
    `/api/openapi.yaml`, and `/badge/{metric}` require `Authorization: Bearer <key>`.

    The `/webhooks/*` receivers are a deliberate exception: they are always public
    and are NOT bearer-authenticated. Instead each inbound event is authenticated
    per-schedule by an HMAC-SHA256 signature over the exact request body using the
    schedule's `webhook_secret`. This lets any upstream CI — even a legacy pipeline
    with nothing but `curl` — trigger a scan without holding the server API key.

    **Note**: `info.version` is rewritten to the running binary's version at request
    time, so a live `/api/openapi.yaml` always reports the deployed version even if
    the committed spec file lags.

    **Base URL**: defaults to `http://127.0.0.1:4317`. Override with `SLOC_BIND`
    or the `--bind` flag when starting the server.
  license:
    name: AGPL-3.0-or-later
    url: https://www.gnu.org/licenses/agpl-3.0.html
  contact:
    url: https://github.com/oxide-sloc/oxide-sloc
  x-generated-by: "Claude (claude-sonnet-4-6) — built entirely by AI"

# The server binds to loopback over plain HTTP by default: traffic never leaves
# the host, so the bearer token is not exposed on the wire. Production/off-host
# deployments enable TLS by setting SLOC_TLS_CERT / SLOC_TLS_KEY (see auth notes).
servers:
  - url: http://127.0.0.1:4317
    description: Default local server (loopback)

security:
  - bearerAuth: []

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: >
        Set SLOC_API_KEY on the server to enable auth. Pass the same value as
        a Bearer token. Public endpoints work without a token.

  schemas:
    LanguageRow:
      type: object
      description: Per-language metric summary for a scan run.
      required: [name, files, code_lines, comment_lines, blank_lines]
      properties:
        name:
          type: string
          example: Rust
        files:
          type: integer
          format: int64
          example: 42
        code_lines:
          type: integer
          format: int64
          example: 8432
        comment_lines:
          type: integer
          format: int64
          example: 312
        blank_lines:
          type: integer
          format: int64
          example: 890
        functions:
          type: integer
          format: int64
          example: 87
        classes:
          type: integer
          format: int64
          example: 5
        variables:
          type: integer
          format: int64
          example: 134
        imports:
          type: integer
          format: int64
          example: 61
        test_count:
          type: integer
          format: int64
          example: 23

    SummaryPayload:
      type: object
      description: Aggregate totals for a scan run.
      required: [files_analyzed, code_lines, comment_lines, blank_lines, total_physical_lines]
      properties:
        files_analyzed:
          type: integer
          format: int64
          example: 98
        files_skipped:
          type: integer
          format: int64
          example: 2
        code_lines:
          type: integer
          format: int64
          example: 12345
        comment_lines:
          type: integer
          format: int64
          example: 890
        blank_lines:
          type: integer
          format: int64
          example: 1200
        total_physical_lines:
          type: integer
          format: int64
          example: 14435
        functions:
          type: integer
          format: int64
          example: 201
        classes:
          type: integer
          format: int64
          example: 18
        variables:
          type: integer
          format: int64
          example: 347
        imports:
          type: integer
          format: int64
          example: 112
        test_count:
          type: integer
          format: int64
          example: 47
        test_assertion_count:
          type: integer
          format: int64
          example: 183
        test_suite_count:
          type: integer
          format: int64
          example: 12

    MetricsResponse:
      type: object
      description: Full metrics payload for a single scan run.
      required: [run_id, timestamp, project, summary, languages]
      properties:
        run_id:
          type: string
          format: uuid
          example: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
        timestamp:
          type: string
          format: date-time
          example: "2026-05-18T14:32:00Z"
        project:
          type: string
          description: Absolute path of the scanned root directory.
          example: "/home/user/my-project"
        summary:
          $ref: "#/components/schemas/SummaryPayload"
        languages:
          type: array
          items:
            $ref: "#/components/schemas/LanguageRow"

    HistoryEntry:
      type: object
      description: One row in the scan history time-series.
      required: [run_id, timestamp, code_lines, comment_lines, blank_lines]
      properties:
        run_id:
          type: string
          format: uuid
        run_id_short:
          type: string
          description: First 8 characters of run_id for display purposes.
          example: "3fa85f64"
        timestamp:
          type: string
          format: date-time
        commit:
          type: string
          nullable: true
          example: "abc1234"
        branch:
          type: string
          nullable: true
          example: "main"
        tags:
          type: array
          items:
            type: string
        nearest_tag:
          type: string
          nullable: true
          example: "v1.5.5"
        code_lines:
          type: integer
          format: int64
        comment_lines:
          type: integer
          format: int64
        blank_lines:
          type: integer
          format: int64
        functions:
          type: integer
          format: int64

    SubmoduleEntry:
      type: object
      description: Per-submodule metric summary.
      required: [name, relative_path, files_analyzed, code_lines]
      properties:
        name:
          type: string
          example: "vendor/some-lib"
        relative_path:
          type: string
          example: "vendor/some-lib"
        files_analyzed:
          type: integer
          format: int64
        code_lines:
          type: integer
          format: int64
        comment_lines:
          type: integer
          format: int64
        blank_lines:
          type: integer
          format: int64

    IngestResponse:
      type: object
      description: Result of a successful ingest operation.
      required: [run_id, view_url]
      properties:
        run_id:
          type: string
          format: uuid
        view_url:
          type: string
          format: uri
          example: "http://127.0.0.1:4317/runs/result/3fa85f64-5717-4562-b3fc-2c963f66afa6"

    AsyncRunStatus:
      type: object
      description: Status of an async analysis run.
      required: [state]
      properties:
        state:
          type: string
          enum: [running, complete, failed, cancelled]
        elapsed_secs:
          type: integer
          description: Present when state=running.
        run_id:
          type: string
          description: Present when state=complete. Use this to fetch results.
        message:
          type: string
          description: Present when state=failed.

    VersionResponse:
      type: object
      required: [name, version]
      properties:
        name:
          type: string
          example: "oxide-sloc"
        version:
          type: string
          example: "1.5.5"
        git_sha:
          type: string
          description: Short git commit the binary was built from, or "unknown".
          example: "3a0f123"
        build_time:
          type: string
          description: RFC 3339 UTC build timestamp.
          example: "2026-08-11T12:00:00Z"

    HealthResponse:
      type: object
      required: [status, name, version, checks]
      properties:
        status:
          type: string
          enum: [ok, degraded]
          description: "\"ok\" when every dependency check passes; \"degraded\" otherwise."
          example: ok
        name:
          type: string
          example: "oxide-sloc"
        version:
          type: string
          example: "1.6.15"
        git_sha:
          type: string
          example: "3a0f123"
        build_time:
          type: string
          example: "2026-08-11T12:00:00Z"
        uptime_seconds:
          type: integer
          format: int64
          description: Seconds since the server process started.
          example: 3600
        checks:
          type: object
          additionalProperties:
            type: boolean
          description: Per-dependency pass/fail flags.
          example:
            registry_writable: true
            output_dir_writable: true

    ReadinessResponse:
      type: object
      required: [status, checks]
      properties:
        status:
          type: string
          enum: [ready, not_ready]
          example: ready
        checks:
          type: object
          additionalProperties:
            type: boolean
          example:
            registry_writable: true
            output_dir_writable: true

    Error:
      type: object
      properties:
        error:
          type: string

    CiBuildCompletePayload:
      type: object
      description: >
        Provider-agnostic build-completion event posted to /webhooks/ci. Only
        `repo_url` is required; `repo_url` + `branch` are how the event is matched
        to a configured scan schedule. `status` gates on success and
        `upstream.build_id` enables idempotent de-duplication of retried deliveries.
      required: [repo_url]
      properties:
        repo_url:
          type: string
          format: uri
          example: "https://git.example.com/org/myapp.git"
        branch:
          type: string
          nullable: true
          example: "main"
        commit_sha:
          type: string
          nullable: true
          description: Exact commit to scan. Omit/blank to scan the branch tip.
          example: ""
        status:
          type: string
          nullable: true
          description: >
            Upstream build result. Recognised success tokens (case-insensitive):
            success, succeeded, passed, pass, ok, green, completed, 0, true.
            Anything else is skipped.
          example: "success"
        upstream:
          $ref: "#/components/schemas/CiUpstream"

    CiUpstream:
      type: object
      description: Provenance of the upstream build (logging + idempotency key).
      properties:
        system:
          type: string
          example: "jenkins"
        job:
          type: string
          example: "myapp-pipeline"
        build_id:
          type: string
          description: Enables de-duplication of repeat deliveries.
          example: "1234"
        url:
          type: string
          format: uri
          example: "https://ci.example.com/job/1234"

    CreateScheduleRequest:
      type: object
      description: Register a scan schedule that inbound webhook events match against.
      required: [label, repo_url, branch, kind]
      properties:
        label:
          type: string
          example: "myapp"
        repo_url:
          type: string
          format: uri
          example: "https://git.example.com/org/myapp.git"
        branch:
          type: string
          example: "main"
        kind:
          type: string
          enum: [webhook, poll]
          description: >
            webhook — scan when a matching signed event arrives;
            poll — scan the branch tip every `interval_secs`.
        provider:
          type: string
          nullable: true
          enum: [github, gitlab, bitbucket, any]
          default: any
        interval_secs:
          type: integer
          format: int64
          nullable: true
          description: Poll interval in seconds (kind=poll only; defaults to 300).
          example: 300
        webhook_secret:
          type: string
          nullable: true
          description: HMAC-SHA256 key that /webhooks/* events for this schedule must be signed with.

    ScanSchedule:
      type: object
      description: A stored scan schedule.
      required: [id, label, repo_url, branch, kind, provider, enabled]
      properties:
        id:
          type: string
          format: uuid
        label:
          type: string
        repo_url:
          type: string
          format: uri
        branch:
          type: string
        kind:
          type: string
          enum: [webhook, poll]
        provider:
          type: string
          enum: [github, gitlab, bitbucket, any]
        interval_secs:
          type: integer
          format: int64
          nullable: true
        last_scan_sha:
          type: string
          nullable: true
        last_scan_at:
          type: string
          format: date-time
          nullable: true
        last_run_id:
          type: string
          nullable: true
        enabled:
          type: boolean

paths:
  /healthz:
    get:
      operationId: healthCheck
      summary: Liveness probe
      description: >-
        Returns "ok" when the process is up and servicing requests. Trivial and
        dependency-free — suitable for container/systemd liveness probes. No
        authentication required.
      security: []
      tags: [Health]
      responses:
        "200":
          description: Server is alive.
          content:
            text/plain:
              schema:
                type: string
                example: ok

  /readyz:
    get:
      operationId: readinessCheck
      summary: Readiness probe
      description: >-
        Returns 200 when the server can persist its registry and write scan
        artifacts, 503 otherwise. Distinct from /healthz (liveness) so
        orchestrators can hold traffic off a process that is up but not ready.
        No authentication required.
      security: []
      tags: [Health]
      responses:
        "200":
          description: Server is ready to serve requests.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessResponse"
        "503":
          description: Server is up but a dependency check failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessResponse"

  /api/health:
    get:
      operationId: apiHealthCheck
      summary: Structured health/status
      description: >-
        Structured health and build information. Always answers 200 when the
        process is responsive; the `status` field is "ok" when every dependency
        check passes and "degraded" otherwise. No authentication required.
      security: []
      tags: [Health]
      responses:
        "200":
          description: Health and status details.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /api/version:
    get:
      operationId: getVersion
      summary: Server version
      description: Returns the running oxide-sloc version. No authentication required.
      security: []
      tags: [Health]
      responses:
        "200":
          description: Version information.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VersionResponse"

  /api/openapi.yaml:
    get:
      operationId: getOpenApiSpec
      summary: OpenAPI specification
      description: Returns this OpenAPI 3.1 spec as YAML. No authentication required.
      security: []
      tags: [Health]
      responses:
        "200":
          description: OpenAPI spec.
          content:
            application/yaml:
              schema:
                type: string

  /api/metrics/latest:
    get:
      operationId: getMetricsLatest
      summary: Latest scan metrics
      description: >
        Returns the metrics from the most recent completed scan stored on this
        server. Returns 404 if no scans have been performed yet.
      tags: [Metrics]
      responses:
        "200":
          description: Metrics for the most recent scan.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetricsResponse"
        "404":
          description: No scans found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/metrics/{run_id}:
    get:
      operationId: getMetricsByRunId
      summary: Metrics for a specific run
      description: Returns the metrics for a scan identified by its UUID run_id.
      tags: [Metrics]
      parameters:
        - name: run_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: UUID of the scan run.
      responses:
        "200":
          description: Metrics for the requested run.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetricsResponse"
        "404":
          description: Run not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/metrics/history:
    get:
      operationId: getMetricsHistory
      summary: Scan history time-series
      description: >
        Returns time-ordered metrics for all stored scan runs. Useful for
        trend analysis and charting SLOC growth over time.
      tags: [Metrics]
      parameters:
        - name: root
          in: query
          required: false
          schema:
            type: string
          description: Filter to runs whose input root matches this path prefix.
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 100
          description: Maximum number of history entries to return.
      responses:
        "200":
          description: Ordered list of historical metric entries.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/HistoryEntry"

  /api/metrics/submodules:
    get:
      operationId: getMetricsSubmodules
      summary: Per-submodule metrics
      description: Returns per-submodule breakdown for the most recent scan.
      tags: [Metrics]
      responses:
        "200":
          description: List of submodule summaries.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SubmoduleEntry"
        "404":
          description: No scan data found.

  /api/ingest:
    post:
      operationId: ingestResult
      summary: Ingest an external analysis result
      description: >
        Accepts a complete AnalysisRun JSON document (the same format written
        by `oxide-sloc analyze --json-out`) and stores it in the server's run
        registry. The run then appears in /view-reports and is queryable via
        /api/metrics/{run_id}. Useful for CI pipelines that run oxide-sloc
        headlessly and want to push results to a shared server.
      tags: [Ingest]
      requestBody:
        required: true
        description: >
          A serialized AnalysisRun document. Must include at minimum the
          `tool`, `summary_totals`, `totals_by_language`, and `input_roots`
          fields.
        content:
          application/json:
            schema:
              type: object
              description: AnalysisRun JSON (see oxide-sloc JSON output format).
      responses:
        "200":
          description: Result accepted and stored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IngestResponse"
        "400":
          description: Invalid JSON or missing required fields.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/runs/{run_id}/status:
    get:
      operationId: getRunStatus
      summary: Poll async run status
      description: >
        Polls the status of an in-progress asynchronous scan triggered by
        POST /analyze. Poll until state becomes "complete" or "failed", then
        use the returned run_id to fetch results.
      tags: [Runs]
      parameters:
        - name: run_id
          in: path
          required: true
          schema:
            type: string
          description: The wait_id returned when the scan was submitted.
      responses:
        "200":
          description: Current status of the async run.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AsyncRunStatus"

  /badge/{metric}:
    get:
      operationId: getBadge
      summary: SVG metric badge
      description: >
        Returns a Shields.io-style SVG badge for the specified metric from the
        most recent scan. Suitable for embedding in README files. No
        authentication required.
      security: []
      tags: [Badges]
      parameters:
        - name: metric
          in: path
          required: true
          schema:
            type: string
            enum: [code-lines, files, comment-lines, blank-lines]
          description: The metric to display in the badge.
      responses:
        "200":
          description: SVG badge image.
          content:
            image/svg+xml:
              schema:
                type: string
        "404":
          description: No scan data available yet.

  /api/schedules:
    get:
      operationId: listSchedules
      summary: List scan schedules
      description: Returns all configured scan schedules (webhook and poll kinds).
      tags: [Schedules]
      responses:
        "200":
          description: The configured schedules.
          content:
            application/json:
              schema:
                type: object
                properties:
                  schedules:
                    type: array
                    items:
                      $ref: "#/components/schemas/ScanSchedule"
    post:
      operationId: createSchedule
      summary: Create a scan schedule
      description: >
        Register a schedule that inbound /webhooks/* events are matched to by
        `repo_url` + `branch`. For webhook kinds, set `webhook_secret` — it is the
        HMAC key the upstream trigger must sign events with.
      tags: [Schedules]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateScheduleRequest"
      responses:
        "201":
          description: Schedule created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScanSchedule"
    delete:
      operationId: deleteSchedule
      summary: Delete a scan schedule
      description: Removes the schedule with the given id.
      tags: [Schedules]
      parameters:
        - name: id
          in: query
          required: true
          schema:
            type: string
            format: uuid
          description: UUID of the schedule to delete.
      responses:
        "204":
          description: Schedule deleted (or did not exist).

  /webhooks/ci:
    post:
      operationId: ciBuildComplete
      summary: Provider-agnostic build-completion trigger
      description: >
        Launch a scan when any upstream CI build finishes. Public route secured
        per-schedule by HMAC (not the server API key), so even a legacy pipeline
        with only `curl` can drive it. The request body is signed HMAC-SHA256 with
        the matching schedule's `webhook_secret`. To keep the endpoint from acting
        as an oracle, an invalid signature returns the same 202 as success.
      security: []
      tags: [Webhooks]
      parameters:
        - name: X-Sloc-Signature
          in: header
          required: true
          schema:
            type: string
          description: "sha256=<hex> — HMAC-SHA256 of the exact request body."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CiBuildCompletePayload"
      responses:
        "202":
          description: >
            Event accepted — a scan was spawned, OR nothing matched / the signature
            was invalid (deliberately indistinguishable).
        "200":
          description: >
            A non-secret guard declined, e.g. {"status":"skipped","reason":"upstream
            build not successful"} or "duplicate upstream build".
        "400":
          description: Malformed JSON, or missing repo_url.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /webhooks/github:
    post:
      operationId: githubWebhook
      summary: GitHub push webhook receiver
      description: >
        Receives GitHub push events (X-GitHub-Event: push) and triggers a scan for
        a matching schedule. Public; secured by the schedule's HMAC secret via the
        X-Hub-Signature-256 header. Non-push events return 200 and are ignored.
      security: []
      tags: [Webhooks]
      responses:
        "202":
          description: Push accepted (or no match / bad signature — indistinguishable).
        "200":
          description: Non-push event ignored.
        "400":
          description: Missing X-GitHub-Event header or malformed body.

  /webhooks/gitlab:
    post:
      operationId: gitlabWebhook
      summary: GitLab push webhook receiver
      description: >
        Receives GitLab "Push Hook" / "Tag Push Hook" events and triggers a scan
        for a matching schedule. Public; secured by the schedule's HMAC secret.
      security: []
      tags: [Webhooks]
      responses:
        "202":
          description: Push accepted (or no match / bad signature — indistinguishable).
        "200":
          description: Non-push event ignored.
        "400":
          description: Missing X-GitLab-Event header or malformed body.

  /webhooks/bitbucket:
    post:
      operationId: bitbucketWebhook
      summary: Bitbucket push webhook receiver
      description: >
        Receives Bitbucket push events and triggers a scan for a matching schedule.
        Public; secured by the schedule's HMAC secret.
      security: []
      tags: [Webhooks]
      responses:
        "202":
          description: Push accepted (or no match / bad signature — indistinguishable).
        "400":
          description: Malformed body.

tags:
  - name: Health
    description: Health checks and server information. Always public.
  - name: Metrics
    description: Scan result metrics — latest, by run_id, or historical.
  - name: Ingest
    description: Push external analysis results into the server registry.
  - name: Runs
    description: Manage and poll asynchronous scan runs.
  - name: Badges
    description: SVG badges for embedding in documentation.
  - name: Schedules
    description: Scan schedules that inbound webhook/poll events are matched to.
  - name: Webhooks
    description: >
      Public, HMAC-secured receivers that let any upstream CI (GitHub, GitLab,
      Bitbucket, or a provider-agnostic build-complete event) trigger a scan.
