[package]
name = "sloc-web"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
rust-version.workspace = true
description = "Axum web UI and REST API for interactive local SLOC analysis"
readme = "README.md"
keywords.workspace = true
categories.workspace = true

[features]
native-dialog = ["dep:rfd"]

[dependencies]
rfd = { version = "0.17", optional = true }
prometheus.workspace = true
secrecy = { version = "0.10" }
serde_json = "1"
subtle = "2"
flate2 = "1"
tar = "0.4.46"
http-body = "1"
http-body-util = "0.1"
anyhow.workspace = true
base64.workspace = true
reqwest.workspace = true
askama.workspace = true
axum.workspace = true
chrono.workspace = true
hyper-util.workspace = true
rustls.workspace = true
rustls-pki-types.workspace = true
serde.workspace = true
toml.workspace = true
tokio.workspace = true
tokio-rustls.workspace = true
tower.workspace = true
tower-http.workspace = true
tracing.workspace = true
uuid = { workspace = true }
sloc-config = { path = "../sloc-config", version = "1.6.20" }
sloc-core = { path = "../sloc-core", version = "1.6.20" }
sloc-git = { path = "../sloc-git", version = "1.6.20" }
sloc-report = { path = "../sloc-report", version = "1.6.20" }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tempfile = "3"
serde_json = "1"
sloc-core = { path = "../sloc-core", version = "1.6.20" }
sloc-languages = { path = "../sloc-languages", version = "1.6.20" }
sloc-config = { path = "../sloc-config", version = "1.6.20" }
