[package]
name = "sloc-languages"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
rust-version.workspace = true
description = "Language detection and lexical SLOC analysis for 60 languages — IEEE 1045-1992 compliant"
readme = "README.md"
keywords.workspace = true
categories.workspace = true

[features]
tree-sitter = ["dep:tree-sitter", "dep:tree-sitter-c", "dep:tree-sitter-python"]

[dependencies]
serde.workspace = true
tree-sitter = { version = "0.27", optional = true }
tree-sitter-c = { version = "0.24", optional = true }
tree-sitter-python = { version = "0.25", optional = true }

[build-dependencies]
# tree-sitter grammar crates bring their own cc build scripts; nothing extra needed here.
